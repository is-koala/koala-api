      - "Onaylanmış bir yayının tamamlanması kalıcılaştırılamaz"
    then:
      - "Niyet en çok bir kez yayımlanır"
      - "Tamamlanamayan yayın deneme bütçesi harcanmadan yeniden denenebilir"
      - "Kaydedilen gerekçe sabit bir metindir, istisna metni değildir"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncDispatchIT.java#twoWorkersCannotPublishTheSameIntent"
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncDispatchIT.java#aConfirmedPublishWhoseCompletionCannotBePersistedRemainsReplayableWithoutSpendingFailureBudget"
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncDispatchIT.java#aBrokerFailureIsRetriedThenTerminalizedWithASanitizedReason"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; gönderim döngüsü River işine taşınır ve Faz 2'nin uygulama PR'ında gelir."

