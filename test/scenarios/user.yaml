    rule: >
      Parola sıfırlama isteği, adres kayıtlı olsun olmasın aynı yanıt gövdesini döndürür. Kayıtsız
      dalda da token üretme ve posta hazırlama maliyeti ödenir; üretilen token atılır ve posta
      gönderilmez.
    given:
      - "a@örnek kayıtlı; b@örnek kayıtlı değil"
    when:
      - "İki adres için de parola sıfırlama istenir"
    then:
      - "İki yanıt da başarı; gövdeleri bayt bayt aynı"
      - "Yalnız a@örnek'e posta gider"
      - "Kayıtsız dalda da token üretilir ve atılır; zamanlama eşitlenir"
