    rule: >
      Bir yayın niyeti yalnız bir işçi tarafından sahiplenilir ve en çok bir kez yayımlanır. Onaylanmış
      bir yayının tamamlanması kalıcılaştırılamazsa niyet, deneme bütçesi harcanmadan yeniden
      denenebilir kalır. Başarısızlık gerekçeleri sabit metinlerdir; hata metni yazılmaz.
