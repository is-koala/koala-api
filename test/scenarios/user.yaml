  - id: USR-021
    priority: P0
    title: Kullanıcı parolası personel parolasıyla aynı kurala uyar
    rule: >
      Parola belirleyen her yol aynı kuralı uygular: en az on beş, en çok yüz yirmi sekiz karakter.
      Karakter sınıfı kuralı yoktur. Var olan bir parolayı doğrulayan alanlar bu kurala tabi değildir.
    given:
      - "Kayıt tamamlama, parola sıfırlama ve parola değiştirme yolları"
    when:
      - "On beş karakterden kısa bir parola belirlenmek istenir"
      - "Yüz yirmi sekiz karakterden uzun bir parola belirlenmek istenir"
    then:
      - "İki istek de aynı parola kuralı hatasıyla reddedilir"
      - "Mevcut parolayı doğrulayan alanlar kurala bakılmadan olduğu gibi denenir"
    error: PASSWORD_POLICY_VIOLATION
    decision: "K12"
    target: >
      ADR-0025'in personel için kurduğu kural kullanıcıya da uygulanır (ADR-0029 Karar 4). Java'nın
      kuralı on iki kod noktası ve yetmiş iki bayttı; bayt sınırı bcrypt'ten geliyordu ve Go'da yok.
    source:
      - "src/main/java/com/exskylab/koala/core/validation/PasswordPolicy.java:1-20"
      - "src/test/java/com/exskylab/koala/core/validation/PasswordPolicyRulesTest.java#everyFieldThatSetsAPasswordCarriesTheOneSharedRule"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kullanıcı parola yolları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-022
    priority: P0
    title: Profil senkronu profil değişikliğiyle aynı transaction'da kuyruğa girer
    rule: >
      Profil değişikliği ödeme sağlayıcısına bildirilmek üzere bir giden kayıt (outbox) satırı yazar.
      Satır çağıranın transaction'ına katılır: ya profil değişikliği ve tam bir yayın niyeti birlikte
      işlenir ya da hiçbiri. Aynı kullanıcı için işlenmemiş bir niyet varsa yükü yerinde değiştirilir.
    given:
      - "Kullanıcı U'nun profili değişiyor"
    when:
      - "Çağıranın transaction'ı geri alınır"
      - "Ayrı bir akışta çağıranın transaction'ı işlenir"
      - "İşlenmemiş bir niyet varken profil yeniden değişir"
    then:
      - "Geri alınan akışta ne profil değişikliği ne yayın niyeti kalır"
      - "İşlenen akışta profil değişikliği ve tam olarak bir yayın niyeti birlikte kalıcı olur"
      - "İşlenmemiş niyetin yükü yerinde güncellenir; ikinci niyet açılmaz"
      - "Niyet, isteğin kaynağını (istek, kullanıcı, oturum, cihaz) taşır"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncOutboxAtomicityIT.java#rollingBackTheCallerTransactionLeavesNeitherProfileChangeNorPublishIntent"
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncOutboxAtomicityIT.java#callerSuccessMeansTheProfileChangeAndExactPublishIntentWereDurablyAcceptedTogether"
      - "src/test/java/com/exskylab/koala/business/concretes/UserProfileSyncOutboxAtomicityIT.java#theOriginatingRequestContextIsPersistedWithTheOutboxIntent"
      - "src/main/java/com/exskylab/koala/business/concretes/UserProfileSyncManager.java#enqueue"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; profil senkronu Faz 2'nin uygulama PR'ında gelir; yayın tarafı Faz 6'nın Iyzico istemcisine bağlanır."

