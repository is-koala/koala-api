    rule: >
      Kullanıcı mevcut parolasını bilerek parola değiştirdiğinde yalnız diğer oturumları kapanır,
      isteği yapan oturum açık kalır. Mevcut parola yanlışsa parola değişmez. Yeni parola mevcut
