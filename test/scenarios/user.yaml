# Kayıt, OTP, parola sıfırlama, profil ve profil senkronu senaryoları.
# Biçim: test/scenarios/README.md. Kaynak: Java origin/main (0cbbce69, okundu, koşturulmadı).
# ADR-0029 Karar 2-4 Java'dan bilinçli ayrılıkları taşır; o satırlarda `then` Java'nın bugünkü
# davranışı, `target` Go'nun hedefidir.

domain: user
id_prefix: USR
version: 0
scenarios:

  - id: USR-001
    priority: P0
    title: Kayıt başlatma adresin kayıtlı olup olmadığını söylemez
    rule: >
      Kayıt başlatma, adres kayıtlı olsun olmasın aynı yanıt gövdesini döndürür. Kayıtlı adres için
      hiçbir posta gönderilmez ve hiçbir bekleyen kayıt yazılmaz; kayıtsız adres için bekleyen kayıt
      yazılır ve doğrulama postası kuyruğa girer.
    given:
      - "a@örnek kayıtlı; b@örnek kayıtlı değil"
    when:
      - "a@örnek için kayıt başlatılır"
      - "b@örnek için kayıt başlatılır"
    then:
      - "İki yanıt da başarı; gövdeleri bayt bayt aynı"
      - "a@örnek için ne bekleyen kayıt ne posta oluşur"
      - "b@örnek için bekleyen kayıt yazılır ve doğrulama postası kuyruğa girer"
    source:
      - "src/test/java/com/exskylab/koala/webAPI/RegistrationEnumerationTest.java#anAlreadyRegisteredAddressDoesNotProduceADistinguishableError"
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#startRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-002
    priority: P0
    title: Kayıt başlatma aynı zamanda yeniden göndermedir ve adres başına tek bekleyen kayıt tutar
    rule: >
      Aynı adres için ikinci kez kayıt başlatılırsa önceki bekleyen kayıt iptal edilir ve yenisi
      yazılır; ikinci deneme hata değildir. Bir adresin aynı anda en çok bir açık bekleyen kaydı olur.
    given:
      - "b@örnek için bir bekleyen kayıt var ve token'ı T1"
    when:
      - "b@örnek için kayıt yeniden başlatılır"
    then:
      - "T1 iptal edilir ve artık doğrulamada kabul edilmez"
      - "Yeni token T2 ile yeni bekleyen kayıt yazılır"
      - "Adres için açık bekleyen kayıt sayısı birdir"
    source:
      - "src/test/java/com/exskylab/koala/webAPI/RegistrationEnumerationTest.java#aSecondAttemptResendsInsteadOfFailing"
      - "src/main/java/com/exskylab/koala/business/concretes/PendingRegistrationManager.java#createPendingRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-003
    priority: P0
    title: Kayıt bağlantısının token'ı opaktır, özetlenerek saklanır ve bir saat yaşar
    rule: >
      E-postadaki doğrulama token'ı rastgele ve opaktır; sunucuda yalnız özeti saklanır. Ömrü bir
      saattir. Süresi dolmuş token'la doğrulama reddedilir ve bekleyen kayıt o anda iptal edilir.
    given:
      - "b@örnek için bir saat önce bekleyen kayıt yazılmış"
    when:
      - "Token'la kayıt doğrulanmak istenir"
    then:
      - "Doğrulama reddedilir"
      - "Bekleyen kayıt iptal edilir; aynı token ikinci kez de kabul edilmez"
      - "Token'ın kendisi hiçbir kayıtta açık metin olarak durmaz"
    error: REGISTRATION_TOKEN_INVALID
    decision: "Java hatası (bekleyen kayıt token'ı açık metin saklanıyor; temizlik işi hiç yok)"
    target: >
      Token 32 rastgele bayttır, SHA-256 özeti saklanır (ADR-0029 Karar 2). Java token'ı düz UUID
      olarak açık metin saklıyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#verifyRegistrationToken"
      - "src/main/java/com/exskylab/koala/business/concretes/PendingRegistrationManager.java#createPendingRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-004
    priority: P0
    title: Doğrulamanın verdiği kayıt token'ı tek kullanımlıktır ve on beş dakika yaşar
    rule: >
      Kayıt doğrulaması, parolanın geleceği adım için kısa ömürlü ve opak bir kayıt token'ı verir. Bu
      token bekleyen kayda bağlıdır, tek kullanımlıktır ve on beş dakika yaşar. Parola yalnız bu
      token'la gönderilebilir; e-postadaki bir saatlik token parola taşımaz.
    given:
      - "b@örnek bekleyen kaydını doğrulamış ve kayıt token'ı R almış"
    when:
      - "R ile kayıt tamamlanır"
      - "Aynı R ile kayıt yeniden tamamlanmak istenir"
    then:
      - "İlk istek kaydı tamamlar"
      - "İkinci istek reddedilir; R tüketilmiştir"
      - "On beş dakika sonra kullanılan R de reddedilir"
    error: REGISTRATION_TOKEN_INVALID
    decision: "Java hatası (kayıt token'ı imzalı JWT; iptal edilemiyor)"
    target: >
      Token opak ve sunucuda özetli tutulur, böylece iptal edilebilir (ADR-0029 Karar 2). Java HS256
      bir JWT veriyor ve ömrü on dakika.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#verifyRegistrationToken"
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#completeRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-005
    priority: P0
    title: Zorunlu rızalar token okunmadan önce denetlenir
    rule: >
      Kayıt tamamlanırken zorunlu rızalar verilmemişse istek, kayıt token'ı hiç okunmadan reddedilir.
      Rıza eksikliği token'ın geçerliliği hakkında bilgi vermez ve token'ı tüketmez.
    given:
      - "b@örnek geçerli bir kayıt token'ı R taşıyor"
    when:
      - "Zorunlu rızalardan biri verilmeden kayıt tamamlanmak istenir"
    then:
      - "İstek reddedilir"
      - "R tüketilmez ve sonra hâlâ kullanılabilir"
      - "Kullanıcı kaydı oluşmaz, rıza kaydı yazılmaz"
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#completeRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-006
    priority: P0
    title: Kayıt tamamlanınca kullanıcı oluşur, e-postası doğrulanmış sayılır ve oturum açılır
    rule: >
      Kayıt tamamlandığında kullanıcı kaydı adı, soyadı, adresi ve işveren bayrağıyla bekleyen
      kayıttan kopyalanır; parola özetlenerek yazılır; e-posta doğrulanmış, telefon ve kimlik
      doğrulanmamış olur. Rızalar kaydedilir, bekleyen kayıt tüketilir ve çağıran için oturum açılır.
    given:
      - "b@örnek geçerli bir kayıt token'ı taşıyor ve zorunlu rızaları veriyor"
    when:
      - "Kayıt tamamlanır"
    then:
      - "Kullanıcı kaydı oluşur; e-posta doğrulanmış, telefon ve kimlik doğrulanmamış"
      - "Parola yalnız özet olarak saklanır"
      - "Rıza kayıtları yazılır"
      - "Bekleyen kayıt tüketilir"
      - "Cihaza bağlı bir oturum açılır ve çağıran giriş yapmış olur"
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java#completeRegistration"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kayıt handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-007
    priority: P0
    title: Yarı kalmış kayıt temizlenir ve adres yeniden kullanılabilir kalır
    rule: >
      Tamamlanmayan bir kayıt adresi kilitlemez: adres için her zaman yeni bir kayıt başlatılabilir.
      Süresi dolmuş bekleyen kayıtlar saklama süresi sonunda kalıcı olarak silinir ve süresiz birikmez.
    given:
      - "b@örnek için otuz günden eski, tamamlanmamış bir bekleyen kayıt var"
    when:
      - "Saklama temizliği koşar"
      - "b@örnek için kayıt yeniden başlatılır"
    then:
      - "Eski bekleyen kayıt kalıcı olarak silinir"
      - "Yeni kayıt başlatılabilir; adres kullanılabilir durumdadır"
    decision: "Java hatası (bekleyen kayıtlar için hiç temizlik işi yok)"
    target: >
      Bekleyen kayıt tablosu M2'dir ve otuz gün sonra hard delete edilir (ADR-0029 Karar 2). Java'da
      hiçbir zamanlayıcı bu tabloya dokunmuyor; satırlar süresiz birikiyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/PendingRegistrationManager.java#createPendingRegistration"
      - "src/main/java/com/exskylab/koala/entities/PendingRegistration.java:1-40"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; bekleyen kayıt tablosu ve temizlik işi Faz 2'nin veri PR'ında gelir."

  - id: USR-008
    priority: P0
    title: Doğrulama kodu altı basamaktır, özetlenerek saklanır ve on dakika yaşar
    rule: >
      E-posta ya da telefon değişikliğinin doğrulama kodu altı ondalık basamaktır ve bütün aralığı
      kullanır. Sunucuda yalnız özeti saklanır; doğrulandıktan sonra özet silinir. Ömrü on dakikadır.
    given:
      - "Kullanıcı U telefonunu değiştirmek için doğrulama başlatmış"
    when:
      - "On dakika geçtikten sonra doğru kod gönderilir"
    then:
      - "Doğrulama reddedilir"
      - "Kod hiçbir kayıtta açık metin olarak durmaz"
      - "Kodun uzayı altı basamağın tamamıdır; baştaki sıfır dışlanmaz"
    error: VERIFICATION_CODE_EXPIRED
    decision: "Java hatası (kod düz metin saklanıyor; uzay baştaki sıfırı dışlıyor; ömür on beş dakika)"
    target: >
      Kod SHA-256 özeti olarak saklanır, uzay 000000-999999'dur ve ömür on dakikadır
      (NIST SP 800-63B; ADR-0029 Karar 3). Java kodu düz metin saklıyor ve 100000-999999 üretiyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/EmailVerificationManager.java#startEmailVerification"
      - "src/main/java/com/exskylab/koala/business/concretes/PhoneVerificationManager.java#startPhoneVerification"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-009
    priority: P0
    title: Doğrulamanın beş denemesi vardır; dolunca doğrulama yakılır
    rule: >
      Bir doğrulama en çok beş yanlış kod denemesi kabul eder. Beşinci yanlıştan sonra doğrulama
      yakılır: doğru kodla bile artık onaylanamaz, kullanıcı yeni bir doğrulama başlatmak zorundadır.
    given:
      - "Kullanıcı U için açık bir doğrulama var ve kodu C"
    when:
      - "Beş kez yanlış kod gönderilir"
      - "Sonra doğru kod C gönderilir"
    then:
      - "İlk beş deneme reddedilir"
      - "Altıncı istek, kod doğru olsa da reddedilir; doğrulama yakılmıştır"
      - "Yeni bir doğrulama başlatılabilir"
    error: VERIFICATION_ATTEMPTS_EXHAUSTED
    decision: "Java hatası (deneme sayacı ve sınırı hiç yok)"
    target: >
      Deneme sınırı beştir (NIST SP 800-63B §5.2.2; ADR-0029 Karar 3). Java'da sayaç kolonu bile yok:
      kod ömrü boyunca sınırsız tahmin edilebiliyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/UserVerificationManager.java#verify"
      - "src/main/java/com/exskylab/koala/entities/UserVerification.java:1-60"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-010
    priority: P0
    title: Kanal ve hedef başına tek açık doğrulama vardır; yenisi öncekini iptal eder
    rule: >
      Bir kullanıcının aynı kanal ve aynı hedef için aynı anda en çok bir açık doğrulaması olur. Yeni
      bir doğrulama başlatmak öncekini iptal eder ve önceki kod geçersizleşir. Yeniden göndermenin
      bekleme süresi vardır ve hedef başına saatlik bir gönderim bütçesi uygulanır.
    given:
      - "Kullanıcı U yeni telefon numarası N için doğrulama başlatmış, kodu C1"
    when:
      - "U aynı numara için doğrulamayı yeniden başlatır ve kod C2 alır"
      - "C1 ile onay denenir"
    then:
      - "C1 reddedilir; yalnız C2 geçerlidir"
      - "Bekleme süresi geçmeden yapılan yeniden gönderme reddedilir"
      - "Hedef başına saatlik gönderim bütçesi dolunca yeni gönderim reddedilir"
    decision: "Java hatası (telefon tarafında hiç tekilleme yok; bütün kodlar geçerli kalıyor)"
    target: >
      Kanal ve hedef başına tek açık doğrulama (ADR-0029 Karar 3). Java yalnız e-posta tarafında
      hedefe göre tekilliyor; telefonda her istek yeni bir satır açıyor ve hepsi süre bitene kadar
      geçerli kalıyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/PhoneVerificationManager.java#startPhoneVerification"
      - "src/main/java/com/exskylab/koala/business/concretes/EmailVerificationManager.java#startEmailVerification"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-011
    priority: P0
    title: Başkasının doğrulaması var olmayandan ayırt edilemez
    rule: >
      Başka bir kullanıcıya ait bir doğrulamayı onaylamaya çalışmak, hiç var olmamış bir doğrulamayla
      aynı yanıtı alır. Yanıt, doğrulamanın var olduğunu söylemez.
    given:
      - "Kullanıcı U1'in açık bir doğrulaması var"
      - "Kullanıcı U2 o doğrulamanın kimliğini biliyor"
    when:
      - "U2 o doğrulamayı onaylamaya çalışır"
      - "U2 hiç var olmamış bir doğrulama kimliğiyle onay dener"
    then:
      - "İki yanıt da aynı; gövdeleri bayt bayt aynı"
      - "U1'in doğrulaması etkilenmez ve denemesi harcanmaz"
    error: VERIFICATION_NOT_FOUND
    decision: "Java hatası (başkasının doğrulaması için ayırt edilebilir izin hatası dönüyor)"
    target: >
      Sahiplik ihlali kaynağın 404'üdür (ADR-0014, ADR-0029 Karar 3). Java ayırt edilebilir bir izin
      hatası döndürüyor ve böylece başkasının doğrulama kimliğinin varlığını açığa veriyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/UserVerificationManager.java#verify"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-012
    priority: P0
    title: Doğrulamada süre kontrolü kodun önüne geçer
    rule: >
      Süresi dolmuş bir doğrulamada, gönderilen kod doğru da olsa yanlış da olsa aynı süre hatası
      döner. Yanıt, gönderilen kodun doğru olup olmadığını sızdırmaz.
    given:
      - "Kullanıcı U'nun süresi dolmuş bir doğrulaması var ve kodu C"
    when:
      - "C ile onay denenir"
      - "Yanlış bir kodla onay denenir"
    then:
      - "İki yanıt da süre hatası; gövdeleri bayt bayt aynı"
    error: VERIFICATION_CODE_EXPIRED
    decision: "Java hatası (kod karşılaştırması süre kontrolünden önce)"
    target: >
      Denetim sırası sahiplik, süre, deneme, kod şeklindedir (ADR-0029 Karar 3). Java kodu süreden
      önce karşılaştırıyor, bu yüzden süresi dolmuş bir doğrulamada doğru kod ile yanlış kod farklı
      hata alıyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/UserVerificationManager.java#verify"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-013
    priority: P0
    title: Onay kodu tüketir; ikinci onay çakışmadır
    rule: >
      Başarılı onay doğrulamayı tüketir: kod özeti silinir ve doğrulama onaylanmış olarak işaretlenir.
      Aynı doğrulamayı ikinci kez onaylamak, gönderilen kod ne olursa olsun çakışma hatası döner.
    given:
      - "Kullanıcı U doğrulamasını doğru kodla onaylamış"
    when:
      - "Aynı doğrulama doğru kodla yeniden onaylanmak istenir"
      - "Aynı doğrulama yanlış kodla yeniden onaylanmak istenir"
    then:
      - "İki istek de çakışma hatası alır"
      - "Doğrulamanın durumu değişmez, yan etki tekrarlanmaz"
    error: VERIFICATION_ALREADY_CONFIRMED
    decision: "Java hatası (onaylanmış doğrulama kodu hiç bakmadan başarı dönüyor)"
    target: >
      İkinci onay çakışmadır (ADR-0029 Karar 3). Java zaten onaylanmış doğrulamada erken dönüyor ve
      yanlış kodu da başarıyla karşılıyor.
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/UserVerificationManager.java#verify"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; doğrulama handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-014
    priority: P0
    title: Yeni e-posta ya da telefon onaylanana kadar profile yazılmaz
    rule: >
      Profilde e-posta ya da telefon değiştirmek değeri hemen yazmaz, bir doğrulama başlatır. Kod
      onaylanana kadar eski değer ve ilgili doğrulanmışlık bayrağı yerinde kalır. Aynı değerin
      yeniden gönderilmesi hiçbir doğrulama başlatmaz.
    given:
      - "Kullanıcı U'nun telefonu N1 ve telefonu doğrulanmış değil"
    when:
      - "U telefonunu N2 olarak değiştirmek ister"
      - "U telefonunu yeniden N1 olarak gönderir"
    then:
      - "U'nun telefonu N1 kalır; doğrulanmışlık bayrağı değişmez"
      - "N2 için bekleyen bir doğrulama oluşur"
      - "N1'in yeniden gönderilmesi hiçbir doğrulama başlatmaz"
      - "Kod onaylandığında telefon N2 olur ve doğrulanmış işaretlenir"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/UserPatchRulesTest.java#aNewPhoneNumberStartsAVerificationInsteadOfBeingSwallowed"
      - "src/test/java/com/exskylab/koala/business/concretes/UserPatchRulesTest.java#theNumberIsNotAppliedUntilTheCodeIsConfirmed"
      - "src/test/java/com/exskylab/koala/business/concretes/UserPatchRulesTest.java#resendingTheSameNumberStartsNothing"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; profil handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: USR-015
    priority: P0
    title: Parola sıfırlama token'ı tek kullanımlıktır ve parolayla aynı transaction'da tüketilir
    rule: >
      Sıfırlama token'ı tüketilmemiş, iptal edilmemiş ve süresi dolmamışken tek bir koşullu güncelleme
      ile tüketilir; parola yazımı aynı transaction'dadır. Etkilenen satır sayısı bir değilse istek
      reddedilir ve parola değişmez.
    given:
      - "Kullanıcı U için açık bir sıfırlama token'ı T var"
    when:
      - "T ile parola sıfırlanır"
      - "Aynı T ile parola yeniden sıfırlanmak istenir"
    then:
      - "İlk istek parolayı değiştirir ve T'yi tüketir"
      - "İkinci istek reddedilir; parola değişmez"
