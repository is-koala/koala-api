    priority: P0
    title: Başarılı sıfırlama çağıran dahil bütün oturumları kapatır ve token döndürmez
    rule: >
      Parola sıfırlandığında kullanıcının bütün oturumları, isteği yapan dahil, kapanır. Yanıt hiçbir
