    then:
      - "İstek çakışma hatası alır"
      - "Üyelik oluşmaz"
      - "Davetin cevap zamanı ve durumu değişmez"
    error: COMPANY_INVITATION_ALREADY_ANSWERED
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/CompanyContactInvitationManager.java#answerToInvitation"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; davet handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: CMP-015
    priority: P0
    title: Davet on dört gün sonra sona erer
    rule: >
      Açık bir davet on dört gün sonra sona erer ve artık cevaplanamaz. Sona ermiş davet, aynı kişi
      için yeni bir daveti engellemez.
    given:
      - "On dört günden eski, hiç cevaplanmamış bir davet"
    when:
      - "Davet edilen daveti kabul etmeye çalışır"
      - "Şirket yöneticisi aynı kişiyi yeniden davet eder"
    then:
      - "Kabul reddedilir; davet sona ermiştir"
      - "Üyelik oluşmaz"
      - "Yeni davet oluşturulabilir"
    error: COMPANY_INVITATION_EXPIRED
