# Ödeme, emanet, payout, iade ve iptal cezası senaryoları.
# Biçim: test/scenarios/README.md. Kaynak: Java origin/main (okundu, koşturulmadı).
# Kaynak yolları src/test/java'ya göreli; kod kaynakları src/main/java/... ile yazılır.

domain: payment
id_prefix: PAY
version: 0
scenarios:

  - id: PAY-001
    priority: P0
    title: Doğrulanmış başarılı ödeme emaneti açar
    rule: >
      Sağlayıcı sonucu deneme kimliğiyle, anlık görüntüyle, 3DS (mdStatus=1) ve fraud onayıyla
      (fraudStatus=1) eşleşirse deneme SUCCEEDED olur, atama HELD_IN_ESCROW'a geçer ve ücret kırılımı
      atamaya yazılır.
    given:
      - "Atama CONFIRMED, ödeme durumu PENDING_COLLECTION"
      - "Ödeme denemesi INITIATED; işçi payı 1.000,00 TL, komisyon oranı 750 bps (%7,5), toplam 1.075,00 TL"
      - "Sağlayıcı sonucu: paymentStatus=SUCCESS, mdStatus=1, fraudStatus=1, fiyatlar 1.075,00 TL, alt üye payı 1.000,00 TL, tek kalem"
    when:
      - "Sağlayıcı geri dönüşü (callback) gelir; sistem sonucu sağlayıcıdan kendisi sorgular"
    then:
      - "Deneme SUCCEEDED; tamamlanma zamanı yazılır, sonraki doğrulama zamanı boşalır"
      - "Atamanın ödeme durumu HELD_IN_ESCROW"
      - "Atamaya işçi payı 1.000,00 TL, komisyon 75,00 TL, oran 750 bps, toplam 1.075,00 TL yazılır"
      - "Ödendi olayı, ödeme kaydı yazıldıktan SONRA yayımlanır (ekip sohbeti ve doğrudan sohbet açılır)"
    decision: K5
    target: >
      K5: tutarlar int64 kuruş (işçi payı 100000, komisyon 7500, toplam 107500), oran baz puan (750).
      Java oranı ondalık (0.075) saklar; eşitlik testi bps karşılığıyla yapılır.
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aSuccessfulCallbackMovesTheAssignmentIntoEscrowAndRecordsTheBreakdown"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#thePaidEventIsPublishedOnlyAfterThePaymentRowIsSaved"
      - "src/test/java/com/exskylab/koala/webAPI/MessagingPaymentGateIT.java#settlingThePaymentBuildsTheCrewAndOpensTheDirectConversation"
    go_test: null

  - id: PAY-002
    priority: P0
    title: Aynı geri dönüş iki kez işlenmez
    rule: >
      SUCCEEDED ya da FAILED deneme son durumdadır. Aynı token'la gelen ikinci geri dönüş sağlayıcıya
      gitmez ve hiçbir şeyi değiştirmez. Kullanıcı aynı sonuç sayfasına yönlenir.
    given:
      - "Deneme SUCCEEDED, atama HELD_IN_ESCROW"
    when:
      - "Aynı token'la ikinci geri dönüş gelir"
      - "Aynı token'la sonucu yalnız okuyan (durumu değiştirmeyen) bir sorgu yapılır"
    then:
      - "Sağlayıcıya sorgu yapılmaz"
      - "Deneme ve atama değişmez; ikinci ödendi olayı yayımlanmaz"
      - "Sonuç okuması kayıtlı sonucu döndürür, bekleyen denemeyi mutabakata sokmaz"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#theSameCallbackArrivingTwiceIsProcessedOnlyOnce"
      - "src/test/java/com/exskylab/koala/webAPI/PaymentCallbackIT.java#aSecondPostAfterSuccessRedirectsToTheSameResultWithoutAskingTheProvider"
      - "src/test/java/com/exskylab/koala/webAPI/PaymentCallbackIT.java#theGetReplayIsPublicAndReflectsTheRecordedOutcomeWithoutConsumingTheToken"
      - "src/test/java/com/exskylab/koala/webAPI/PaymentCallbackIT.java#aPendingAttemptReplayedOverGetIsNotReconciledAndDoesNotReachTheProvider"
    go_test: null

  - id: PAY-003
    priority: P0
    title: 3D Secure doğrulanmadıysa emanet açılmaz
    rule: >
      mdStatus 1 değilse (0, 2…, ya da hiç yoksa) para çekilmiş olsa bile emanet açılmaz. Deneme
      VERIFY_PENDING kalır, sebep "3DS doğrulaması başarısız" olur ve mutabakata planlanır.
      mdStatus kontrolü fraud kontrolünden önce gelir.
    given:
      - "Atama CONFIRMED / PENDING_COLLECTION; deneme INITIATED"
      - "Sağlayıcı sonucu SUCCESS, anlık görüntü eşleşiyor, mdStatus ∈ {0, 2, 3, 4, yok}"
    when:
      - "Geri dönüş gelir"
    then:
      - "Deneme VERIFY_PENDING, sebep payment.3ds.verification.failed, sonraki doğrulama zamanı dolu"
      - "Atama PENDING_COLLECTION kalır; ödendi olayı yok"
      - "fraudStatus=0 da gelse IN_REVIEW'a değil VERIFY_PENDING'e düşer"
      - "Kritik geri dönüş metriği artar"
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aPaymentWhoseThreeDSecureVerificationFailedNeverOpensEscrow"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#everyMdStatusOtherThanOneRemainsPendingVerification"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#anAbsentMdStatusRemainsPendingRatherThanBeingAssumedVerified"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aFailedVerificationOutranksTheFraudReviewHold"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aSecondCallbackOnAVerificationFailureStillDoesNotOpenEscrow"
    go_test: null

  - id: PAY-004
    priority: P0
    title: Fraud kararı emaneti yönetir
    rule: >
      fraudStatus=-1 ise deneme FAILED olur. 0 ise deneme IN_REVIEW olur, emanet açılmaz ve sağlayıcı
      kimlikleri kilitlenir. Değer yoksa ya da bilinmiyorsa deneme VERIFY_PENDING kalır.
      Yalnız 1 emaneti açar.
    given:
      - "Sağlayıcı sonucu SUCCESS, mdStatus=1, anlık görüntü eşleşiyor"
    when:
      - "Geri dönüş fraudStatus ∈ {-1, 0, yok, 7} ile gelir"
    then:
      - "-1 → deneme FAILED (sebep payment.fraud.review), atama ödeme durumu FAILED (yeniden ödeme mümkün)"
      - "0 → deneme IN_REVIEW, paymentId ve paymentTransactionId kaydedilir, atama PENDING_COLLECTION"
      - "yok / 7 → deneme VERIFY_PENDING (payment.verification.pending)"
      - "IN_REVIEW'dan sonraki sorguda sağlayıcı kimlikleri değişmişse emanet açılmaz"
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aPaymentRejectedByFraudFiltersFails"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aPaymentUnderFraudReviewDoesNotOpenEscrowYet"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#anAbsentFraudDecisionRemainsPendingInsteadOfOpeningEscrow"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#anUnknownFraudDecisionRemainsPendingInsteadOfOpeningEscrow"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#providerIdentifiersCannotChangeAfterFraudReview"
    go_test: null

  - id: PAY-005
    priority: P0
    title: Anlık görüntüyle eşleşmeyen başarılı sonuç emaneti açmaz
    rule: >
      Başarılı sonuçta şu alanlardan biri anlık görüntüden farklıysa deneme VERIFY_PENDING'de bloke
      kalır: fiyat, ödenen fiyat, kalem sayısı (1), kalem kimliği (ilan), kalem fiyatları, alt üye payı,
      alt üye anahtarı, işlem kimliği. Ödeme FAILED da sayılmaz. (Para birimi bu adımda değil, kimlik
      adımında kontrol edilir: PAY-006.)
    given:
      - "Toplam 1.075,00 TL, işçi payı 1.000,00 TL, alt üye anahtarı K1"
    when:
      - "Sağlayıcı SUCCESS döner ama ödenen fiyat 1.074,99 TL ya da alt üye anahtarı K2"
    then:
      - "Deneme VERIFY_PENDING, sebep payment.verification.pending; emanet açılmaz"
      - "Atama PENDING_COLLECTION kalır; tutar uyuşmazlığı metriği artar"
      - "İstemciye sağlayıcı ayrıntısı değil yalnız mesaj anahtarı döner"
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aShortPaymentIsRefusedInsteadOfSettled"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aSuccessfulPaymentForAnotherSubmerchantNeverOpensEscrow"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#theRejectionReasonIsAMessageKeySoNoProviderDetailReachesTheClient"
    go_test: null

  - id: PAY-006
    priority: P0
    title: Başka denemeye ait sonuç bu denemeyi sonlandıramaz
    rule: >
      Sonucun conversationId, token, basketId (atama), para birimi ya da paymentId değeri denemeyle
      eşleşmiyorsa (kimlik adımı, fiyat ve 3DS kontrollerinden önce) sonuç, sonuç FAILURE olsa bile denemeyi FAILED yapamaz. Deneme VERIFY_PENDING'de
      bloke kalır.
    given:
      - "Deneme INITIATED, conversationId=C1"
    when:
      - "Sağlayıcı conversationId=C2 ile FAILURE ya da SUCCESS döner"
      - "Sağlayıcı SUCCESS döner ama para birimi USD"
    then:
      - "Deneme VERIFY_PENDING; atama değişmez"
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aMismatchedProviderConversationStaysBlockedForReconciliation"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aDeclineForAnotherConversationCannotTerminallyFailThisAttempt"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#everyAttemptGetsItsOwnConversationId"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aPaymentInAnotherCurrencyIsRefused"
    go_test: null

  - id: PAY-007
    priority: P0
    title: Sağlayıcı hatası belirsizdir; mutabakat 8 denemede durur
    rule: >
      Sonuç sorgusu hata verirse deneme VERIFY_PENDING kalır ve üstel geri çekilmeyle yeniden sorgulanır
      (1 dk, 2 dk, 4 dk… tavan 6 sa). 8. denemede otomatik mutabakat durur, deneme VERIFY_PENDING
      kalır, sonraki zaman boşalır ve manuel inceleme sayacı artar. Belirsiz deneme yeni ödeme
      olarak yeniden başlatılamaz.
    given:
      - "Deneme INITIATED, doğrulama denemesi 0"
    when:
      - "Sağlayıcı sorgusu 8 kez üst üste hata verir"
      - "İşveren bu arada yeni ödeme oturumu ister"
    then:
      - "Her başarısızlıkta deneme sayısı artar; ilk 7'de sonraki zaman dolu"
      - "8. başarısızlıkta sonraki zaman boş, deneme VERIFY_PENDING (aktif) kalır"
      - "Yeni ödeme oturumu reddedilir: aktif deneme var"
      - "Bekleyen bir deneme sonraki sorguda SUCCESS dönerse normal yoldan emanet açılır"
    error: PAYMENT_ATTEMPT_IN_PROGRESS
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aProviderVerificationErrorRemainsActiveUntilReconciled"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#automaticReconciliationStopsAfterTheConfiguredBoundButRemainsActiveForManualReview"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#anAmbiguousProviderErrorCannotBeRetriedAsANewPayment"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aDueAmbiguousAttemptCanBeReconciledToSuccess"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aPendingThreeDsResultCanLaterBeReconciledToSuccess"
    go_test: null

  - id: PAY-008
    priority: P0
    title: Artık tahsil edilemeyen atamaya gelen başarılı ödeme manuel incelemeye düşer
    rule: >
      Sonuç her açıdan doğrulanmış ama atama artık ödeme kabul etmiyorsa (CONFIRMED değil ya da ödeme
      durumu PENDING_COLLECTION/FAILED değil) emanet açılmaz. Deneme VERIFY_PENDING olur ve otomatik
      mutabakat dışında kalır.
    given:
      - "Atama CANCELLED; deneme INITIATED"
    when:
      - "Sağlayıcı tam doğrulanmış SUCCESS döner"
    then:
      - "Deneme VERIFY_PENDING, sebep payment.verification.pending, sonraki doğrulama zamanı boş"
      - "Atama değişmez; emanet açılmaz"
    oracle: testdata/oracle/reconcile.csv
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aSuccessfulProviderResultForACancelledAssignmentRequiresManualReview"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentCallbackTest.java#aTerminallyFailedAttemptCannotLaterOpenEscrow"
    go_test: null

  - id: PAY-009
    priority: P0
    title: Bir atamada en fazla bir aktif ödeme denemesi
    rule: >
      INITIATED, VERIFY_PENDING ve IN_REVIEW aktif durumlardır. Bir atamada bunlardan en fazla biri
      olabilir. Eşzamanlı iki ödeme oturumu isteğinden biri deneme açar, öteki çakışma alır.
      Başarısız (FAILED) deneme yeni denemeyi engellemez.
    given:
      - "Atama CONFIRMED / PENDING_COLLECTION, aktif deneme yok"
    when:
      - "İşveren aynı anda iki ödeme oturumu ister"
      - "Sonra ilk deneme FAILED olur ve işveren yeniden dener"
    then:
      - "Tek deneme kaydı oluşur; ikinci istek çakışma alır"
      - "Veritabanı kısıtı, uygulama kilidi atlansa bile ikinci aktif satırı reddeder"
      - "FAILED'dan sonraki yeni deneme kabul edilir"
    error: PAYMENT_ATTEMPT_IN_PROGRESS
    source:
      - "src/test/java/com/exskylab/koala/dataAccess/ActivePaymentAttemptConstraintIT.java#databaseAllowsOnlyOneActiveAttemptPerAssignment"
      - "src/test/java/com/exskylab/koala/dataAccess/ActivePaymentAttemptConstraintIT.java#twoConcurrentReservationsProduceOneAttemptAndOneConflict"
      - "src/test/java/com/exskylab/koala/dataAccess/ActivePaymentAttemptConstraintIT.java#theIndexRejectsASecondActiveRowWhenTwoInsertsSkipTheAssignmentLock"
      - "src/test/java/com/exskylab/koala/dataAccess/ActivePaymentAttemptConstraintIT.java#aFailedAttemptDoesNotBlockTheEmployerFromTryingAgain"
      - "src/test/java/com/exskylab/koala/dataAccess/ActivePaymentAttemptConstraintIT.java#theIndexGuardsExactlyTheStatusSetJavaTreatsAsActive"
    go_test: null

  - id: PAY-010
    priority: P0
    title: Deneme sağlayıcıdan önce rezerve edilir; alt üye oluşturmadaki her hata denemeyi başarısız yapar
    rule: >
      Ödeme oturumunda deneme, sağlayıcıya gidilmeden önce ayrı bir işlemde kaydedilir ve commit edilir.
      İşçinin alt üye kaydı yoksa önce alt üye oluşturulur; bu adımdaki HER hata (kesin ret, ağ ya da 5xx
      belirsizliği dahil) denemeyi FAILED yapar, çünkü henüz ödeme formu açılmamıştır.
    given:
      - "Atama CONFIRMED / PENDING_COLLECTION; işçinin alt üye kaydı yok"
    when:
      - "İşveren ödeme oturumu başlatır"
      - "Alt üye oluşturma sağlayıcıda hata verir (kesin ret ya da zaman aşımı)"
    then:
      - "Önce deneme INITIATED olarak kaydedilir, sonra sağlayıcı çağrılır"
      - "Alt üye hatasında deneme FAILED olur; ödeme formu açılmaz"
      - "Bekleyen bir deneme varken yeni sağlayıcı oturumu ya da alt üye oluşturulmaz"
      - "İşçinin IBAN'ı doğrulanmamış olsa da alt üye oluşturulur"
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/JobAssignmentManager.java:305-319"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentSessionAuthorizationTest.java#theAttemptIsReservedBeforeAnyExternalSubmerchantOrCheckoutCall"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentSessionAuthorizationTest.java#aPendingAttemptStopsBeforeAnotherProviderSessionOrSubmerchantIsCreated"
      - "src/test/java/com/exskylab/koala/business/concretes/PaymentSessionAuthorizationTest.java#anUnverifiedWorkerIbanStillCreatesTheSubmerchant"
    go_test: null

  - id: PAY-011
    priority: P0
    title: Komisyon işçi payına eklenir; kuruş HALF_UP
    rule: >
      İşçi payı 2 basamağa HALF_UP yuvarlanır. Komisyon = yuvarlanmış pay × oran, 2 basamağa HALF_UP.
      Toplam = pay + komisyon. Kuruş kaybolmaz ve uydurulmaz. Oran çalışma zamanı ayarından okunur;
      daha önce fiyatlanmış kayıt kendi oranını korur.
    given:
      - "Komisyon oranı %7,5 (varsayılan 0.075)"
    when:
      - "İşçi payı 1.000,00 TL olan ilan fiyatlanır"
      - "Oran %10 iken 0,05 TL fiyatlanır"
      - "Oran %12'ye çekilir"
    then:
      - "1.000,00 → komisyon 75,00, toplam 1.075,00"
      - "0,05 → komisyon 0,01 (0,005 yukarı), toplam 0,06"
      - "Yeni oran yeniden başlatmadan uygulanır; eski atamaların oranı değişmez"
      - "0 ya da negatif pay reddedilir"
    oracle: testdata/oracle/commission.csv
    source:
      - "src/test/java/com/exskylab/koala/core/helpers/CommissionCalculatorTest.java#theBreakdownAddsUpToTheChargedTotal"
      - "src/test/java/com/exskylab/koala/core/helpers/CommissionCalculatorTest.java#halfKurusRoundsUpNotDown"
      - "src/test/java/com/exskylab/koala/core/helpers/CommissionCalculatorTest.java#roundingNeverLosesOrInventsKurus"
      - "src/test/java/com/exskylab/koala/core/helpers/CommissionRateRuntimeIT.java#aStoredRateAppliesWithoutARestart"
      - "src/test/java/com/exskylab/koala/core/helpers/CommissionRateRuntimeIT.java#rowsPricedBeforeTheChangeKeepTheRateTheyWereChargedWith"
    go_test: null

  - id: PAY-012
    priority: P0
    title: İşveren tamamlayınca emanet işçiye çıkar
    rule: >
      İşveren tarafı (ilan sahibi ya da şirket yetkilisi) işi tamamladığında ve atama HELD_IN_ESCROW'da
      olduğunda emanet çıkışı başlar. Çıkış kuralları:
      - açık uyuşmazlık yoksa çıkış yapılır;
      - işçinin birincil IBAN'ı olmalı, doğrulanmış olması gerekmez;
      - payout PENDING açılır ve sağlayıcı onayı (APPROVE) kuyruğa girer;
      - atama RELEASED_TO_WORKER olur.
      Çıkış kuyruğa giremezse tamamlama da geri alınır.
    given:
      - "Atama IN_PROGRESS, HELD_IN_ESCROW; işçi payı 1.000,00 TL; işçinin birincil IBAN'ı var"
    when:
      - "İşveren işi tamamlar"
    then:
      - "Atama COMPLETED, ödeme durumu RELEASED_TO_WORKER"
      - "Payout PENDING, tutar 1.000,00 TL, hedef birincil IBAN, çıkış kaynağı kaydedilir"
      - "APPROVE settlement görevi PENDING olarak kuyruğa girer; sağlayıcı satır içinde çağrılmaz"
      - "Birincil IBAN yoksa tamamlama reddedilir ve hiçbir şey değişmez"
    error: PAYOUT_WORKER_IBAN_NOT_VERIFIED
    source:
      - "src/test/java/com/exskylab/koala/webAPI/AssignmentCompletionIT.java#theEmployerCompletingTheWorkReleasesTheEscrowToTheWorker"
      - "src/test/java/com/exskylab/koala/webAPI/AssignmentCompletionIT.java#aCompanyAdminCompletingTheWorkReleasesTheEscrowToo"
      - "src/test/java/com/exskylab/koala/webAPI/AssignmentCompletionIT.java#aWorkerWithoutAPrimaryIbanBlocksTheCompletionLoudly"
      - "src/test/java/com/exskylab/koala/business/concretes/PayoutReleaseTest.java#moneyIsReleasedToThePrimaryIbanEvenWhenOwnershipIsUnproven"
      - "src/test/java/com/exskylab/koala/business/concretes/PayoutReleaseTest.java#releasingTheEscrowQueuesTheProviderApprovalInsteadOfCallingItInline"
      - "src/test/java/com/exskylab/koala/business/concretes/PayoutReleaseTest.java#releaseIsNotReportedWhenItCannotBeQueued"
    go_test: null

  - id: PAY-013
    priority: P0
    title: Aynı atama iki kez ödenmez
    rule: >
      Bir atama için en fazla bir payout vardır. İkinci çıkış isteği mevcut payout'u döndürür. Aynı
      ödeme için aynı settlement işlemi (APPROVE, DISAPPROVE ya da REFUND) iki kez kuyruğa girmez.
    given:
      - "Atama RELEASED_TO_WORKER, payout P1 var"
    when:
      - "Çıkış ikinci kez istenir (personel, otomatik tamamlama ya da ikinci tamamlama)"
    then:
      - "Yeni payout oluşmaz; P1 döner"
      - "APPROVE görevi tekrar kuyruğa girmez"
      - "İkinci tamamlama reddedilir ve payout'a dokunmaz"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/PayoutReleaseTest.java#theSameAssignmentIsNeverPaidOutTwice"
      - "src/test/java/com/exskylab/koala/business/concretes/SettlementRetryTest.java#queueingTwiceForTheSamePaymentReusesTheTask"
      - "src/test/java/com/exskylab/koala/webAPI/AssignmentCompletionIT.java#aSecondCompletionIsRefusedAndDoesNotTouchThePayout"
    go_test: null

  - id: PAY-014
    priority: P0
    title: Açık uyuşmazlık emaneti dondurur
    rule: >
      Atamada açık uyuşmazlık varsa emanet işçiye çıkmaz ve işverene iade edilmez. İşveren tamamlaması
