      - "com/exskylab/koala/business/concretes/PayoutReleaseTest.java#anActiveDisputeFreezesAnEmployerRefund"
      - "com/exskylab/koala/business/concretes/PayoutReleaseTest.java#theDisputeGatedReleaseSkipsQuietlyWhileADisputeIsOpen"
    go_test: null

  - id: PAY-015
    priority: P0
    title: Sağlayıcı onayı gelince payout tamamlanmış sayılır (Java) — K2 farkı
    rule: >
      APPROVE görevi başarılı olunca payout'a sağlayıcı referansı yazılır. Referans olarak yanıttaki
      işlem kimliği kullanılır, o yoksa kuyruğa alınan işlem kimliği. Payout doğrudan COMPLETED olur
      (Java). Görev 8 denemede başarılı olamazsa payout FAILED olur.
    given:
