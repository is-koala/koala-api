  - id: PAY-017
    priority: P0
    title: İptal cezası yalnız işverene, 24 saat penceresiyle
    rule: >
      İşçi iptal ederse ceza 0 olur. İşveren iptalinde ceza oranı bildirim süresine göre belirlenir:
      - iş başladıktan sonra (süre ≤ 0) %100;
      - 24 saat ya da daha fazla kala %0 (sınır tam saat olarak, 24 saat dahil serbest);
      - arada %50.
      Ceza = tahsilat × oran (2 basamak, HALF_UP). İade = tahsilat − ceza. Bildirim süresi ilanın
      duvar saatine göre Europe/Istanbul'da ölçülür. Emanette para yoksa iade 0 olur.
    given:
      - "Atama emanette, tahsil edilen 1.075,00 TL; serbest pencere 24 sa, geç iptal oranı 0.50"
    when:
      - "İşveren işe 48 sa / 24 sa / 3 sa / -10 dk kala iptal eder; ya da işçi iptal eder"
    then:
      - "48 sa ve 24 sa → ceza 0,00, iade 1.075,00"
      - "3 sa → ceza 537,50, iade 537,50 (kısmi iade + DISAPPROVE)"
      - "-10 dk → ceza 1.075,00, iade 0,00 (iade kaydı oluşmaz)"
      - "İşçi iptali → ceza 0,00, iade 1.075,00"
      - "Ceza + iade her zaman tahsilata eşittir"
      - "Java'da -10 dk iptalinde iade 0 olduğundan iade kaydı oluşmaz ve para emanette kalır"
    decision: Java hatası (ceza alıcısı); karar 05.11
    target: >
      Karar: geç iptal cezası iptal edilen tarafa gider. İşveren iptal ettiyse ceza işçiye geçer, iade
      kısmı işverene döner; işçi iptal ettiyse politikadaki ceza (bugün 0) uygulanır. Yuvarlama sonucu
      iade 0 çıkarsa tahsilatın tamamı ceza sayılır ve işçiye geçer; para emanette kalmaz. 3 sa örneğinde
      537,50 işverene iade, 537,50 işçiye. Platform komisyonu kendi kuralına göre kesilir (Faz 6).
    oracle: testdata/oracle/cancellation-fee.csv
    source:
      - "src/test/java/com/exskylab/koala/core/helpers/CancellationPolicyTest.java#anEmployerCancellingInsideTheWindowPaysHalf"
      - "src/test/java/com/exskylab/koala/core/helpers/CancellationPolicyTest.java#exactlyAtTheWindowBoundaryTheCancellationIsStillFree"
      - "src/test/java/com/exskylab/koala/core/helpers/CancellationPolicyTest.java#anEmployerCancellingAfterTheStartForfeitsEverything"
      - "src/test/java/com/exskylab/koala/core/helpers/CancellationPolicyTest.java#aWorkerCancellingNeverCostsTheEmployerAnything"
      - "src/test/java/com/exskylab/koala/core/helpers/CancellationPolicyTest.java#theNoticeIsMeasuredAgainstTheJobsWallClockZone"
      - "src/test/java/com/exskylab/koala/business/concretes/AssignmentOperationsAuthorizationTest.java#aLateEmployerCancellationRefundsOnlyThePartLeftAfterTheFee"
