# Kimlik belgesi yükleme, personel incelemesi ve kimlik verisinin görünürlüğü senaryoları.
# Biçim: test/scenarios/README.md. Kaynak: Java origin/main (0cbbce69, okundu, koşturulmadı).
# NFC çip yolu (K15) Faz 2b'dedir ve bu dosyada yoktur (ADR-0029 Karar 5).

domain: identity
id_prefix: IDN
version: 0
scenarios:

  - id: IDN-001
    priority: P0
    title: Kimlik incelemesi dört sabit fotoğraf yuvasıyla açılır ve kullanıcıyı damgalamaz
    rule: >
      Kimlik belgesi gönderimi dört fotoğraf ister: yüz, belgenin ön yüzü, belgenin arka yüzü ve
      belgeyi yüzün yanında tutan kare. Dördü de zorunludur. Gönderim yalnız bekleyen bir inceleme
      açar; kullanıcının kimlik doğrulanmışlığına, rozetlerine ve profiline dokunmaz.
    given:
      - "Kullanıcı U'nun kimliği doğrulanmamış ve açık incelemesi yok"
    when:
      - "U dört fotoğrafı ve beyan ettiği kimlik bilgilerini gönderir"
    then:
      - "Durumu bekleyen olan bir inceleme açılır"
      - "Dört fotoğraf incelemeye bağlanır"
      - "U'nun kimlik doğrulanmışlığı değişmez; profili ve rozetleri güncellenmez"
      - "Yuvalardan biri eksikse gönderim reddedilir"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#submittingFourPhotosCreatesAPendingReviewWithoutStampingIdentity"
      - "src/main/java/com/exskylab/koala/business/concretes/IdentityVerificationManager.java#submit"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kimlik handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-002
    priority: P0
    title: Açık inceleme ikinci gönderimi engeller; reddedilmiş inceleme engellemez
    rule: >
      Kullanıcının bekleyen bir incelemesi varken ikinci gönderim reddedilir ve önceki fotoğraflar
      yerinde kalır. İnceleme reddedildikten sonra kullanıcı yeni bir inceleme açabilir. Kimliği
      zaten doğrulanmış kullanıcı hiç gönderemez.
    given:
      - "Kullanıcı U'nun bekleyen bir incelemesi var"
    when:
      - "U ikinci kez dört fotoğraf gönderir"
      - "İnceleme reddedilir ve U yeniden gönderir"
    then:
      - "İkinci gönderim reddedilir; açık incelemenin fotoğrafları değişmez"
      - "Ret sonrası gönderim yeni bir inceleme açar; eski inceleme ve fotoğrafları yerinde kalır"
      - "Kimliği doğrulanmış kullanıcının gönderimi reddedilir"
    error: IDENTITY_REVIEW_PENDING
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/IdentityVerificationManager.java#submit"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#theCurrentUserCanReadTheirLatestReviewIncludingARejection"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; kimlik handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-003
    priority: P0
    title: Kabul edilen fotoğraf tipi içerikten belirlenir, dosya adından ya da istemcinin beyanından değil
    rule: >
      Yalnız JPEG ve PNG kabul edilir. Tip dosyanın içeriğinden saptanır; dosya adının uzantısı ve
      istemcinin bildirdiği içerik tipi karara girmez. Saklanan nesnenin içerik tipi sunucunun
      saptadığı tiptir. Görüntü olarak çözülemeyen dosya hiç saklanmaz.
    given:
      - "Kullanıcı U kimlik gönderimi yapıyor"
    when:
      - "Gerçekte metin olan bir dosya görüntü adıyla ve görüntü beyanıyla gönderilir"
      - "Gerçekte JPEG olan bir dosya PNG beyanıyla gönderilir"
    then:
      - "Metin dosyası reddedilir ve nesne deposuna hiçbir şey yazılmaz"
      - "Beyanı yanlış olan JPEG, saptanan tipiyle saklanır; istemcinin beyanı kaydedilmez"
    error: MEDIA_TYPE_UNSUPPORTED
    decision: "Java hatası (izin listesi uzantıdan; depoya istemcinin ham beyanı yazılıyor)"
    target: >
      Tip sihirli baytlardan saptanır (ADR-0029 Karar 5). Java izin listesini dosya adının
      uzantısından çıkarıyor ve nesnenin içerik tipine istemcinin ham başlığını yazıyor; sahte dosya
      yalnız çözümleme hatasıyla, dolaylı olarak düşüyor.
    source:
      - "src/main/java/com/exskylab/koala/core/helpers/UploadValidator.java#validate"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#aPhotoThatCannotBeDecodedIsRefusedInsteadOfBeingStoredRaw"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; medya doğrulaması Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-004
    priority: P0
    title: Fotoğraf boyutu ve tuval büyüklüğü sınırlıdır
    rule: >
      Her fotoğraf en çok on mebibayttır ve tuvali en çok elli megapikseldir. Sınırı aşan dosya
      reddedilir; tuval kontrolü pikselleri çözmeden başlık bilgisinden yapılır.
    given:
      - "Kullanıcı U kimlik gönderimi yapıyor"
    when:
      - "On mebibayttan büyük bir fotoğraf gönderilir"
      - "Elli megapikselden büyük tuvalli bir fotoğraf gönderilir"
    then:
      - "İki gönderim de reddedilir"
      - "Nesne deposuna hiçbir şey yazılmaz"
    error: MEDIA_TOO_LARGE
    source:
      - "src/main/java/com/exskylab/koala/core/helpers/UploadValidator.java#rejectOversizedCanvas"
      - "src/main/java/com/exskylab/koala/core/properties/UploadProperties.java:1-40"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; medya doğrulaması Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-005
    priority: P0
    title: Kimlik fotoğrafının konum verisi dahil bütün üstverisi silinir
    rule: >
      Saklanan fotoğraf yalnız piksel içeriğini taşır. Bütün üstveri bölütleri düşer: konum (GPS)
      koordinatları, kamera markası ve modeli, seri numaraları, benzersiz görüntü kimliği ve PNG
      metin parçaları. Konum verisi hiçbir yerde kaydedilmez ve loglanmaz.
    given:
      - "Konum, kamera ve seri numarası üstverisi taşıyan dört fotoğraf"
    when:
      - "Fotoğraflar kimlik gönderimiyle saklanır"
    then:
      - "Saklanan baytlarda konum koordinatı bulunmaz"
      - "Saklanan baytlarda üstveri bölütü imzası bulunmaz"
      - "Saklanan baytlarda kamera markası ve seri numarası bulunmaz"
      - "Fotoğraf hâlâ geçerli bir görüntüdür"
      - "Konum verisi loga yazılmaz"
    decision: "[[job-location-rule]]"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#identityPhotosAreStoredUnderThePrivatePrefixWithoutTheirExifSegment"
      - "src/main/java/com/exskylab/koala/business/concretes/IdentityVerificationManager.java#withoutMetadata"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; üstveri striplemesi Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-006
    priority: P0
    title: Yan yatmış fotoğraf dik saklanır ve yön etiketi de silinir
    rule: >
      Fotoğrafın yön bilgisi saklamadan önce okunur ve piksellere uygulanır; etiketin kendisi sonra
      silinir. Dik olmayan bir fotoğrafın genişliği ve yüksekliği yer değiştirir. Zaten dik olan
      fotoğrafın boyutları değişmez.
    given:
      - "Yön etiketi çeyrek dönüş bildiren, genişliği yüksekliğinden büyük bir fotoğraf"
    when:
      - "Fotoğraf kimlik gönderimiyle saklanır"
    then:
      - "Saklanan fotoğrafın genişliği ve yüksekliği yer değiştirir"
      - "Saklanan baytlarda yön etiketi bulunmaz"
      - "Zaten dik olan fotoğrafın boyutları değişmez"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#aSidewaysIdentityPhotoIsStoredUprightSoItsWidthAndHeightSwap"
      - "src/main/java/com/exskylab/koala/core/utilities/image/ExifOrientation.java#applyToPixels"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; üstveri striplemesi Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-007
    priority: P0
    title: Kimlik fotoğrafları hiçbir genel yoldan okunamaz
    rule: >
      Kimlik fotoğraflarının saklandığı alan hiçbir genel okuma yoluna bağlı değildir ve hiçbir
      genel adrese çözülmez. Eski bir kimlik fotoğrafı yanlışlıkla genel alanda kalmışsa da genel
      okuma yolundan verilmez; silinmiş olanı da verilmez. Sondaki eğik çizgi gibi küçük
      değişiklikler kontrolü atlatmaz.
    given:
      - "Bir kimlik fotoğrafı özel alanda; bir eskisi yanlışlıkla genel alanda"
    when:
      - "İki fotoğraf genel okuma yolundan istenir"
      - "Eski fotoğrafın adresi sondaki eğik çizgiyle istenir"
      - "Eski fotoğrafın kaydı silinip yeniden istenir"
    then:
      - "Dört istek de var olmayan dosyanın yanıtını alır"
      - "Profil fotoğrafları genel okuma yolundan verilmeye devam eder"
      - "Kimlik fotoğrafının adresi hiçbir yanıtta üretilmez"
    source:
      - "src/test/java/com/exskylab/koala/webAPI/IdentityPhotoPrivacyIT.java#aLegacyIdentityPhotoLeftUnderImagesIsNoLongerPublicWhileProfileImagesStillAre"
      - "src/test/java/com/exskylab/koala/webAPI/IdentityPhotoPrivacyIT.java#aTrailingSlashDoesNotSlipALegacyIdentityPhotoPastTheCheck"
      - "src/test/java/com/exskylab/koala/webAPI/IdentityPhotoPrivacyIT.java#aSoftDeletedLegacyIdentityPhotoStaysHiddenFromThePublicImageRoute"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; depolama okuma yolu Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-008
    priority: P0
    title: Onay dört yuvanın hepsinin gerçek kanıt olmasını ister
    rule: >
      Bir inceleme ancak dört fotoğraf yuvasının hepsi gerçek bir kanıt taşıyorsa onaylanabilir.
      Yuvası boş olan ya da depolama anahtarı boşaltılmış olan inceleme onaylanamaz ve hiçbir kayıt
      güncellenmez; inceleme bekleyen kalır.
    given:
      - "Dört yuvadan biri eksik ya da anahtarı boşaltılmış bir bekleyen inceleme"
    when:
      - "Personel incelemeyi onaylamaya çalışır"
    then:
      - "Onay reddedilir"
      - "İnceleme bekleyen kalır; hiçbir kayıt güncellenmez"
      - "Kullanıcının kimlik doğrulanmışlığı değişmez"
    error: IDENTITY_REVIEW_DOCUMENTS_MISSING
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#approvalRefusesAPendingReviewMissingAnyOfTheFourDocuments"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#aDocumentWhoseStorageKeyWasClearedDoesNotCountAsEvidence"
      - "src/test/java/com/exskylab/koala/webAPI/IdentityReviewApprovalIT.java#aPendingReviewMissingOnlyTheTogetherPhotoIsRefused"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; inceleme handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-009
    priority: P0
