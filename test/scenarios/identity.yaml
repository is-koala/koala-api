  - id: IDN-015
    priority: P0
    title: Personel indirmesi kısa ömürlü imzalı bir adrestir
    rule: >
      Personel bir kimlik fotoğrafını indirdiğinde yanıt, kısa ömürlü imzalı bir adrese yönlendirir.
      Adresin ömrü yapılandırılmış pencereyi aşmaz ve on beş dakikadan uzun olamaz; adres genel
      dağıtım alan adını kullanmaz. Yanıt önbelleğe alınmaz ve içerik tipi tahmini kapatılır.
    given:
      - "İncelemeye bağlı bir kimlik fotoğrafı"
    when:
      - "Yetkili personel fotoğrafı indirir"
    then:
      - "Yanıt kısa ömürlü imzalı bir adrese yönlendirir"
      - "Adresin ömrü yapılandırılmış pencereye eşittir ve on beş dakikayı aşmaz"
      - "Adres genel dağıtım alan adıyla başlamaz"
      - "Yanıt önbelleğe alınmaz ve içerik tipi tahmini kapalıdır"
    source:
      - "src/test/java/com/exskylab/koala/webAPI/IdentityDocumentDownloadContractTest.java#aSignedDownloadAddressExpiresWithinTheConfiguredWindow"
      - "src/test/java/com/exskylab/koala/webAPI/IdentityDocumentDownloadContractTest.java#theDownloadRouteHandsOutTheShortLivedAddressAndNothingElse"
