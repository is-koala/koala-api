  - id: IDN-010
    priority: P0
    title: Karar verilmiş inceleme yeniden karara açılmaz ve yarışan iki karar fail-closed düşer
    rule: >
      Onaylanmış ya da reddedilmiş bir inceleme terminaldir: ikinci karar çakışma hatası alır ve
      hiçbir kayıt güncellenmez. Karar satır kilidi altında verilir, bu yüzden aynı anda gelen bir
      onay ile bir ret arasında ikincisi her zaman düşer.
    given:
      - "Bekleyen bir inceleme ve aynı anda karar vermeye çalışan iki personel"
    when:
      - "Biri reddeder, sonra diğerinin onayı kilidin arkasından geçer"
      - "Biri onaylar, sonra diğerinin reddi kilidin arkasından geçer"
    then:
      - "İki durumda da ikinci karar çakışma hatası alır"
      - "İkinci kararda hiçbir kayıt yazılmaz"
      - "Karar kilitli satır üzerinde verilir, kilitsiz okuma üzerinde değil"
    error: IDENTITY_REVIEW_ALREADY_DECIDED
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#anApprovalThatLandsAfterARejectionFailsClosed"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#aRejectionThatLandsAfterAnApprovalFailsClosed"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#approvalDecidesOnTheRowLockedForUpdateNotOnAnUnlockedRead"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; inceleme handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

  - id: IDN-011
    priority: P0
    title: Onay kullanıcıyı damgalar ve kimlik alanlarını dondurur
    rule: >
      Onay kullanıcının kimliğini doğrulanmış işaretler, doğrulama anını ve yöntemini yazar ve
      beyandaki ad, soyad, doğum tarihi ile kimlik numarasını kullanıcıya kopyalar. Ad ve soyad
      Türkçe yerelle baş harfi büyük kalanı küçük olacak biçimde yazılır. Bu alanlar artık profilden
      değiştirilemez.
    given:
      - "Dört fotoğrafı tam, bekleyen bir inceleme; beyandaki ad küçük harflerle yazılmış"
    when:
      - "Personel incelemeyi onaylar"
    then:
      - "Kullanıcının kimliği doğrulanmış olur; doğrulama anı ve yöntemi yazılır"
      - "Ad ve soyad Türkçe yerelle büyük harfe çevrilir"
      - "Kullanıcı artık adını, soyadını ve doğum tarihini değiştiremez"
      - "İncelemenin kararını veren personelin kimliği kaydedilir"
    source:
      - "src/main/java/com/exskylab/koala/business/concretes/IdentityVerificationManager.java#approve"
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityVerificationRulesTest.java#theNameIsStillCapitalisedWithTheTurkishLocale"
    go_test: null
    deferred:
      phase: 2
      reason: "Sözleşme donduruldu; inceleme handler'ları Faz 2'nin uygulama PR'ında gelir (ADR-0029 §1)."

