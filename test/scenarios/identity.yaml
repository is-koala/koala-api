    when:
      - "Personel incelemeyi gerekçesiyle reddeder"
    then:
      - "İnceleme reddedilir"
      - "Aynı inceleme onaylanmaya çalışılsa reddedilirdi"
    source:
      - "src/test/java/com/exskylab/koala/business/concretes/IdentityDocumentReviewRulesTest.java#aLegacyTwoPhotoReviewCanStillBeRejected"
