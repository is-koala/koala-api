  - id: MED-011
    priority: P1
    title: Sahip ve tür başına görüntü sayısı sınırlıdır
    rule: >
      Bir şirketin galerisi ve bir ilanın galerisi en çok on görüntü taşır; sınır dolduğunda yeni
      görüntü eklemek çakışma hatası alır. Bir kullanıcının en çok bir özgeçmişi olur ve yeni
      yükleme öncekinin yerini alır.
    given:
      - "Galerisi on görüntüyle dolu şirket A; özgeçmişi olan kullanıcı U"
    when:
      - "A'ya on birinci görüntü eklenmek istenir"
      - "U yeni bir özgeçmiş yükler"
    then:
      - "On birinci görüntü çakışma hatası alır"
      - "U'nun özgeçmişi yenisiyle değişir"
    source:
