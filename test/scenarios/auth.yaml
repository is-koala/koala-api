    title: Kullanıcı kendi oturumlarını yönetir; başkasınınki yok sayılır
    rule: >
      Kullanıcı kendi oturumunu kapatabilir. "Diğerlerini kapat" isteği yapan oturumu korur. Başkasına
      ait ya da kapanmış bir oturumun ayrıntısı, var olmayan oturumla aynı yanıtı alır.
    given:
      - "U'nun S1 (istek yapan) ve S2 oturumları açık; V'nin S3 oturumu var"
    when:
      - "U diğer oturumlarını kapatır"
      - "U, S3'ün ayrıntısını ister ve S3'ü kapatmaya çalışır"
    then:
      - "S2 kapanır; S1 açık kalır"
      - "S3 için yanıt var olmayan oturumla aynıdır; S3 açık kalır"
