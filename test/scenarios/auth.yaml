    rule: >
      Giriş, kendi yol bütçesini kullanır. Aynı IP arkasındaki farklı hedef hesaplar birbirini
      kilitlemez. Personel girişi, yenileme ve parola uçları kimlik doğrulama bütçesini paylaşır; genel
      yazma bütçesini kullanmaz. Aşırı büyük kimlik doğrulama gövdesi tamponlanmadan reddedilir.
    given:
