# Kimlik doğrulama, oturum, parola ve personel girişi senaryoları.
# Biçim: test/scenarios/README.md. Kaynak: Java origin/main (okundu, koşturulmadı).
# K12 (15 dk erişim token'ı + refresh rotasyonu + yeniden kullanım tespiti) ve K13 (personel TOTP)
# Java'dan bilinçli ayrılık; ilgili senaryolarda `target` alanında.

domain: auth
version: 0
scenarios:

  - id: AUTH-001
    priority: P0
    title: Girişte kayıtlı olmayan e-posta, yanlış parolalı kayıtlı e-postadan ayırt edilemez
    rule: >
      Kayıtsız e-postayla giriş ile kayıtlı e-posta + yanlış parola aynı hata kodunu ve aynı yanıt
      gövdesini döndürür. Kayıtsız dalda da parola doğrulama maliyeti ödenir ve cihaz araması yapılır.
      İki deneme de başarısız giriş denemesi olarak kaydedilir.
    given:
      - "a@örnek kayıtlı ve e-postası doğrulanmış; b@örnek kayıtlı değil"
    when:
      - "a@örnek yanlış parolayla giriş dener"
      - "b@örnek herhangi bir parolayla giriş dener"
    then:
      - "İki yanıt da kimlik doğrulama hatası; hata kodu ve gövde bayt bayt aynı"
      - "Kayıtsız dalda da yapılandırılmış hash'e karşı parola doğrulaması yapılır (zamanlama eşitliği)"
      - "İki deneme de giriş denemesi tablosuna başarısız olarak yazılır"
    error: AUTH_EMAIL_OR_PASSWORD_MISMATCH
    source:
      - "com/exskylab/koala/webAPI/LoginEnumerationIT.java#anUnregisteredEmailLooksExactlyLikeARegisteredOneWithAWrongPassword"
      - "com/exskylab/koala/webAPI/LoginEnumerationIT.java#bothBranchesAnswerTheStatusAndCodeTheIssueAsksFor"
      - "com/exskylab/koala/webAPI/LoginEnumerationIT.java#anUnregisteredEmailIsStillRecordedAsAFailedLoginAttempt"
      - "com/exskylab/koala/business/concretes/LoginConcealmentTest.java#anUnregisteredEmailStillPaysForAPasswordVerification"
      - "com/exskylab/koala/business/concretes/LoginConcealmentTest.java#anUnregisteredEmailStillPaysForTheDeviceLookupTheRegisteredOnePays"
    go_test: null

  - id: AUTH-002
    priority: P0
    title: Aynı cihazda yeni giriş önceki oturumu kapatır; farklı cihazlar bağımsızdır
    rule: >
      Oturum cihaza bağlıdır. Bir cihazda yeniden giriş, o cihazın açık oturumlarını kapatır. Farklı
      cihaz kimlikleri, örneğin iki tarayıcı profili, birbirinden bağımsız oturumlar tutar. Web
      istemcisi geçerli bir cihaz kimliği göndermeden giriş yapamaz; kimlik bilgileri bakılmadan önce
      reddedilir.
    given:
      - "Kullanıcı U, web profili W1 ile oturum S1 açmış"
    when:
      - "U, W1 ile yeniden giriş yapar"
      - "U, W2 ile giriş yapar"
      - "U, cihaz kimliği olmadan ya da bozuk kimlikle web girişi dener"
    then:
      - "S1 kapanır, W1 için yeni oturum açılır"
      - "W2 oturumu ayrı açılır; W1 oturumu açık kalır"
      - "Cihaz kimliği olmayan web girişi reddedilir; kimlik bilgisi sorgulanmaz"
    source:
      - "com/exskylab/koala/webAPI/WebDeviceIdentityIT.java#aSecondLoginForTheSameWebProfileReplacesItsPreviousSession"
      - "com/exskylab/koala/webAPI/WebDeviceIdentityIT.java#twoWebProfileIdsKeepTwoIndependentSessionsActive"
      - "com/exskylab/koala/webAPI/WebDeviceIdentityIT.java#webLoginWithoutADeviceIdIsRejectedBeforeCredentialLookup"
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java:236-241"
    go_test: null

  - id: AUTH-003
    priority: P0
    title: Yenileme süresi dolmuş erişim token'ıyla çalışır ama imza sahteyse çalışmaz
    rule: >
      Yenileme akışı, oturum kimliğini süresi dolmuş (günlerce eski olsa bile) erişim token'ından
      okuyabilir. İmzası sahte ya da biçimi bozuk token reddedilir. Gerçek zamanlı kimlik bilgisi
      (realtime credential) yenileme akışına giremez. Yenileme başarısızsa sebep oturumdur, token
      süresi değildir.
    given:
      - "Kullanıcının oturumu S açık; erişim token'ı 3 gün önce dolmuş"
    when:
      - "Süresi dolmuş token ve doğru refresh token'la yenileme ister"
      - "İmzası değiştirilmiş token'la yenileme ister"
      - "Gerçek zamanlı kimlik bilgisiyle yenileme ister"
    then:
      - "İlki yeni erişim token'ı alır"
      - "İkinci ve üçüncü reddedilir (kimlik doğrulama hatası)"
      - "Sıkı (normal) token çözücü süresi dolmuş token'ı her yerde reddetmeye devam eder"
    source:
      - "com/exskylab/koala/core/security/ExpiredTokenRefreshTest.java#aTokenExpiredForDaysStillWorks"
      - "com/exskylab/koala/core/security/ExpiredTokenRefreshTest.java#aForgedSignatureIsRejectedEvenWhenExpiryIsTolerated"
      - "com/exskylab/koala/core/security/ExpiredTokenRefreshTest.java#theStrictExtractorStillRejectsAnExpiredToken"
      - "com/exskylab/koala/core/security/ExpiredTokenRefreshTest.java#aRealtimeCredentialCannotEnterTheRefreshFlow"
      - "com/exskylab/koala/webAPI/ErrorContractIT.java#refreshGetsPastAnExpiredAccessTokenAndFailsOnTheSessionInstead"
    go_test: null

  - id: AUTH-004
    priority: P0
    title: Yenileme başka cihazdan gelirse oturum kapatılır
    rule: >
      Yenileme isteğindeki cihaz kimliği oturumun cihazıyla eşleşmezse oturum hemen pasifleşir ve istek
      reddedilir. Bu bir güvenlik alarmı olarak loglanır.
    given:
      - "Oturum S, web profili W1'e bağlı ve açık"
    when:
      - "S'nin token'larıyla W2 cihaz kimliğinden yenileme istenir"
    then:
      - "S pasif olur; istek reddedilir"
      - "Ardından W1'den gelen yenileme de reddedilir (oturum kapalı)"
    error: AUTH_SESSION_NOT_MATCHING_CURRENT_DEVICE
    source:
      - "com/exskylab/koala/webAPI/WebDeviceIdentityIT.java#changingTheWebDeviceIdDeactivatesTheSessionAndReturnsUnauthorized"
      - "com/exskylab/koala/webAPI/WebDeviceIdentityIT.java#webRefreshWithoutOrWithAMalformedDeviceIdIsRejected"
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java:283-291"
    go_test: null

  - id: AUTH-005
    priority: P0
    title: Refresh token oturuma bağlıdır; süresi dolunca oturum kapanır
    rule: >
      Yenileme yalnız açık oturumda ve oturumun refresh hash'iyle eşleşen token'la yapılır. Refresh
      süresi dolmuşsa oturum pasifleşir. Kalan süre 7 günden azsa refresh süresi 30 güne uzatılır
      (kayan pencere). Java'da yenileme aynı refresh token'ı geri döndürür, rotasyon yoktur.
    given:
      - "Oturum S açık; refresh süresi 5 gün sonra doluyor"
    when:
      - "Doğru refresh token'la yenileme ister"
      - "Yanlış refresh token'la yenileme ister"
      - "Kapalı bir oturum için yenileme ister"
      - "Refresh süresi dolmuş oturum için yenileme ister"
    then:
      - "Doğru token → yeni erişim token'ı; refresh süresi şimdi + 30 gün; aynı refresh token döner"
      - "Yanlış token → AUTH_REFRESH_TOKEN_AND_SESSION_MISMATCH; oturum açık kalır"
      - "Kapalı oturum → AUTH_SESSION_NOT_FOUND_OR_INACTIVE"
      - "Süresi dolmuş → AUTH_REFRESH_TOKEN_EXPIRED ve oturum pasif"
    decision: K12
    target: >
      K12: erişim token'ı 15 dakika (Java'da 12 saat). Her yenilemede yeni bir refresh token verilir
      (rotasyon). Eski refresh token tekrar kullanılırsa token ailesinin tamamı iptal edilir
      (yeniden kullanım tespiti). Yanlış token'ın oturumu açık bırakması K12'de yeniden ele alınır.
    source:
      - "com/exskylab/koala/webAPI/ErrorContractIT.java#refreshForAClosedSessionIsUnauthorized"
      - "src/main/java/com/exskylab/koala/business/concretes/AuthManager.java:258-313"
    go_test: null

  - id: AUTH-006
    priority: P0
    title: Parola sıfırlama bağlantısı tek kullanımlık ve kısa ömürlüdür
    rule: >
      Sıfırlama bağlantısı bir kez kullanılabilir. Yeni bağlantı istenince öncekiler geçersizleşir.
      Bağlantı süresi dolunca (varsayılan 15 dk) parola değiştirilemez. Oturumdayken parola
      değiştirilirse açık sıfırlama bağlantısı geçersizleşir. Güvenlik bildirimi yalnız commit'ten
      sonra kuyruğa girer.
    given:
      - "Kullanıcı U için sıfırlama bağlantısı L1 üretilmiş"
    when:
      - "L1 ile parola sıfırlanır, sonra L1 tekrar kullanılır"
      - "L2 istenir, sonra L1 kullanılır"
      - "Süresi dolmuş L3 kullanılır"
      - "U oturumdayken parolasını değiştirir, sonra L4 kullanılır"
    then:
      - "İlk kullanım başarılı; ikinci kullanım reddedilir"
      - "L2'den sonra L1 reddedilir"
      - "L3 reddedilir; parola değişmez"
      - "Parola değişiminden sonra L4 reddedilir"
      - "Başarılı sıfırlamanın güvenlik e-postası işlem commit edildikten sonra kuyruğa girer"
    source:
      - "com/exskylab/koala/webAPI/PasswordResetIT.java#aPasswordResetLinkCanOnlyBeUsedOnce"
      - "com/exskylab/koala/webAPI/PasswordResetIT.java#requestingANewLinkInvalidatesThePreviousLink"
      - "com/exskylab/koala/webAPI/PasswordResetIT.java#anExpiredLinkCannotResetThePassword"
      - "com/exskylab/koala/webAPI/PasswordResetIT.java#changingThePasswordWhileLoggedInInvalidatesAnExistingResetLink"
      - "com/exskylab/koala/webAPI/PasswordResetIT.java#successfulResetQueuesTheSecurityNoticeOnlyAfterCommit"
    go_test: null

  - id: AUTH-007
    priority: P0
    title: Parola sıfırlama adres sızdırmaz ve bütün oturumları kapatır
    rule: >
      Bilinmeyen adres için sıfırlama isteği, bilinen adresle aynı yanıtı alır ve e-posta gönderilmez.
      Başarılı sıfırlama parola hash'ini değiştirir ve kullanıcının bütün oturumlarını kapatır.
      Geçersiz token'la hiçbir şey değişmez.
    given:
      - "a@örnek kayıtlı, iki cihazda açık oturumu var; b@örnek kayıtlı değil"
    when:
      - "b@örnek için sıfırlama istenir"
      - "a@örnek için sıfırlama istenir ve bağlantıyla yeni parola kaydedilir"
      - "Uydurma token'la sıfırlama denenir"
    then:
      - "b@örnek: yanıt a@örnek ile aynı; e-posta yok"
      - "a@örnek: bağlantı gönderilir; sıfırlama sonrası hash değişir, iki oturum da kapanır"
      - "Uydurma token: reddedilir, hiçbir kayıt değişmez"
    source:
      - "com/exskylab/koala/business/concretes/PasswordResetTest.java#anUnknownAddressGetsTheSameResponseAndNoMailIsSent"
      - "com/exskylab/koala/business/concretes/PasswordResetTest.java#aKnownAddressReceivesAResetLink"
      - "com/exskylab/koala/business/concretes/PasswordResetTest.java#resettingReplacesTheHashAndClosesEverySession"
      - "com/exskylab/koala/business/concretes/PasswordResetTest.java#anInvalidTokenIsRejectedBeforeAnythingChanges"
    go_test: null

  - id: AUTH-008
    priority: P0
    title: Kayıt başlatma kayıtlı adresi sızdırmaz
    rule: >
      Zaten kayıtlı adresle kayıt başlatmak hata vermez. Bekleyen kayıt oluşmaz ve e-posta gönderilmez,
      yani yanıt yeni adresten ayırt edilemez. Bekleyen kaydı olan adres için ikinci deneme eski kaydı
      silip yenisini gönderir.
    given:
      - "a@örnek kayıtlı; c@örnek için bekleyen kayıt var; d@örnek yeni"
    when:
      - "Üç adres için kayıt başlatılır"
    then:
      - "a@örnek: başarılı yanıt, bekleyen kayıt yok, e-posta yok"
      - "c@örnek: eski bekleyen kayıt silinir, yenisi oluşur, e-posta gider"
      - "d@örnek: bekleyen kayıt oluşur, e-posta gider"
    source:
      - "com/exskylab/koala/business/concretes/RegistrationEnumerationTest.java#anAlreadyRegisteredAddressDoesNotProduceADistinguishableError"
      - "com/exskylab/koala/business/concretes/RegistrationEnumerationTest.java#aNewAddressStartsRegistration"
      - "com/exskylab/koala/business/concretes/RegistrationEnumerationTest.java#aSecondAttemptResendsInsteadOfFailing"
    go_test: null

  - id: AUTH-009
    priority: P0
    title: Parola kuralı en az 12 karakter, en çok 72 bayt
    rule: >
      Parola belirleyen her yüzeyde (kayıt, sıfırlama, değiştirme, personel) tek kural geçerlidir:
      en az 12 karakter, UTF-8'de en çok 72 bayt (bcrypt sınırı). Rakam ya da büyük harf şartı yoktur.
      Giriş yüzeyi kullanıcının mevcut parolasını bu kurala bakmadan kabul eder.
    given:
      - "Parola belirleme yüzeyleri: kayıt tamamlama, sıfırlama, oturumda değiştirme, personel parolası"
    when:
      - "1 karakterlik, 11 karakterlik, 73 baytlık ve rakamsız 20 karakterlik parolalar denenir"
      - "Eski kurala göre belirlenmiş 8 karakterlik parolayla giriş yapılır"
    then:
      - "1, 11 karakter ve 73 bayt her yüzeyde reddedilir"
      - "Rakamsız ve büyük harfsiz uzun parola kabul edilir"
      - "8 karakterlik mevcut parolayla giriş kurala takılmaz"
    source:
      - "com/exskylab/koala/core/customValidations/PasswordPolicyTest.java#theRuleIsTwelveCharactersAndSeventyTwoBytesUntilSomeoneDecidesOtherwise"
      - "com/exskylab/koala/core/customValidations/PasswordPolicyTest.java#aPasswordJustUnderTheMinimumIsRefusedByEveryPasswordSurface"
      - "com/exskylab/koala/core/customValidations/PasswordPolicyTest.java#aPasswordThatBcryptWouldSilentlyRefuseIsRefusedByEveryPasswordSurface"
      - "com/exskylab/koala/core/customValidations/PasswordPolicyTest.java#aLongPassphraseWithoutDigitsOrCapitalsIsAcceptedByEveryPasswordSurface"
      - "com/exskylab/koala/core/customValidations/PasswordPolicyTest.java#theLoginSurfaceKeepsAcceptingWhateverTheUserAlreadyHas"
    go_test: null

  - id: AUTH-010
    priority: P0
    title: Personel girişinde hesap yok, parola yanlış ve hesap kapalı ayırt edilemez
    rule: >
      Personel girişinde üç durum aynı hata kodunu ve aynı gövdeyi döndürür: hesap yok, parola yanlış,
      hesap devre dışı. Devre dışı hesabın doğru parolası da çalışmaz.
    given:
      - "P1 aktif personel; P2 devre dışı personel; p3@örnek personel değil"
    when:
      - "P1 yanlış parolayla, P2 doğru parolayla, p3@örnek herhangi bir parolayla giriş dener"
    then:
      - "Üçü de aynı yanıtı alır"
    error: STAFF_LOGIN_FAILED
    source:
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aWrongPasswordIsIndistinguishableFromAnAccountThatDoesNotExist"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#bothBranchesCarryTheSameErrorCode"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aDisabledAccountIsIndistinguishableTooAndItsPasswordStillDoesNotWork"
    go_test: null

  - id: AUTH-011
    priority: P0
    title: Beş yanlış parola personel hesabını 15 dakika kilitler
    rule: >
      Personel hesabında art arda 5 yanlış parola hesabı kilitler. Kilit süresi varsayılan olarak
      15 dakikadır. Kilitliyken:
      - doğru parola da reddedilir;
      - doğru ya da yanlış hiçbir deneme kilidi uzatmaz;
      - yanıt kilidi belli etmez.
      Başarılı giriş başarısızlık sayacını sıfırlar.
    given:
      - "Personel P aktif, başarısızlık sayacı 0"
    when:
      - "P 5 kez yanlış parola girer"
      - "Kilitliyken doğru ve yanlış parola dener"
      - "Başka bir personel 2 yanlış girişten sonra doğru parolayla girer"
    then:
      - "5. denemeden sonra kilit zamanı yazılır"
      - "Kilitliyken iki deneme de STAFF_LOGIN_FAILED; kilit zamanı değişmez; yanıt kilitsiz yanlış parolayla aynı"
      - "Başarılı girişte sayaç 0"
    error: STAFF_LOGIN_FAILED
    decision: K13
    target: "K13: personel için TOTP v1'de zorunlu. Parola doğrulamasından sonra ikinci faktör istenir."
    source:
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#fiveWrongPasswordsLockTheAccountAndTheRightPasswordStopsWorking"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aCorrectPasswordWhileLockedDoesNotExtendTheLock"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#theLockLeavesNoTraceInTheResponseEither"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aSuccessfulSignInClearsTheFailureCounter"
    go_test: null

  - id: AUTH-012
    priority: P0
    title: Personel izinleri token'dan değil veritabanından okunur
    rule: >
      Personel token'ı kimliği taşır, izin taşımaz. İzinler her istekte rol DAG'ından çözülür. Bu
      yüzden üyelik ya da rol iptali bir sonraki istekte geçerli olur. Süresi dolmuş erişim token'ı
      reddedilir. Refresh token, erişim token'ı olarak kullanılamaz.
    given:
      - "Personel P, FINANCE_OFFICER rolüyle payout.reconcile iznine sahip; geçerli erişim token'ı T"
    when:
      - "P, T ile izinli bir personel ucuna istek atar"
      - "P'nin rolü kaldırılır; P aynı T ile tekrar istek atar"
      - "P süresi dolmuş token'la, sonra refresh token'la istek atar"
    then:
      - "İlk istek geçer"
      - "Rol kaldırıldıktan hemen sonraki istek izin yok (403) alır; T hâlâ imza olarak geçerlidir"
      - "Süresi dolmuş token ve refresh token kimlik doğrulama hatası alır"
    source:
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#aStaffTokenCarryingTheRequiredPermissionPassesTheAdminGate"
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#permissionsComeFromKoalaNotFromTheToken"
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#revokingTheMembershipTakesEffectOnTheVeryNextRequest"
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#anExpiredStaffTokenIsRejected"
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#aRefreshTokenIsNotAnAccessToken"
    go_test: null

  - id: AUTH-013
    priority: P0
    title: Personel çıkışı ve parola değişimi bütün token'ları geçersiz kılar
    rule: >
      Personel çıkışı, hesabın token sürümünü artırır. Bu, o ana kadar verilmiş bütün erişim ve
      refresh token'larını geçersiz kılar. Parola değişimi de aynı etkiyi yapar, değişikliği yapan
      token dahil. Parola değişimi mevcut parolayı ister. Kimliksiz biri başkasını çıkış yaptıramaz.
    given:
      - "Personel P'nin iki cihazda geçerli token çiftleri var"
    when:
      - "P bir cihazdan çıkış yapar"
      - "P yeniden girip parolasını değiştirir"
    then:
      - "Çıkıştan sonra her iki cihazın erişim ve refresh token'ları reddedilir (STAFF_SESSION_ENDED / kimlik hatası)"
      - "Parola değişiminden sonra değişikliği yapan token da reddedilir"
      - "Yanlış mevcut parolayla değişim reddedilir"
    source:
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#loggingOutInvalidatesTheTokenThatAskedForIt"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aRefreshTokenBuysANewAccessTokenAndTheOldRefreshTokenDiesWithLogout"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#changingThePasswordInvalidatesEveryTokenIncludingTheOneThatChangedIt"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#theChangePasswordEndpointStillChecksTheCurrentPassword"
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#anAnonymousCallerCannotLogSomeoneElseOut"
    go_test: null

  - id: AUTH-014
    priority: P0
    title: Yeni personel hesabı önce parolasını değiştirmek zorunda
    rule: >
      "Parola değişmeli" işaretli personel, parola değiştirme dışında hiçbir personel ucuna erişemez.
      Parolayı değiştirince işaret kalkar.
    given:
      - "Personel P yeni oluşturulmuş; parola değişmeli işareti açık"
    when:
      - "P giriş yapar ve bir okuma ucuna istek atar"
      - "P parolasını değiştirir ve aynı uca tekrar istek atar"
    then:
      - "İlk istek reddedilir (403)"
      - "Parola değişiminden sonra (yeni token'la) istek geçer"
    source:
      - "com/exskylab/koala/webAPI/StaffLoginIT.java#aFreshAccountMustChangeItsPasswordBeforeReachingAnythingElse"
      - "com/exskylab/koala/webAPI/StaffAuthenticationIT.java#aStaffMemberWhoMustChangeTheirPasswordReachesNothingElse"
    go_test: null

  - id: AUTH-015
    priority: P0
    title: Pazaryeri ve personel kimlikleri birbirine geçmez
    rule: >
      Pazaryeri kullanıcı token'ı hiçbir zaman personel kimliği üretmez. Pazaryerindeki ROLE_ADMIN
      personel yüzeyini açmaz, çünkü köprü kapalıdır. Personel token'ı pazaryeri uçlarında işe
      yaramaz. Kimliksiz istek personel yüzeyine ulaşamaz. Eşlenmemiş bir personel yolu tahmin
      edilmez, reddedilir.
    given:
      - "U pazaryeri kullanıcısı (ROLE_ADMIN dahil); P personel"
    when:
      - "U kendi token'ıyla personel ucuna istek atar"
      - "P kendi token'ıyla pazaryeri ucuna istek atar"
      - "Kimliksiz istek ve eşlenmemiş /admin yolu denenir"
    then:
      - "U reddedilir (ROLE_ADMIN olsa bile)"
      - "P pazaryeri ucunda kimliksiz sayılır"
      - "Kimliksiz istek ve eşlenmemiş yol reddedilir"
