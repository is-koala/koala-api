  - id: AUTH-017
    priority: P1
    title: Gerçek zamanlı bağlantı kimlik bilgisi yalnız WS bağlantısında ve oturum açıkken geçerli
    rule: >
      Açık bir oturum, önbelleğe alınmayan kısa ömürlü bir gerçek zamanlı kimlik bilgisi alabilir. Bu
      bilgi HTTP isteğinde kimlik doğrulamaz. Başka bir kitle (audience) için verilmiş bilgi bağlanamaz.
      Bilgi, oturumdaki kullanıcıdan başkasını iddia edemez. Süresi dolmuş bilgi ya da iptal edilmiş
      oturumun bilgisi bağlanamaz.
    given:
      - "U'nun açık oturumu S"
    when:
      - "U kimlik bilgisi C alır; C ile bir HTTP ucu çağrılır; C ile WS bağlantısı kurulur"
      - "S kapatıldıktan sonra C ile bağlanılır"
    then:
      - "C alınır; yanıt önbelleğe alınamaz"
      - "HTTP isteği kimliksiz sayılır"
      - "WS bağlantısı kurulur"
      - "S kapandıktan sonra bağlantı reddedilir; süresi dolmuş ya da başka kitleli bilgi de reddedilir"
    decision: K4
    target: "K4: düz WebSocket + JSON olay protokolü. Kural aynı kalır, taşıyıcı değişir (WS bileti Faz 0 spike'ı)."
    source:
