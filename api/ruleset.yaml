# Spec lint (vacuum, Spectral biçimi): kök spec'in kuralları (make
# api-lint). Spectral'ın önerilen kural seti + Koala kuralları. Her kuralın
# açıklaması stil rehberindeki maddeyi verir: docs/api-style-guide.md.
extends:
  - [spectral:oas, recommended]
  - ./ruleset-schemas.yaml

rules:
  # Yollar ve operasyonlar

  koala-paths-v1:
    description: Her yol /v1 altındadır (stil rehberi §2, ADR-0005 madde 2).
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/v1/"

  koala-paths-kebab-case:
    description: Yol parçaları küçük harf kebab-case, parametreler camelCase; sonda eğik çizgi yok (stil rehberi §1).
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-z][a-zA-Z0-9]*\\}))+$"

  koala-operation-id-camel-case:
    description: Her operasyonun camelCase bir operationId'si var (stil rehberi §1, ADR-0005 madde 1).
    severity: error
    given: "$.paths[*][get,put,post,patch,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          required: [operationId]
          properties:
            operationId:
              type: string
              pattern: "^[a-z][a-zA-Z0-9]*$"

  koala-operation-authz:
    description: "Her operasyon ya `x-authz` ({action: model.fga'daki `can_*` relation'ı, object: tip}) taşır, ya `security: []` ile açıkça public'tir, ya da `x-authz-exempt: <gerekçe>` ile belgeli istisnadır (kimlik ister ama yetkilendirilecek nesnesi yoktur), ya da yalnız `x-authz-permission` taşıyan bir personel operasyonudur (izin nesnesi platformdur). Yalnız biri bulunur: `x-authz` ile `x-authz-permission` ikilisi burada da reddedilir, koala-admin-permission'ın dışladığı self-servis ve kimlik yollarında da (stil rehberi §11, ADR-0005 madde 1, ADR-0014; üçüncü biçim ADR-0021, dördüncü biçim ADR-0026 ile ADR-0005 madde 1'i ve plan §4.1-1/§6.3'ü genişletir)."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete,head,options,trace]"
    then:
      function: schema
      functionOptions:
        schema:
          oneOf:
            - required: [x-authz]
              properties:
                x-authz:
                  type: object
                  required: [action, object]
                  additionalProperties: false
                  properties:
                    action:
                      type: string
                      pattern: "^can_[a-z_]+$"
                    object:
                      type: string
                      pattern: "^[a-z][a-z_]*$"
                security:
                  type: array
                  minItems: 1
              not:
                anyOf:
                  - required: [x-authz-exempt]
                  - required: [x-authz-permission]
            - required: [security]
              properties:
                security:
                  type: array
                  maxItems: 0
              not:
                anyOf:
                  - required: [x-authz]
                  - required: [x-authz-exempt]
            - required: [x-authz-exempt]
              properties:
                x-authz-exempt:
                  type: string
                  minLength: 20
                security:
                  type: array
                  minItems: 1
              not:
                required: [x-authz]
            - required: [x-authz-permission, security]
              properties:
                security:
                  type: array
                  minItems: 1
              not:
                anyOf:
                  - required: [x-authz]
                  - required: [x-authz-exempt]

  koala-get-resource:
    description: "Her GET operasyonu okuduğu tabloyu `x-resource: <tablo>` ile adlandırır (soft-delete kataloğundaki ad; üretilmiş okuma testi onu kullanır) ya da tablo okumuyorsa `x-resource: none` ile birlikte en az 20 karakterlik `x-resource-reason` yazar (stil rehberi §11, ADR-0020 §11, ADR-0026)."
    severity: error
    given: "$.paths[*].get"
    then:
      function: schema
      functionOptions:
        schema:
          required: [x-resource]
          properties:
            x-resource:
              type: string
              pattern: "^[a-z][a-z0-9_]*$"
          if:
            required: [x-resource]
            properties:
              x-resource:
                const: none
          then:
            required: [x-resource-reason]
            properties:
              x-resource-reason:
                type: string
                minLength: 20

  koala-admin-permission:
    description: "/v1/admin altındaki her operasyon, izinsiz personel uçlarının açık izin listesi (`/v1/admin/me`, `/v1/admin/me/capabilities`, `/v1/admin/auth/login`, `/v1/admin/auth/refresh`, `/v1/admin/auth/logout`, `/v1/admin/auth/password`) dışında, adminBearer kullanır ve `x-authz-permission` (`payout.release` biçiminde) taşır, `x-authz` taşımaz (izin nesnesi platformdur); her HTTP metodunda (stil rehberi §11, ADR-0005 madde 1, ADR-0025 §9, ADR-0026)."
    severity: error
    given: "$.paths[?(@property.match(/^\\/v1\\/admin\\//) && !@property.match(/^\\/v1\\/admin\\/(me(\\/capabilities)?|auth\\/(login|refresh|logout|password))$/))][get,put,post,patch,delete,head,options,trace]"
    then:
      function: schema
      functionOptions:
        schema:
          required: [security, x-authz-permission]
          not:
            required: [x-authz]
          properties:
            x-authz-permission:
              type: string
              pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)+$"
            security:
              type: array
              minItems: 1
              items:
                type: object
                required: [adminBearer]
                maxProperties: 1

  koala-admin-self-service:
    description: "İzin listesindeki kimlikli personel uçları (`/v1/admin/me`, `/v1/admin/me/capabilities`, `/v1/admin/auth/logout`, `/v1/admin/auth/password`) personelin yalnız kendi hesabına dokunur: adminBearer + `x-authz-exempt`, `x-authz-permission` yok (ADR-0025 §9, ADR-0026)."
    severity: error
    given: "$.paths[?(@property.match(/^\\/v1\\/admin\\/(me(\\/capabilities)?|auth\\/(logout|password))$/))][get,put,post,patch,delete,head,options,trace]"
    then:
      function: schema
      functionOptions:
        schema:
          required: [security, x-authz-exempt]
          properties:
            security:
              type: array
              minItems: 1
              items:
                type: object
                required: [adminBearer]
                maxProperties: 1
          not:
            required: [x-authz-permission]

  koala-admin-public:
    description: "Kimliksiz personel uçları yalnız giriş ve yenilemedir (`/v1/admin/auth/login`, `/v1/admin/auth/refresh`): `security: []`, izin ve muafiyet yok (ADR-0025 §9)."
    severity: error
    given: "$.paths[?(@property.match(/^\\/v1\\/admin\\/auth\\/(login|refresh)$/))][get,put,post,patch,delete,head,options,trace]"
    then:
      function: schema
      functionOptions:
        schema:
          required: [security]
          properties:
            security:
              type: array
              maxItems: 0
          not:
            anyOf:
              - required: [x-authz-permission]
              - required: [x-authz-exempt]

  koala-admin-only-under-admin:
    description: adminBearer ve `x-authz-permission` yalnız /v1/admin altında kullanılır (stil rehberi §11).
    severity: error
    given: "$.paths[?(!@property.match(/^\\/v1\\/admin\\//))][get,put,post,patch,delete,head,options,trace]"
    then:
      function: schema
      functionOptions:
        schema:
          not:
            required: [x-authz-permission]
          properties:
            security:
              items:
                not:
                  required: [adminBearer]

  koala-idempotency-key:
    description: "Her POST ya zorunlu Idempotency-Key başlığını alır ya da `x-no-idempotency-key: <gerekçe>` yazar (stil rehberi §7, ADR-0005 madde 6; uzantı öneri)."
    severity: error
    given: "$.paths[*].post"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [x-no-idempotency-key]
              properties:
                x-no-idempotency-key:
                  type: string
                  minLength: 10
            - required: [parameters]
              properties:
                parameters:
                  contains:
                    required: [name, in, required]
                    properties:
                      name:
                        const: Idempotency-Key
                      in:
                        const: header
                      required:
                        const: true

  koala-location-on-201:
    description: "201 yanıtı `Location` başlığıyla oluşan kaynağı gösterir; adreslenebilir bir kaynak oluşmuyorsa (kısa ömürlü bir bilet gibi) operasyon `x-no-location: <gerekçe>` yazar (stil rehberi §3, §5; öneri)."
    severity: error
    given: "$.paths[*][post,put,patch]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: [responses]
            properties:
              responses:
                required: ["201"]
          then:
            anyOf:
              - properties:
                  responses:
                    properties:
                      "201":
                        required: [headers]
                        properties:
                          headers:
                            required: [Location]
                required: [responses]
              - required: [x-no-location]
                properties:
                  x-no-location:
                    type: string
                    minLength: 10

  koala-default-problem-response:
    description: Her operasyon `default` yanıtını tanımlar (stil rehberi §5).
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].responses"
    then:
      field: default
      function: defined

  koala-error-responses-are-problems:
    description: 4xx, 5xx ve default yanıtları içerikli olur ve yalnız application/problem+json Problem gövdesi döner (stil rehberi §5, ADR-0007).
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/) || @property == 'default')]"
    then:
      function: schema
      functionOptions:
        schema:
          required: [content]
          properties:
            content:
              type: object
              required: [application/problem+json]
              maxProperties: 1
              properties:
                application/problem+json:
                  required: [schema]
                  properties:
                    schema:
                      required: [properties]
                      properties:
                        properties:
                          required: [type, title, status, code]

  koala-no-envelope:
    description: Başarılı yanıt çıplak gövdedir; `success`/`httpStatus`/`message` zarfı yok (stil rehberi §5, ADR-0005 madde 3).
    severity: error
    given:
      - "$.paths[*][*].responses[?(@property.match(/^2/))].content[*].schema.properties[*]~"
      - "$.paths[*][*].responses[?(@property.match(/^2/))].content[*].schema.allOf[*].properties[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(success|httpStatus|message)$"

  koala-closed-request-body:
    description: "JSON istek gövdesi ve içindeki her nesne bilinmeyen alanı reddeder: `additionalProperties: false`, allOf ile kurulan nesnede `unevaluatedProperties: false` (stil rehberi §4, plan §3.3)."
    severity: error
    # The body, every object-valued member, oneOf/anyOf branch and array
    # item. allOf members are not checked on their own: the allOf owner's
    # unevaluatedProperties closes them.
    given:
      - "$.paths[*][post,put,patch].requestBody.content[?(@property == 'application/json' || @property == 'application/merge-patch+json')].schema"
      - "$.paths[*][post,put,patch].requestBody.content[?(@property == 'application/json' || @property == 'application/merge-patch+json')].schema..properties[?(@ && @.properties)]"
      - "$.paths[*][post,put,patch].requestBody.content[?(@property == 'application/json' || @property == 'application/merge-patch+json')].schema..oneOf[?(@ && @.properties)]"
      - "$.paths[*][post,put,patch].requestBody.content[?(@property == 'application/json' || @property == 'application/merge-patch+json')].schema..anyOf[?(@ && @.properties)]"
      - "$.paths[*][post,put,patch].requestBody.content[?(@property == 'application/json' || @property == 'application/merge-patch+json')].schema..[?(@ && @.items && @.items.properties)].items"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [additionalProperties]
              properties:
                additionalProperties:
                  const: false
            - required: [unevaluatedProperties]
              properties:
                unevaluatedProperties:
                  const: false

  koala-patch-is-merge-patch:
    description: "PATCH gövdesi yalnız JSON Merge Patch'tir (`application/merge-patch+json`, RFC 7396) (stil rehberi §3, ADR-0019)."
    severity: error
    given: "$.paths[*].patch.requestBody.content"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [application/merge-patch+json]
          maxProperties: 1

  koala-merge-patch-shape:
    description: "Merge patch şemasının kökünde zorunlu üye yoktur: her üye ayrı ayrı yamanır. İç içe değer nesneleri (Money gibi) atomiktir ve kendi zorunlu üyelerini korur (stil rehberi §3, RFC 7396)."
    severity: error
    given: "$.paths[*].patch.requestBody.content['application/merge-patch+json'].schema"
    then:
      function: schema
      functionOptions:
        schema:
          not:
            required: [required]

  koala-merge-patch-nullable:
    description: "Merge patch'te temizlenebilen üye (`type: [T, \"null\"]` ya da `oneOf: [{$ref}, {type: \"null\"}]`), iç içe nesnelerde de, Go'da `nullable.Nullable[T]` olur: `x-go-type: nullable.Nullable[...]` + `x-go-type-skip-optional-pointer: true`. Yoksa temizleme isteği pointer'da kaybolur (stil rehberi §3, ADR-0019)."
    severity: error
    given: "$.paths[*].patch.requestBody.content['application/merge-patch+json'].schema..properties[*]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            anyOf:
              - required: [type]
                properties:
                  type:
                    type: array
                    contains:
                      const: "null"
              - required: [oneOf]
                properties:
                  oneOf:
                    type: array
                    contains:
                      required: [type]
                      properties:
                        type:
                          const: "null"
          then:
            required: [x-go-type, x-go-type-skip-optional-pointer]
            properties:
              x-go-type:
                type: string
                pattern: "^nullable\\.Nullable\\["
              x-go-type-skip-optional-pointer:
                const: true

  koala-no-multipart-upload:
    description: Dosya API'den geçmez; istemci presigned URL ile doğrudan nesne deposuna yükler. multipart/form-data istek gövdesi yok (stil rehberi §4, ADR-0019).
    severity: error
    given: "$.paths[*][post,put,patch].requestBody.content"
    then:
      field: multipart/form-data
      function: undefined

  koala-body-limit:
    description: "`x-body-limit` bayt cinsinden pozitif tam sayıdır; varsayılan 1 MiB'ın yerine geçer (stil rehberi §4, öneri)."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            x-body-limit:
              type: integer
              minimum: 1
              maximum: 2147483647

  # Sayfalama, süzme, sıralama

  koala-cursor-pagination:
    description: Sayfalama cursor'ladır; page/offset parametresi yok (stil rehberi §6, K10).
    severity: error
    given: "$.paths[*][*].parameters[?(@.in == 'query')]"
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^(page|size|offset|pageSize|pageNumber|perPage|skip)$"

  koala-include-total-admin-or-seo:
    description: "`includeTotal` yalnız /v1/admin listelerinde ve SEO'lu aramada bulunur; SEO'lu arama `x-seo-search: true` ile işaretlenir (stil rehberi §6, ADR-0005 madde 4; uzantı öneri)."
    severity: error
    given: "$.paths[?(!@property.match(/^\\/v1\\/admin\\//))][get,post]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            not:
              required: [x-seo-search]
              properties:
                x-seo-search:
                  const: true
          then:
            properties:
              parameters:
                not:
                  contains:
                    required: [name]
                    properties:
                      name:
                        const: includeTotal

  koala-sort-fields:
    description: "`sort` alan operasyon kabul ettiği alanları `x-sort-fields` ile listeler (stil rehberi §6, ADR-0005 madde 4; uzantı öneri)."
    severity: error
    given: "$.paths[*][get,post]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: [parameters]
            properties:
              parameters:
                contains:
                  required: [name]
                  properties:
                    name:
                      const: sort
          then:
            required: [x-sort-fields]
            properties:
              x-sort-fields:
                type: array
                minItems: 1
                items:
                  type: string
                  pattern: "^[a-z][a-zA-Z0-9]*$"

  # Kullanımdan kaldırma

  koala-deprecation-has-sunset:
    description: "`deprecated: true` olan operasyon kaldırılma gününü `x-sunset: YYYY-MM-DD` ile yazar (stil rehberi §12, öneri)."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: [deprecated]
            properties:
              deprecated:
                const: true
          then:
            required: [x-sunset]
            properties:
              x-sunset:
                type: string
                pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
