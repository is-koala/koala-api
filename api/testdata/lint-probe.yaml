# Lint probe (scripts/api-lint-probe.sh). Every case breaks one rule at one
# place; lint-probe.expect lists each (rule, path) pair that must be
# reported, and the script fails if a koala-* result is missing or not
# expected. Cases are independent: a schema case lives in its own
# component, an operation case on its own path. lint-pass.yaml holds the
# correct forms, which must report nothing. Not part of the contract.
openapi: 3.1.1
info:
  title: Lint probe
  version: 0.0.0
security:
  - marketplaceBearer: []
paths:
  # --- paths and operations ---
  /v2/things: # koala-paths-v1
    get:
      x-resource: things
      operationId: listThingsV2
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/Bad_Path: # koala-paths-kebab-case
    get:
      x-resource: things
      operationId: getBadPath
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/bad-operation-id:
    get:
      x-resource: things
      operationId: Get_Thing # koala-operation-id-camel-case
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/no-authz:
    get: # koala-operation-authz: no x-authz and no `security: []`
      x-resource: things
      operationId: getNoAuthz
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/authz-not-a-relation:
    get: # koala-operation-authz: the action is not a model.fga can_* relation
      x-resource: things
      operationId: getAuthzNotARelation
      x-authz: {action: read, object: thing}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/authz-exempt-short:
    get: # koala-operation-authz: an exemption needs a reason, not a word
      x-resource: things
      operationId: getAuthzExemptShort
      x-authz-exempt: kendisi
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/authz-exempt-and-authz:
    get: # koala-operation-authz: x-authz and x-authz-exempt together
      x-resource: things
      operationId: getAuthzExemptAndAuthz
      x-authz: {action: can_read, object: thing}
      x-authz-exempt: Nesnesi olmayan, yalnız kimliği isteyen uç.
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/authz-exempt-public:
    get: # koala-operation-authz: a public operation needs no exemption
      x-resource: things
      operationId: getAuthzExemptPublic
      security: []
      x-authz-exempt: Nesnesi olmayan, yalnız kimliği isteyen uç.
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/users:
    get: # koala-admin-permission: no x-authz-permission
      x-resource: things
      operationId: listUsers
      x-authz: {action: can_read, object: user}
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/exempt-elsewhere:
    get: # koala-admin-permission: x-authz-exempt outside the self-service allow list
      x-resource: things
      operationId: getAdminExemptElsewhere
      x-authz-exempt: Personelin kendi hesabı; izin gerektiren nesne yok.
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/auth/sessions:
    get: # koala-admin-permission: /v1/admin/auth/* outside the explicit allow list needs a permission
      x-resource: things
      operationId: getAdminAuthSessions
      x-authz: {action: can_read, object: thing}
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/reports:
    get: # koala-admin-permission: `security: []` outside the allow list
      x-resource: things
      operationId: getAdminReports
      security: []
      x-authz-permission: report.read
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/head-only:
    head: # koala-admin-permission: HEAD is checked like every other method
      operationId: headAdminHeadOnly
      x-authz: {action: can_read, object: thing}
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/auth/logout:
    get: # koala-admin-self-service: a self-service operation with `security: []`
      x-resource: things
      operationId: getAdminAuthLogout
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/auth/login:
    get: # koala-admin-public: sign-in without `security: []` (and so koala-operation-authz)
      x-resource: things
      operationId: getAdminAuthLogin
      responses:
        default: {$ref: "#/components/responses/Problem"}
    delete: # koala-admin-public: a permission on sign-in
      operationId: deleteAdminAuthLogin
      security: []
      x-authz-permission: auth.login
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/auth/refresh:
    get: # koala-admin-public: an exemption on refresh (and so koala-operation-authz)
      x-resource: things
      operationId: getAdminAuthRefresh
      security: []
      x-authz-exempt: Personelin kendi hesabı; izin gerektiren nesne yok.
      responses:
        default: {$ref: "#/components/responses/Problem"}
    put: # koala-admin-public: refresh with a bearer (`security` must be empty)
      operationId: putAdminAuthRefresh
      x-authz: {action: can_read, object: thing}
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/me:
    get: # koala-admin-self-service: an allow-listed operation without x-authz-exempt
      x-resource: things
      operationId: getAdminMe
      x-authz: {action: can_read, object: thing}
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/both-authz:
    post: # koala-admin-permission: x-authz next to x-authz-permission
      operationId: postAdminBothAuthz
      x-authz: {action: can_read, object: thing}
      x-authz-permission: thing.manage
      security: [{adminBearer: []}]
      x-no-idempotency-key: Probe operasyonu; yan etkisi olmayan bir eylem.
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/no-resource:
    get: # koala-get-resource: a GET without x-resource
      operationId: getNoResource
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/resource-none:
    get: # koala-get-resource: x-resource none without a reason
      operationId: getResourceNone
      x-resource: none
      security: []
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/me/capabilities:
    get: # koala-admin-self-service: the capabilities of oneself need no permission
      x-resource: things
      operationId: getAdminMeCapabilities
      x-authz-permission: role.manage
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/admin/auth/password:
    get: # koala-admin-self-service: an allow-listed operation with a permission
      x-resource: things
      operationId: getAdminAuthPassword
      x-authz-exempt: Personelin kendi hesabı; izin gerektiren nesne yok.
      x-authz-permission: auth.password
      security: [{adminBearer: []}]
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/permission-outside-admin:
    get: # koala-admin-only-under-admin
      x-resource: things
      operationId: getPermissionOutsideAdmin
      x-authz: {action: can_read, object: thing}
      x-authz-permission: thing.read
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/deprecated:
    get: # koala-deprecation-has-sunset
      x-resource: things
      operationId: getDeprecated
      security: []
      deprecated: true
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/no-default:
    get: # koala-default-problem-response
      x-resource: things
      operationId: getNoDefault
      security: []
      responses:
        "204": {description: ok}
  /v1/body-limit:
    post: # koala-body-limit
      operationId: postBodyLimit
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      x-body-limit: big
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        default: {$ref: "#/components/responses/Problem"}

  # --- responses ---
  /v1/error-not-problem:
    get:
      x-resource: things
      operationId: getErrorNotProblem
      security: []
      responses:
        "404": # koala-error-responses-are-problems: JSON, not problem+json
          description: nf
          content:
            application/json:
              schema: {type: object}
        default: {$ref: "#/components/responses/Problem"}
  /v1/error-without-content:
    get:
      x-resource: things
      operationId: getErrorWithoutContent
      security: []
      responses:
        "409": # koala-error-responses-are-problems: a 4xx without content
          description: conflict
        default: {$ref: "#/components/responses/Problem"}
  /v1/envelope-success:
    get:
      x-resource: things
      operationId: getEnvelopeSuccess
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean} # koala-no-envelope
        default: {$ref: "#/components/responses/Problem"}
  /v1/envelope-message:
    get:
      x-resource: things
      operationId: getEnvelopeMessage
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string} # koala-no-envelope
        default: {$ref: "#/components/responses/Problem"}
  /v1/envelope-in-all-of:
    get:
      x-resource: things
      operationId: getEnvelopeInAllOf
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      httpStatus: {type: integer, format: int32} # koala-no-envelope
        default: {$ref: "#/components/responses/Problem"}

  # --- pagination ---
  /v1/page-param:
    get:
      x-resource: things
      operationId: getPageParam
      security: []
      parameters:
        - {name: page, in: query, schema: {type: integer, format: int32}} # koala-cursor-pagination
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/include-total:
    get: # koala-include-total-admin-or-seo
      x-resource: things
      operationId: getIncludeTotal
      security: []
      parameters:
        - {name: includeTotal, in: query, schema: {type: boolean}}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/sort:
    get: # koala-sort-fields
      x-resource: things
      operationId: getSort
      security: []
      parameters:
        - {name: sort, in: query, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Problem"}

  # --- request bodies ---
  /v1/no-idempotency:
    post: # koala-idempotency-key
      operationId: postNoIdempotency
      security: []
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/open-body:
    post:
      operationId: postOpenBody
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      requestBody:
        content:
          application/json:
            schema: # koala-closed-request-body: the body is open
              type: object
              properties:
                name: {type: string}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/open-nested:
    post:
      operationId: postOpenNested
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nested: # koala-closed-request-body: a nested object is open
                  type: object
                  properties:
                    x: {type: string}
                branch: # (its oneOf branch below is the case)
                  oneOf:
                    - type: object # koala-closed-request-body: an open oneOf branch
                      properties:
                        y: {type: string}
                list:
                  type: array
                  items: # koala-closed-request-body: open array items
                    type: object
                    properties:
                      z: {type: string}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/all-of-without-unevaluated:
    post:
      operationId: postAllOfWithoutUnevaluated
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      requestBody:
        content:
          application/json:
            schema: # koala-closed-request-body: allOf without unevaluatedProperties
              type: object
              allOf:
                - type: object
                  properties:
                    name: {type: string}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/all-of-open-member:
    post:
      operationId: postAllOfOpenMember
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              unevaluatedProperties: false
              allOf:
                - type: object
                  properties:
                    inner: # koala-closed-request-body: an allOf member's object is open
                      type: object
                      properties:
                        x: {type: string}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/multipart:
    post:
      operationId: postMultipart
      security: []
      x-no-idempotency-key: probe only, no side effect at all
      requestBody:
        content: # koala-no-multipart-upload
          multipart/form-data:
            schema: {type: object, additionalProperties: false}
      responses:
        default: {$ref: "#/components/responses/Problem"}

  # --- merge patch ---
  /v1/patch-json:
    patch:
      operationId: patchJson
      security: []
      requestBody:
        content: # koala-patch-is-merge-patch
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/patch-required:
    patch:
      operationId: patchRequired
      security: []
      requestBody:
        content:
          application/merge-patch+json:
            schema: # koala-merge-patch-shape: nothing is required in a patch
              type: object
              additionalProperties: false
              required: [x]
              properties:
                x: {type: string}
      responses:
        default: {$ref: "#/components/responses/Problem"}
  /v1/patch-nullable:
    patch:
      operationId: patchNullable
      security: []
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: [string, "null"]} # koala-merge-patch-nullable: type array without nullable.Nullable
                amount: # koala-merge-patch-nullable: nullable $ref without nullable.Nullable
                  oneOf:
                    - {$ref: "#/components/schemas/Money"}
                    - {type: "null"}
                nested:
                  type: object
                  additionalProperties: false
                  properties:
                    label: {type: [string, "null"]} # koala-merge-patch-nullable: in a nested object
      responses:
        default: {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    marketplaceBearer: {type: http, scheme: bearer}
    adminBearer: {type: http, scheme: bearer}
  responses:
    Problem:
      description: problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer, format: int32}
              code: {type: string}
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount: {type: integer, format: int64}
        currency: {type: string, enum: [TRY]}
    # One schema per case: each property breaks one schema rule.
    SnakeCase:
      properties:
        snake_case_field: {type: string} # koala-properties-camel-case
    LowerEnum:
      properties:
        state: {type: string, enum: [active]} # koala-enum-upper-snake
    LowerEnumNullable:
      properties:
        state: {type: [string, "null"], enum: [active, null]} # koala-enum-upper-snake
    NoFormat:
      properties:
        count: {type: integer} # koala-integer-format
    NoFormatNullable:
      properties:
        count: {type: [integer, "null"]} # koala-integer-format
    NullableKeyword:
      properties:
        legacy: {type: string, nullable: true} # koala-no-nullable-keyword
    MoneyAsNumber:
      properties:
        price: {type: number} # koala-money-is-money
    MoneyAsNullableNumber:
      properties:
        wage: {type: [number, "null"]} # koala-money-is-money
    MoneyAsNullableInteger:
      properties:
        refundAmount: {type: [integer, "null"], format: int64} # koala-money-is-money
    RateNotBps:
      properties:
        commissionRate: {type: integer, format: int32} # koala-rate-in-basis-points
    RateNotBpsNullable:
      properties:
        successRate: {type: [number, "null"]} # koala-rate-in-basis-points
    BpsNotInteger:
      properties:
        feeBps: {type: string} # koala-bps-integer
    BpsNotIntegerNullable:
      properties:
        rentBps: {type: [string, "null"]} # koala-bps-integer
    InstantNotDateTime:
      properties:
        createdAt: {type: string} # koala-instant-is-date-time
    DateNotDate:
      properties:
        birthDate: {type: string, format: date-time} # koala-calendar-date-is-date
