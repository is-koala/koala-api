# Koala HTTP sözleşmesi: tek doğruluk kaynağı (ADR-0005, ADR-0006, ADR-0019).
# Kurallar docs/api-style-guide.md'de, makinece zorlanan kısmı
# api/ruleset.yaml'da (make api-lint). Sunucu kodu internal/apiv1'e
# `make generate` ile üretilir; elle düzenlenmez.
openapi: 3.1.1
info:
  title: Koala API
  version: 0.1.0
  summary: İstanbul'da kısa süreli işler pazaryerinin HTTP API'si.
  description: |
    Kurallar: `docs/api-style-guide.md`.

    - Başarılı yanıt çıplak gövdedir; zarf yoktur. Hata yanıtı RFC 9457
      `application/problem+json`'dur ve stabil bir `code` taşır.
    - Para `{amount, currency}` biçimindedir; `amount` kuruş cinsinden tam sayıdır.
      Oranlar baz puandır.
    - Zamanlar RFC 3339'dur.
    - Listeler cursor ile sayfalanır.
    - Platform başlıkları (`X-Request-Id`, `X-Device-Id`, `X-App-Version`,
      `X-Client-Platform`) her istekte geçerlidir ve operasyonlarda listelenmez;
      tanımları `components/headers.yaml`'dadır, zorunluluklarını middleware zorlar.
    - Dosyalar API'den geçmez: istemci presigned URL ile doğrudan nesne deposuna
      yükler (ADR-0019).
  contact:
    name: Koala
    url: https://iskoala.com
  license:
    name: Proprietary
    url: https://iskoala.com

servers:
  - url: https://api.iskoala.com
    description: Üretim
  - url: http://localhost:8080
    description: Yerel geliştirme

# Varsayılan: marketplace kullanıcı token'ı. Public operasyon `security: []`
# yazar; /v1/admin altındaki operasyon adminBearer yazar.
security:
  - marketplaceBearer: []

tags:
  - name: auth
    description: |
      Pazaryeri kullanıcısının girişi, token yenileme ve oturumları (ADR-0015,
      ADR-0025). Oturum cihaza bağlıdır; erişim token'ı 15 dakika, refresh token tek
      kullanımlıktır (K12).
  - name: admin-auth
    description: |
      Personel girişi ve personel token sınıfı (ADR-0015 §5, ADR-0025): kilit,
      `must_change_password`, `token_version`. TOTP Faz 8'de gelir (K13).
  - name: realtime
    description: |
      WebSocket kanalı (ADR-0011, ADR-0018). Bu uçlar üretilen strict sunucunun
      parçası değildir (`internal/apiv1/oapi-codegen.yaml` `exclude-tags`):
      `internal/realtime` onları elle bağlar, çünkü WebSocket ucu istek süre
      sınırının dışında, `Router.Stream` ile çalışır.

paths:
  /v1/realtime/tickets:
    post:
      operationId: issueRealtimeTicket
      tags: [realtime]
      summary: WebSocket bağlantısı için tek kullanımlık bilet verir.
      description: |
        Çağıranın kullanıcısına ve oturumuna bağlı, 60 saniyelik, tek kullanımlık bilet
        döner. Bilet oturumun cihazı için verilir; handshake'te cihaz eşitliği yalnız
        cihazını beyan eden yerel istemcide denetlenir ve bir güvence değildir. Güvence
        tek kullanım, kısa ömür ve oturum kontrolüdür (ADR-0022). Bilet `GET /v1/realtime` handshake'inde
        `Sec-WebSocket-Protocol: koala.v1, koala.ticket.<bilet>` ile sunulur.
        Kullanıcı başına 5'lik burst, sonra 6 saniyede bir (ADR-0018 §2).
      x-authz-exempt: |
        Bilet çağıranın kendi oturumu için verilir; yetkilendirilecek bir nesne yoktur.
        Kimlik ve oturum kontrolü yeter (ADR-0018 §2, ADR-0021).
      x-no-idempotency-key: Bilet tek kullanımlık ve 60 saniyeliktir; tekrar eden istek yalnız yeni bir bilet üretir.
      responses:
        "201":
          description: "Bilet. Yanıt önbelleğe alınmaz (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/realtime:
    get:
      operationId: connectRealtime
      tags: [realtime]
      summary: WebSocket bağlantısını açar (alt protokol `koala.v1`).
      description: |
        RFC 6455 upgrade'i. Bilet `Sec-WebSocket-Protocol` listesinde ikinci girdidir:
        `koala.v1, koala.ticket.<bilet>`; sunucu yalnız `koala.v1`'i seçer. Bilet
        harcanmadan önce upgrade başlıkları, origin, cihaz ve drain kontrol edilir; her
        ret düz bir problem yanıtıdır, soket açılmaz (ADR-0018 §4). Tarayıcı
        (`Origin` var) platform, sürüm ve cihaz başlığı gönderemez; yerel istemci
        REST'teki başlık kuralına uyar (ADR-0021). Olay zarfı ve kapanış kodları
        ADR-0018 §5–6'dadır.
      security:
        - realtimeTicket: []
      x-authz-exempt: |
        Kimlik biletle gelir; bağlantı hiçbir nesneyi seçmez. Hangi olayın kime
        gideceğine sunucu authz üzerinden karar verir (ADR-0011 madde 3, ADR-0018 §7).
      responses:
        "101":
          description: Protokol değişti; bağlantı `koala.v1` ile açık.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: E-posta ve parolayla giriş yapar; cihaza bağlı bir oturum açar.
      description: |
        Parolayla giriş (OTP ve kayıt Faz 2'de). İstek `X-Device-Id` taşır; oturum o
        cihaza bağlanır ve aynı cihazın açık oturumları kapanır (AUTH-002). Kayıtsız
        adres, yanlış parola ve parolası olmayan hesap aynı
        `401 AUTH_EMAIL_OR_PASSWORD_MISMATCH` gövdesini alır ve aynı maliyeti öder
        (AUTH-001). Erişim token'ı 15 dakikalık, refresh token'ı opak ve tek
        kullanımlıktır (K12, ADR-0025). Oran sınırı: `auth` grubu, adres başına ve giriş
        hedefinin özeti başına (ADR-0021).
      security: []
      x-rate-limit: auth
      x-body-limit: 4096
      x-no-idempotency-key: Her başarılı giriş yeni bir oturum açar ve aynı cihazın öncekini kapatır; tekrar güvenlidir.
      requestBody:
        description: Giriş bilgileri.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Yeni oturumun token çifti. Yanıt önbelleğe alınmaz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      operationId: refreshUserSession
      tags: [auth]
      summary: Refresh token'ı döndürür ve yeni bir token çifti verir.
      description: |
        Sunulan refresh token tüketilir, yenisi verilir (rotasyon, K12). Oturum refresh
        token'ın kendisinden bulunur; süresi dolmuş erişim token'ı gerekmez (AUTH-003).
        Tüketilmiş bir token yeniden gelirse oturumun tamamı kapanır
        (`AUTH_REFRESH_TOKEN_REUSED`). İstek oturumun cihazından gelmezse oturum kapanır
        (`AUTH_SESSION_NOT_MATCHING_CURRENT_DEVICE`, AUTH-004). Refresh token 30 gün
        kullanılmazsa, oturum 90 günü doldurursa `AUTH_REFRESH_TOKEN_EXPIRED` (ADR-0025).
      security: []
      x-rate-limit: auth
      x-body-limit: 4096
      x-no-idempotency-key: Refresh token tek kullanımlıktır; aynı gövdenin tekrarı yeniden kullanım sayılır ve oturumu kapatır (K12).
      requestBody:
        description: Refresh token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Yeni token çifti; önceki refresh token artık geçersiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Çağıranın oturumunu kapatır.
      description: |
        Oturumu kapatır; erişim ve refresh token'ı hemen geçersizleşir, açık WebSocket
        bağlantıları kapanır.
      x-authz-exempt: |
        Çağıran yalnız kendi oturumunu kapatır; yetkilendirilecek başka bir nesne yoktur.
      x-no-idempotency-key: Kapalı oturumu yeniden kapatmak bir şey değiştirmez; ikinci istek kimlik doğrulamasında 401 alır.
      responses:
        "204":
          description: Oturum kapandı.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Çağıranın kimlik çekirdeğini döndürür.
      description: Kimlik çekirdeğinin iskeleti; profil alanları Faz 2'de gelir.
      x-authz-exempt: |
        Çağıran yalnız kendi kaydını okur; kimlik oturumdan gelir, seçilecek nesne yoktur.
      x-resource: users
      responses:
        "200":
          description: Çağıranın kaydı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [auth]
      summary: Çağıranın açık oturumlarını listeler.
      description: |
        Kapanmamış, süresi dolmamış ve cihazı silinmemiş oturumlar, yeniden eskiye.
        Cihaz başına bir oturum olduğundan liste tek sayfadır: cursor'lar her zaman
        `null` döner (en çok 100 oturum).
      x-authz-exempt: |
        Liste çağıranın kendi oturumlarıyla sınırlıdır; seçilecek başka bir nesne yoktur.
      x-resource: user_sessions
      responses:
        "200":
          description: Açık oturumlar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/me/sessions/revoke-others:
    post:
      operationId: revokeMyOtherSessions
      tags: [auth]
      summary: İsteği yapan dışındaki bütün oturumları kapatır.
      description: Çağıranın diğer bütün oturumları kapanır; isteği yapan oturum açık kalır (AUTH-016).
      x-authz-exempt: |
        Yalnız çağıranın kendi oturumlarına dokunur; seçilecek başka bir nesne yoktur.
      x-no-idempotency-key: Kapatma idempotenttir; tekrar eden istek kapalı oturumları yeniden kapatmaz.
      responses:
        "204":
          description: Diğer oturumlar kapandı.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/me/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: Oturum kimliği.
        schema:
          type: string
          format: uuid
    get:
      operationId: getMySession
      tags: [auth]
      summary: Çağıranın açık oturumlarından birini döndürür.
      description: |
        Başkasına ait, kapanmış ve hiç olmamış oturum aynı `404 AUTH_SESSION_NOT_FOUND`
        gövdesini alır (AUTH-016).
      x-authz-exempt: |
        Arama çağıranın kendi oturumlarıyla sınırlıdır; başkasınınki yok sayılır.
      x-resource: user_sessions
      responses:
        "200":
          description: Oturum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeMySession
      tags: [auth]
      summary: Çağıranın açık oturumlarından birini kapatır.
      description: |
        Başkasına ait, kapanmış ve hiç olmamış oturum aynı 404'ü alır ve hiçbir şey
        değişmez (AUTH-016). İsteği yapan oturum da kapatılabilir.
      x-authz-exempt: |
        Kapatma çağıranın kendi oturumlarıyla sınırlıdır; başkasınınki yok sayılır.
      responses:
        "204":
          description: Oturum kapandı.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/auth/login:
    post:
      operationId: loginStaff
      tags: [admin-auth]
      summary: Personel girişi.
      description: |
        Ayrı token sınıfı: personel token'ı pazaryerinde, pazaryeri token'ı burada
        geçmez (D5, ADR-0025). Hesap yok, parola yanlış, hesap devre dışı ve hesap
        kilitli aynı `401 STAFF_LOGIN_FAILED` gövdesini alır (AUTH-010, AUTH-011). Art
        arda 5 yanlış parola hesabı 15 dakika kilitler. TOTP Faz 8'de gelir (K13).
      security: []
      x-rate-limit: auth
      x-body-limit: 4096
      x-no-idempotency-key: Her başarılı giriş yeni bir personel oturumu açar; tekrar güvenlidir.
      requestBody:
        description: Giriş bilgileri.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Yeni personel oturumunun token çifti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/auth/refresh:
    post:
      operationId: refreshStaffSession
      tags: [admin-auth]
      summary: Personel refresh token'ını döndürür.
      description: |
        Pazaryerinin yenilemesiyle aynı rotasyon ve yeniden kullanım kuralı. Hesabın
        token sürümü değiştiyse (çıkış, parola değişimi) `STAFF_SESSION_ENDED`
        (AUTH-013). Boşta 30 dakika, oturum en çok 12 saat (ADR-0025).
      security: []
      x-rate-limit: auth
      x-body-limit: 4096
      x-no-idempotency-key: Refresh token tek kullanımlıktır; aynı gövdenin tekrarı yeniden kullanım sayılır ve oturumu kapatır (K12).
      requestBody:
        description: Refresh token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Yeni token çifti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/auth/logout:
    post:
      operationId: logoutStaff
      tags: [admin-auth]
      summary: Personelin bütün token'larını geçersiz kılar.
      description: |
        Hesabın token sürümü artar: bütün cihazlardaki erişim ve refresh token'ları
        ölür (AUTH-013).
      security:
        - adminBearer: []
      x-authz-exempt: |
        Personel yalnız kendi hesabının token'larını sonlandırır; izin gerektiren bir nesne yoktur.
      x-no-idempotency-key: Çıkış idempotenttir; ikinci istek kimlik doğrulamasında 401 alır.
      responses:
        "204":
          description: Bütün token'lar geçersiz.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/auth/password:
    post:
      operationId: changeStaffPassword
      tags: [admin-auth]
      summary: Personel parolasını değiştirir.
      description: |
        Mevcut parolayı ister (`403 STAFF_CURRENT_PASSWORD_MISMATCH`). Yeni parola en az
        15, en çok 128 karakterdir (`400 PASSWORD_POLICY_VIOLATION`, AUTH-009).
        Değişimden sonra isteği yapan dahil bütün token'lar ölür; personel yeniden giriş
        yapar (AUTH-013). "Parola değişmeli" işaretli hesabın erişebildiği tek uç budur
        (ve çıkış; AUTH-014).
      security:
        - adminBearer: []
      x-authz-exempt: |
        Personel yalnız kendi parolasını değiştirir; izin gerektiren bir nesne yoktur.
      x-rate-limit: auth
      x-body-limit: 4096
      x-no-idempotency-key: Değişim bütün token'ları öldürür; tekrar eden istek kimlik doğrulamasında 401 alır.
      requestBody:
        description: Mevcut ve yeni parola.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPasswordChange"
      responses:
        "204":
          description: Parola değişti; yeniden giriş gerekir.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/me:
    get:
      operationId: getStaffMe
      tags: [admin-auth]
      summary: Personelin kendi hesabını döndürür.
      description: |
        "Parola değişmeli" işaretli hesap bu uca da erişemez:
        `403 STAFF_PASSWORD_CHANGE_REQUIRED` (AUTH-014).
      security:
        - adminBearer: []
      x-authz-exempt: |
        Personel yalnız kendi hesabını okur; izin gerektiren bir nesne yoktur.
      x-resource: staff_members
      responses:
        "200":
          description: Personelin hesabı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/me/capabilities:
    get:
      operationId: getStaffCapabilities
      tags: [admin-auth]
      summary: Personelin tuttuğu izinleri ve arayüz yeteneklerini döndürür.
      description: |
        İzinler her istekte rol DAG'ından tek bir özyinelemeli sorguyla çözülür; rol iptali
        bir sonraki istekte görünür (AUTH-012, plan §5.5, ADR-0026).
      security:
        - adminBearer: []
      x-authz-exempt: |
        Personel yalnız kendi izinlerini okur; izin gerektiren bir nesne yoktur.
      responses:
        "200":
          description: Personelin izinleri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

  /v1/admin/permissions:
    get:
      operationId: listStaffPermissions
      tags: [admin-auth]
      summary: Personel izin kataloğunu döndürür.
      description: |
        25 izin, her birinin durum değiştirip değiştirmediği ve hassasiyeti (Java
        `GET /admin/permissions`, PI-077). İzni olmayan personel `403 STAFF_PERMISSION_DENIED`
        alır ve ret denetim kaydına yazılır (ADR-0026).
      security:
        - adminBearer: []
      x-authz-permission: role.manage
      responses:
        "200":
          description: İzin kataloğu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPermissionCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    marketplaceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Marketplace kullanıcısının 15 dakikalık erişim token'ı (K12). `/v1/admin`
        dışındaki korunan operasyonlarda geçerlidir.
    realtimeTicket:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: |
        `POST /v1/realtime/tickets`'ten alınan tek kullanımlık bilet, alt protokol
        listesinde `koala.ticket.<bilet>` girdisi olarak (ADR-0018 §1). Yalnız
        `GET /v1/realtime`'da geçerlidir.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Personelin erişim token'ı (MFA'lı oturum, K13). Yalnız `/v1/admin`
        altındaki operasyonlarda geçerlidir; marketplace token'ı burada reddedilir.

  schemas:
    RealtimeTicket:
      type: object
      description: |
        WebSocket bileti (ADR-0018 §2). Değer opaktır; istemci yorumlamaz. `expiresAt`
        biletin son kullanılabileceği andır (verilişten 60 saniye sonra).
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          description: 32 rastgele baytın base64url kodlaması (43 karakter).
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
      examples:
        - ticket: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          expiresAt: "2026-11-05T09:01:00Z"

    LoginRequest:
      type: object
      description: |
        Parolayla giriş. Adres büyük-küçük harfe ve baştaki/sondaki boşluğa duyarsızdır.
        Parola kurala bakılmadan olduğu gibi denenir (AUTH-009); üst sınır yalnız
        gövdeyi korur.
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Giriş adresi.
          examples: [ayse@example.com]
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola.
          examples: [uzun bir parola cümlesi]
      examples:
        - email: ayse@example.com
          password: uzun bir parola cümlesi

    RefreshRequest:
      type: object
      description: Döndürülecek refresh token.
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
          description: Son verilen refresh token (opak, 43 karakter).
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
      examples:
        - refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk

    TokenPair:
      type: object
      description: |
        Bir oturumun token çifti (K12, ADR-0025). Erişim token'ı `Authorization: Bearer`
        ile gönderilir ve 15 dakika geçerlidir. Refresh token opaktır, tek
        kullanımlıktır; bir sonraki yenilemede yalnız son verilen geçerlidir.
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId]
      properties:
        accessToken:
          type: string
          description: "EdDSA imzalı JWT (`typ` başlığı `at+jwt`)."
          examples: [eyJhbGciOiJFZERTQSJ9.e30.c2ln]
        accessTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Erişim token'ının son geçerli anı.
        refreshToken:
          type: string
          description: Opak refresh token.
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        refreshTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Refresh token kullanılmazsa geçersizleşeceği an.
        sessionId:
          type: string
          format: uuid
          description: Oturumun kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
      examples:
        - accessToken: eyJhbGciOiJFZERTQSJ9.e30.c2ln
          accessTokenExpiresAt: "2026-11-05T09:15:00Z"
          refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          refreshTokenExpiresAt: "2026-12-05T09:00:00Z"
          sessionId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10

    StaffTokenPair:
      type: object
      description: |
        Personel oturumunun token çifti. `mustChangePassword` doğruysa parola
        değiştirilene kadar yalnız parola değişimi ve çıkış açıktır (AUTH-014).
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId, mustChangePassword]
      properties:
        accessToken:
          type: string
          description: "EdDSA imzalı personel JWT'si (`aud` değeri `koala-staff`)."
          examples: [eyJhbGciOiJFZERTQSJ9.e30.c2ln]
        accessTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Erişim token'ının son geçerli anı.
        refreshToken:
          type: string
          description: Opak refresh token.
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        refreshTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Refresh token kullanılmazsa geçersizleşeceği an (boşta 30 dakika).
        sessionId:
          type: string
          format: uuid
          description: Personel oturumunun kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        mustChangePassword:
          type: boolean
          description: Hesap önce parolasını değiştirmeli.
      examples:
        - accessToken: eyJhbGciOiJFZERTQSJ9.e30.c2ln
          accessTokenExpiresAt: "2026-11-05T09:15:00Z"
          refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          refreshTokenExpiresAt: "2026-11-05T09:30:00Z"
          sessionId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          mustChangePassword: false

    StaffPasswordChange:
      type: object
      description: Personel parola değişimi. Yeni parolanın kuralını sunucu uygular (AUTH-009).
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mevcut parola.
          examples: [eski parola cümlesi]
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; en az 15, en çok 128 karakter.
          examples: [yeni ve uzun bir parola]
      examples:
        - currentPassword: eski parola cümlesi
          newPassword: yeni ve uzun bir parola

    SessionPlatform:
      type: string
      description: Oturumun cihazının platformu; giriş isteği bildirmediyse `UNKNOWN`.
      enum: [IOS, ANDROID, WEB, UNKNOWN]

    Session:
      type: object
      description: Çağıranın açık oturumlarından biri.
      required: [id, platform, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
          description: Oturum kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        platform:
          $ref: "#/components/schemas/SessionPlatform"
          description: Cihazın platformu.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Girişin anı.
        lastSeenAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Son etkinlik (5 dakika hassasiyetle).
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Oturumun mutlak sonu (girişten 90 gün sonra).
        current:
          type: boolean
          description: İsteği yapan oturum mu.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          platform: IOS
          createdAt: "2026-11-05T09:00:00Z"
          lastSeenAt: "2026-11-05T09:10:00Z"
          expiresAt: "2027-02-03T09:00:00Z"
          current: true

    SessionPage:
      description: Açık oturumlar; tek sayfa.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Oturumlar, yeniden eskiye.
              items:
                $ref: "#/components/schemas/Session"

    Me:
      type: object
      description: Çağıranın kimlik çekirdeği. Profil alanları Faz 2'de eklenir.
      required: [id, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        email:
          type: string
          description: Giriş adresi.
          examples: [ayse@example.com]
        status:
          type: string
          description: Hesabın durumu.
          enum: [ACTIVE, SUSPENDED]
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Hesabın açıldığı an.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          email: ayse@example.com
          status: ACTIVE
          createdAt: "2026-11-05T09:00:00Z"

    StaffMe:
      type: object
      description: |
        Personelin kendi hesabı, doğrudan atanmış rolleri ve rol DAG'ından her istekte
        çözülen izinleri (ADR-0026). İzinler token'da taşınmaz (AUTH-012).
      required: [id, email, mustChangePassword, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: Personel kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        email:
          type: string
          description: Giriş adresi.
          examples: [destek@iskoala.com]
        mustChangePassword:
          type: boolean
          description: Hesap önce parolasını değiştirmeli.
        roles:
          type: array
          description: Personele doğrudan atanmış roller, koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffRole"
        permissions:
          type: array
          description: Personelin tuttuğu izinler (doğrudan ya da rol kapsamasıyla), koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffPermissionCode"
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          email: destek@iskoala.com
          mustChangePassword: false
          roles:
            - id: 9a1c0f10-0003-4c00-8000-000000000002
              code: SUPPORT_AGENT
              name: Destek görevlisi
          permissions: [job.read, note.read, note.write, user.read]

    StaffRole:
      type: object
      description: Bir personel rolü.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
          description: Rol kimliği; denetim kaydının dayanağında `staff_role:<id>` olarak geçer.
          examples: [9a1c0f10-0003-4c00-8000-000000000009]
        code:
          type: string
          description: Rol kodu.
          examples: [FINANCE_OFFICER]
        name:
          type: string
          description: Rolün görünen adı.
          examples: [Finans yetkilisi]

    StaffPermissionCode:
      type: string
      description: Personel izni kodu; `x-authz-permission`'ın değeri (ADR-0026).
      pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)+$"
      examples: [payout.release]

    StaffCapabilities:
      type: object
      description: |
        Personel arayüzünün neyi açacağı (plan §5.5). Her değer aynı yetki kararından
        (`Check`) hesaplanır; istemci token ayrıştırmaz. Uç okunamazsa arayüz kapalı başlar.
      required: [permissions, can]
      properties:
        permissions:
          type: array
          description: Personelin tuttuğu izinler, koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffPermissionCode"
        can:
          type: object
          description: Bilinen her izin kodu için personelin onu tutup tutmadığı.
          additionalProperties:
            type: boolean
      examples:
        - permissions: [audit.read]
          can:
            audit.read: true
            payout.release: false

    StaffPermission:
      type: object
      description: İzin kataloğunun bir satırı.
      required: [code, mutating, sensitivity]
      properties:
        code:
          $ref: "#/components/schemas/StaffPermissionCode"
        mutating:
          type: boolean
          description: İzin durum değiştiren işlemlere verilir.
        sensitivity:
          type: string
          description: |
            İznin açtığı verinin sınıfı; `FINANCIAL` denetim satırları 10 yıl, diğerleri 24 ay
            saklanır (ADR-0026).
          enum: [NORMAL, PERSONAL_DATA, FINANCIAL]

    StaffPermissionCatalog:
      type: object
      description: Personel izinlerinin tamamı (25), koda göre sıralı.
      required: [permissions]
      properties:
        permissions:
          type: array
          description: İzinler.
          items:
            $ref: "#/components/schemas/StaffPermission"

  # Ortak hata yanıtları. Her biri Problem gövdesi döner; kodlar
  # ErrorCode'dadır.
  responses:
    BadRequest:
      description: |
        İstek sözleşmeye uymuyor (`REQUEST_INVALID`, `REQUEST_BODY_MALFORMED`,
        `PATH_INVALID`, …) ya da istemci sürümü desteklenmiyor
        (`APP_VERSION_UNSUPPORTED`; o zaman `X-Minimum-App-Version` döner).
      headers:
        X-Minimum-App-Version:
          $ref: "./components/headers.yaml#/components/headers/XMinimumAppVersion"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Unauthorized:
      description: Kimlik doğrulanamadı.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Forbidden:
      description: Kimlik doğrulandı ama eylem yasak. Okuma reddi 403 değil, kaynağın 404'üdür (ADR-0014).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    NotFound:
      description: Kaynak yok ya da görme yetkiniz yok; ikisi ayırt edilemez.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Conflict:
      description: Kaynağın durumu isteğe izin vermiyor ya da aynı Idempotency-Key'li istek sürüyor.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    PayloadTooLarge:
      description: Gövde route'un sınırını aşıyor (`REQUEST_BODY_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    UnprocessableContent:
      description: Aynı Idempotency-Key farklı gövdeyle kullanıldı (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Gövdenin `Content-Type`'ı desteklenmiyor (`CONTENT_TYPE_UNSUPPORTED`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    TooManyRequests:
      description: Oran sınırı aşıldı (`RATE_LIMITED` ya da uca özgü bir kod); `Retry-After` döner.
      headers:
        Retry-After:
          $ref: "./components/headers.yaml#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    ServiceUnavailable:
      description: Örnek şu an isteği alamıyor (kapanış drain'i); `Retry-After` kadar sonra yeniden denenir.
      headers:
        Retry-After:
          $ref: "./components/headers.yaml#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    InternalError:
      description: Beklenmeyen hata (`INTERNAL`) ya da üst sistem hatası.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
