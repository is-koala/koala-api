components:
  securitySchemes:
    marketplaceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Marketplace kullanıcısının 15 dakikalık erişim token'ı (K12). `/v1/admin`
        dışındaki korunan operasyonlarda geçerlidir.
    realtimeTicket:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: |
        `POST /v1/realtime/tickets`'ten alınan tek kullanımlık bilet, alt protokol
        listesinde `koala.ticket.<bilet>` girdisi olarak (ADR-0018 §1). Yalnız
        `GET /v1/realtime`'da geçerlidir.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Personelin erişim token'ı (MFA'lı oturum, K13). Yalnız `/v1/admin`
        altındaki operasyonlarda geçerlidir; marketplace token'ı burada reddedilir.

  schemas:
    RealtimeTicket:
      type: object
      description: |
        WebSocket bileti (ADR-0018 §2). Değer opaktır; istemci yorumlamaz. `expiresAt`
        biletin son kullanılabileceği andır (verilişten 60 saniye sonra).
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          description: 32 rastgele baytın base64url kodlaması (43 karakter).
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
      examples:
        - ticket: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          expiresAt: "2026-11-05T09:01:00Z"

    LoginRequest:
      type: object
      description: |
        Parolayla giriş. Adres büyük-küçük harfe ve baştaki/sondaki boşluğa duyarsızdır.
        Parola kurala bakılmadan olduğu gibi denenir (AUTH-009); üst sınır yalnız
        gövdeyi korur.
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Giriş adresi.
          examples: [ayse@example.com]
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Parola.
          examples: [uzun bir parola cümlesi]
      examples:
        - email: ayse@example.com
          password: uzun bir parola cümlesi

    RefreshRequest:
      type: object
      description: Döndürülecek refresh token.
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
          description: Son verilen refresh token (opak, 43 karakter).
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
      examples:
        - refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk

    TokenPair:
      type: object
      description: |
        Bir oturumun token çifti (K12, ADR-0025). Erişim token'ı `Authorization: Bearer`
        ile gönderilir ve 15 dakika geçerlidir. Refresh token opaktır, tek
        kullanımlıktır; bir sonraki yenilemede yalnız son verilen geçerlidir.
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId]
      properties:
        accessToken:
          type: string
          description: "EdDSA imzalı JWT (`typ` başlığı `at+jwt`)."
          examples: [eyJhbGciOiJFZERTQSJ9.e30.c2ln]
        accessTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Erişim token'ının son geçerli anı.
        refreshToken:
          type: string
          description: Opak refresh token.
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        refreshTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Refresh token kullanılmazsa geçersizleşeceği an.
        sessionId:
          type: string
          format: uuid
          description: Oturumun kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
      examples:
        - accessToken: eyJhbGciOiJFZERTQSJ9.e30.c2ln
          accessTokenExpiresAt: "2026-11-05T09:15:00Z"
          refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          refreshTokenExpiresAt: "2026-12-05T09:00:00Z"
          sessionId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10

    StaffTokenPair:
      type: object
      description: |
        Personel oturumunun token çifti. `mustChangePassword` doğruysa parola
        değiştirilene kadar yalnız parola değişimi ve çıkış açıktır (AUTH-014).
      required:
        [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, sessionId,
        mustChangePassword]
      properties:
        accessToken:
          type: string
          description: "EdDSA imzalı personel JWT'si (`aud` değeri `koala-staff`)."
          examples: [eyJhbGciOiJFZERTQSJ9.e30.c2ln]
        accessTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Erişim token'ının son geçerli anı.
        refreshToken:
          type: string
          description: Opak refresh token.
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        refreshTokenExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Refresh token kullanılmazsa geçersizleşeceği an (boşta 30 dakika).
        sessionId:
          type: string
          format: uuid
          description: Personel oturumunun kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        mustChangePassword:
          type: boolean
          description: Hesap önce parolasını değiştirmeli.
      examples:
        - accessToken: eyJhbGciOiJFZERTQSJ9.e30.c2ln
          accessTokenExpiresAt: "2026-11-05T09:15:00Z"
          refreshToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk
          refreshTokenExpiresAt: "2026-11-05T09:30:00Z"
          sessionId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          mustChangePassword: false

    StaffPasswordChange:
      type: object
      description: Personel parola değişimi. Yeni parolanın kuralını sunucu uygular (AUTH-009).
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mevcut parola.
          examples: [eski parola cümlesi]
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; en az 15, en çok 128 karakter.
          examples: [yeni ve uzun bir parola]
      examples:
        - currentPassword: eski parola cümlesi
          newPassword: yeni ve uzun bir parola

    SessionPlatform:
      type: string
      description: Oturumun cihazının platformu; giriş isteği bildirmediyse `UNKNOWN`.
      enum: [IOS, ANDROID, WEB, UNKNOWN]

    Session:
      type: object
      description: Çağıranın açık oturumlarından biri.
      required: [id, platform, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
          description: Oturum kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        platform:
          $ref: "#/components/schemas/SessionPlatform"
          description: Cihazın platformu.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Girişin anı.
        lastSeenAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Son etkinlik (5 dakika hassasiyetle).
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Oturumun mutlak sonu (girişten 90 gün sonra).
        current:
          type: boolean
          description: İsteği yapan oturum mu.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          platform: IOS
          createdAt: "2026-11-05T09:00:00Z"
          lastSeenAt: "2026-11-05T09:10:00Z"
          expiresAt: "2027-02-03T09:00:00Z"
          current: true

    SessionPage:
      description: Açık oturumlar; tek sayfa.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Oturumlar, yeniden eskiye.
              items:
                $ref: "#/components/schemas/Session"

    Me:
      type: object
      description: Çağıranın kimlik çekirdeği. Profil alanları Faz 2'de eklenir.
      required: [id, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        email:
          type: string
          description: Giriş adresi.
          examples: [ayse@example.com]
        status:
          type: string
          description: Hesabın durumu.
          enum: [ACTIVE, SUSPENDED]
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Hesabın açıldığı an.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          email: ayse@example.com
          status: ACTIVE
          createdAt: "2026-11-05T09:00:00Z"

    StaffMe:
      type: object
      description: |
        Personelin kendi hesabı, doğrudan atanmış rolleri ve rol DAG'ından her istekte
        çözülen izinleri (ADR-0026). İzinler token'da taşınmaz (AUTH-012).
      required: [id, email, mustChangePassword, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: Personel kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        email:
          type: string
          description: Giriş adresi.
          examples: [destek@iskoala.com]
        mustChangePassword:
          type: boolean
          description: Hesap önce parolasını değiştirmeli.
        roles:
          type: array
          description: Personele doğrudan atanmış roller, koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffRole"
        permissions:
          type: array
          description: Personelin tuttuğu izinler (doğrudan ya da rol kapsamasıyla), koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffPermissionCode"
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          email: destek@iskoala.com
          mustChangePassword: false
          roles:
            - id: 9a1c0f10-0003-4c00-8000-000000000002
              code: SUPPORT_AGENT
              name: Destek görevlisi
          permissions: [job.read, note.read, note.write, user.read]

    StaffRole:
      type: object
      description: Bir personel rolü.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
          description: Rol kimliği; denetim kaydının dayanağında `staff_role:<id>` olarak geçer.
          examples: [9a1c0f10-0003-4c00-8000-000000000009]
        code:
          type: string
          description: Rol kodu.
          examples: [FINANCE_OFFICER]
        name:
          type: string
          description: Rolün görünen adı.
          examples: [Finans yetkilisi]

    StaffPermissionCode:
      type: string
      description: Personel izni kodu; `x-authz-permission`'ın değeri (ADR-0026).
      pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)+$"
      examples: [payout.release]

    StaffCapabilities:
      type: object
      description: |
        Personel arayüzünün neyi açacağı (plan §5.5). Her değer aynı yetki kararından
        (`Check`) hesaplanır; istemci token ayrıştırmaz. Uç okunamazsa arayüz kapalı başlar.
      required: [permissions, can]
      properties:
        permissions:
          type: array
          description: Personelin tuttuğu izinler, koda göre sıralı.
          items:
            $ref: "#/components/schemas/StaffPermissionCode"
        can:
          type: object
          description: Bilinen her izin kodu için personelin onu tutup tutmadığı.
          additionalProperties:
            type: boolean
      examples:
        - permissions: [audit.read]
          can:
            audit.read: true
            payout.release: false

    StaffPermission:
      type: object
      description: İzin kataloğunun bir satırı.
      required: [code, mutating, sensitivity]
      properties:
        code:
          $ref: "#/components/schemas/StaffPermissionCode"
        mutating:
          type: boolean
          description: İzin durum değiştiren işlemlere verilir.
        sensitivity:
          type: string
          description: |
            İznin açtığı verinin sınıfı; `FINANCIAL` denetim satırları 10 yıl, diğerleri 24 ay
            saklanır (ADR-0026).
          enum: [NORMAL, PERSONAL_DATA, FINANCIAL]

    StaffPermissionCatalog:
      type: object
      description: Personel izinlerinin tamamı (25), koda göre sıralı.
      required: [permissions]
      properties:
        permissions:
          type: array
          description: İzinler.
          items:
            $ref: "#/components/schemas/StaffPermission"

    # --- Faz 2: kayıt, parola, doğrulama (ADR-0029 Karar 2-4)

    StartRegistrationRequest:
      type: object
      description: |
        Kaydın birinci adımı. Adres büyük-küçük harfe ve baştaki/sondaki boşluğa
        duyarsızdır. Parola bu adımda gönderilmez.
      additionalProperties: false
      required: [firstName, lastName, email, employer]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Ad.
          examples: [Ayşe]
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Soyad.
          examples: [Yılmaz]
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Kayıt ve giriş adresi.
          examples: [ayse@example.com]
        employer:
          type: boolean
          description: Hesap işveren hesabı mı; kayıttan sonra değişmez.
      examples:
        - firstName: Ayşe
          lastName: Yılmaz
          email: ayse@example.com
          employer: false

    VerifyRegistrationRequest:
      type: object
      description: E-postadaki bağlantının token'ı; tüketilmez.
      additionalProperties: false
      required: [verificationToken]
      properties:
        verificationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 rastgele baytın base64url kodlaması.
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
      examples:
        - verificationToken: q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk

    RegistrationToken:
      type: object
      description: |
        Parolanın gönderileceği adım için kısa ömürlü, opak ve tek kullanımlık token
        (ADR-0029 Karar 2). Bekleyen kayda bağlıdır.
      required: [registrationToken, expiresAt, employer]
      properties:
        registrationToken:
          type: string
          description: Opak kayıt token'ı.
          examples: [bG9uZ29wYXF1ZXJlZ2lzdHJhdGlvbnRva2VudmFsdWUx]
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Token'ın son geçerli anı (verilişten 15 dakika sonra).
        employer:
          type: boolean
          description: Bekleyen kaydın işveren bayrağı; istemci son adımın formunu buna göre kurar.
      examples:
        - registrationToken: bG9uZ29wYXF1ZXJlZ2lzdHJhdGlvbnRva2VudmFsdWUx
          expiresAt: "2026-11-08T09:15:00Z"
          employer: false

    ConsentDecision:
      type: object
      description: Bir sözleşme sürümü için verilen rıza kararı.
      additionalProperties: false
      required: [documentCode, version, granted]
      properties:
        documentCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Sözleşme belgesinin kodu.
          examples: [TERMS_OF_SERVICE]
        version:
          type: string
          minLength: 1
          maxLength: 32
          description: Belgenin sürümü.
          examples: ["2026-08-01"]
        granted:
          type: boolean
          description: Rıza verildi mi; zorunlu bir belge için `false` kaydı tamamlamaz.

    CompleteRegistrationRequest:
      type: object
      description: |
        Kaydın üçüncü adımı. Zorunlu rızalar token okunmadan önce denetlenir (USR-005).
        Parola en az 15, en çok 128 karakterdir; üst sınır yalnız gövdeyi korur.
      additionalProperties: false
      required: [registrationToken, password, consents]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 128
          description: İkinci adımda verilen kayıt token'ı.
          examples: [bG9uZ29wYXF1ZXJlZ2lzdHJhdGlvbnRva2VudmFsdWUx]
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: Belirlenen parola.
          examples: [uzun ve guclu bir parola]
        consents:
          type: array
          minItems: 1
          maxItems: 20
          description: Rıza kararları; zorunlu belgelerin hepsi bulunmak zorundadır.
          items:
            $ref: "#/components/schemas/ConsentDecision"

    PasswordResetRequest:
      type: object
      description: Parola sıfırlama istenen adres. Adresin kayıtlı olup olmadığı yanıttan anlaşılmaz.
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Hesabın adresi.
          examples: [ayse@example.com]
      examples:
        - email: ayse@example.com

    CompletePasswordResetRequest:
      type: object
      description: |
        Sıfırlama token'ı ve yeni parola. Token tek kullanımlıktır ve parola yazımıyla aynı
        transaction'da tüketilir (USR-015).
      additionalProperties: false
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          minLength: 1
          maxLength: 128
          description: E-postadaki sıfırlama token'ı (opak, 43 karakter).
          examples: [q1u4gD2w9mKcY3x0Vv7nB5tL8pR6sE1aZ4hJ2fQ9wXk]
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; en az 15, en çok 128 karakter.
          examples: [yeni ve uzun bir parola]

    PasswordChange:
      type: object
      description: |
        Uygulama içi parola değişimi. Yeni parola mevcut parolayla aynı olamaz ve onayıyla
        eşleşmek zorundadır (USR-020).
      additionalProperties: false
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Mevcut parola.
          examples: [eski parola cümlesi]
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parola; en az 15, en çok 128 karakter.
          examples: [yeni ve uzun bir parola]
        newPasswordConfirmation:
          type: string
          minLength: 1
          maxLength: 1024
          description: Yeni parolanın onayı; `newPassword` ile aynı olmak zorundadır.
          examples: [yeni ve uzun bir parola]

    VerificationChannel:
      type: string
      description: Doğrulamanın kanalı.
      enum: [EMAIL, PHONE]

    VerificationStatus:
      type: string
      description: |
        Doğrulamanın durumu. `BURNED` deneme sınırı dolduğu için yakılmış doğrulamadır:
        doğru kodla bile onaylanamaz (USR-009).
      enum: [PENDING, CONFIRMED, EXPIRED, BURNED, CANCELLED]

    StartVerificationRequest:
      type: object
      description: |
        Doğrulanacak kanal ve hedef. Kanal ve hedef başına tek açık doğrulama vardır: yeni
        istek öncekini iptal eder (USR-010).
      additionalProperties: false
      required: [channel, target]
      properties:
        channel:
          $ref: "#/components/schemas/VerificationChannel"
        target:
          type: string
          minLength: 3
          maxLength: 254
          description: Doğrulanacak yeni e-posta adresi ya da telefon numarası.
          examples: [ayse.yeni@example.com]

    ConfirmVerificationRequest:
      type: object
      description: Doğrulama kodu; altı ondalık basamak.
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          description: E-posta ya da SMS ile gelen kod.
          examples: ["042913"]
      examples:
        - code: "042913"

    Verification:
      type: object
      description: |
        Bir e-posta ya da telefon doğrulaması. Kod hiçbir yanıtta dönmez; hedef maskeli
        görünür (USR-008).
      required:
        [id, channel, status, maskedTarget, remainingAttempts, createdAt, expiresAt, confirmedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Doğrulamanın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        channel:
          $ref: "#/components/schemas/VerificationChannel"
          description: Kanal.
        status:
          $ref: "#/components/schemas/VerificationStatus"
          description: Durum.
        maskedTarget:
          type: string
          description: Doğrulanan hedefin maskeli hâli; tam değer dönmez.
          examples: ["a***@example.com"]
        remainingAttempts:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: Kalan yanlış deneme hakkı; sıfırlanınca doğrulama yakılır.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Doğrulamanın başlatıldığı an.
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Kodun son geçerli anı (başlangıçtan 10 dakika sonra).
        confirmedAt:
          $ref: "./components/datetime.yaml#/components/schemas/NullableTimestamp"
          description: Onaylandığı an; onaylanmadıysa `null`.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          channel: EMAIL
          status: PENDING
          maskedTarget: "a***@example.com"
          remainingAttempts: 5
          createdAt: "2026-11-08T09:00:00Z"
          expiresAt: "2026-11-08T09:10:00Z"
          confirmedAt: null

    VerificationPage:
      description: Çağıranın açık doğrulamaları.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Doğrulamalar, yeniden eskiye.
              items:
                $ref: "#/components/schemas/Verification"

    # --- Faz 2: profil (ADR-0029 Karar 2, Karar 5)

    Gender:
      type: string
      description: Cinsiyet.
      enum: [MALE, FEMALE, NOT_SPECIFIED]

    CompanyMembership:
      type: object
      description: Çağıranın bir şirketteki üyeliği.
      required: [companyId, companyName, role, approved]
      properties:
        companyId:
          type: string
          format: uuid
          description: Şirketin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a20]
        companyName:
          type: string
          description: Şirketin adı.
          examples: [Koala Lojistik]
        role:
          $ref: "#/components/schemas/CompanyContactRole"
          description: Üyeliğin rolü.
        approved:
          type: boolean
          description: Şirket onaylanmış mı.

    UserProfile:
      type: object
      description: |
        Çağıranın profili. Kimlik numarası tümden maskelenir; IBAN ve telefon kısmen
        maskelenir. Parola özeti ve kimlik belgesi numarası hiç dönmez (USR-027).
      required:
        [id, firstName, lastName, email, phoneNumber, birthDate, gender, jobTitle, about,
        qualifications, interests, employer, emailVerified, phoneVerified, identityVerified,
        maskedIdentityNumber, maskedIban, profilePictureId, cvId, addressId, companies,
        createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        firstName:
          type: string
          description: Ad; kimlik doğrulanmışsa değişmez.
          examples: [Ayşe]
        lastName:
          type: string
          description: Soyad; kimlik doğrulanmışsa değişmez.
          examples: [Yılmaz]
        email:
          type: string
          description: Giriş adresi.
          examples: [ayse@example.com]
        phoneNumber:
          type: [string, "null"]
          description: Telefon numarası; doğrulanmadıysa `null`.
          examples: ["+905551112233"]
        birthDate:
          type: [string, "null"]
          format: date
          description: Doğum tarihi; kimlik doğrulanmışsa değişmez.
          examples: ["1996-04-17"]
        gender:
          oneOf:
            - $ref: "#/components/schemas/Gender"
            - type: "null"
          description: Cinsiyet; belirtilmediyse `null`.
        jobTitle:
          type: [string, "null"]
          description: Görünen unvan.
          examples: [Depo görevlisi]
        about:
          type: [string, "null"]
          description: Tanıtım metni.
          examples: [Beş yıllık depo deneyimi.]
        qualifications:
          type: [string, "null"]
          description: Nitelikler.
          examples: [Forklift ehliyeti]
        interests:
          type: [string, "null"]
          description: İlgi alanları.
          examples: ["Lojistik, depo yönetimi"]
        employer:
          type: boolean
          description: Hesap işveren hesabı mı; kayıttan sonra değişmez.
        emailVerified:
          type: boolean
          description: Adres doğrulanmış mı.
        phoneVerified:
          type: boolean
          description: Telefon doğrulanmış mı.
        identityVerified:
          type: boolean
          description: Kimlik doğrulanmış mı; doğrulandıysa ad, soyad ve doğum tarihi donar.
        maskedIdentityNumber:
          type: [string, "null"]
          description: |
            Kimlik numarasının maskesi; hiçbir hanesi görünmez. Kimlik doğrulanmadıysa `null`.
          examples: ["***********"]
        maskedIban:
          type: [string, "null"]
          description: Birincil IBAN'ın maskesi; ilk ve son dört hane görünür.
          examples: ["TR12***8899"]
        profilePictureId:
          type: [string, "null"]
          format: uuid
          description: Profil fotoğrafının medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        cvId:
          type: [string, "null"]
          format: uuid
          description: |
            Özgeçmişin medya kimliği. Bağlantısı herkese açık profilde yalnız sahibine ve
            başvuru almış işverene görünür (USR-026).
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a50]
        addressId:
          type: [string, "null"]
          format: uuid
          description: Birincil adresin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a40]
        companies:
          type: array
          description: Çağıranın şirket üyelikleri, şirket adına göre sıralı.
          items:
            $ref: "#/components/schemas/CompanyMembership"
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Hesabın açıldığı an.

    UserProfilePatch:
