    UserProfileUpdate:
      type: object
      description: |
        Yamadan sonraki profil ve yama sırasında başlatılan doğrulamalar. Yeni e-posta ya
        da telefon onaylanana kadar profile yazılmaz (USR-014).
      required: [profile, pendingVerifications]
      properties:
        profile:
          $ref: "#/components/schemas/UserProfile"
          description: Güncel profil.
        pendingVerifications:
          type: array
          description: Bu yamanın başlattığı doğrulamalar; boş olabilir.
          items:
            $ref: "#/components/schemas/Verification"

    PublicProfile:
      type: object
      description: |
        Bir kullanıcının herkese açık profili. Kişisel veri dönmez; adres şehir ve ilçe
        adına iner (USR-025). Özgeçmiş bağlantısı yalnız sahibine ve ondan başvuru almış
        işverene görünür (USR-026).
      required:
        [id, firstName, lastName, jobTitle, about, cityName, districtName, profilePictureUrl, cvUrl,
        completedJobCount]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        firstName:
          type: string
          description: Ad.
          examples: [Ayşe]
        lastName:
          type: string
          description: Soyad.
          examples: [Yılmaz]
        jobTitle:
          type: [string, "null"]
          description: Görünen unvan.
          examples: [Depo görevlisi]
        about:
          type: [string, "null"]
          description: Tanıtım metni.
          examples: [Beş yıllık depo deneyimi.]
        cityName:
          type: [string, "null"]
          description: Adresin şehri; sokak düzeyi adres hiç üretilmez.
          examples: [İstanbul]
        districtName:
          type: [string, "null"]
          description: Adresin ilçesi.
          examples: [Kadıköy]
        profilePictureUrl:
          type: [string, "null"]
          description: Profil fotoğrafının genel adresi.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]
        cvUrl:
          type: [string, "null"]
          description: |
            Özgeçmişin adresi; yalnız kullanıcının kendisine ve ondan başvuru almış bir
            işverene dolar, diğer herkes için `null`'dır.
          examples: ["https://api.iskoala.com/uploads/files/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a50.pdf"]
        completedJobCount:
          type: integer
          format: int32
          minimum: 0
          description: Tamamlanan iş sayısı.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10
          firstName: Ayşe
          lastName: Yılmaz
          jobTitle: Depo görevlisi
          about: Beş yıllık depo deneyimi.
          cityName: İstanbul
          districtName: Kadıköy
          profilePictureUrl: null
          cvUrl: null
          completedJobCount: 12

    # --- Faz 2: kimlik incelemesi (ADR-0029 Karar 5)

    IdentityReviewStatus:
      type: string
      description: |
        İncelemenin durumu. `APPROVED` ve `REJECTED` terminaldir; karar verilmiş incelemeye
        ikinci karar çakışmadır (IDN-010).
      enum: [PENDING, APPROVED, REJECTED]

    SubmitIdentityDocumentsRequest:
      type: object
      description: |
        Beyan edilen kimlik bilgileri ve dört fotoğrafın medya kimlikleri. Fotoğraflar önce
        `POST /v1/me/media` ile yüklenir ve hazır durumda olmak zorundadır. Kimlik
        numarasında sağlama doğrulaması yapılmaz, yalnız biçim denetlenir (IDN-012).
      additionalProperties: false
      required:
        [firstName, lastName, birthDate, identityNumber, documentNumber, selfieMediaId,
        frontMediaId, backMediaId, togetherMediaId]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Belgedeki ad.
          examples: [Ayşe]
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Belgedeki soyad.
          examples: [Yılmaz]
        birthDate:
          type: string
          format: date
          description: Belgedeki doğum tarihi.
          examples: ["1996-04-17"]
        identityNumber:
          type: string
          pattern: "^[1-9][0-9]{9}[02468]$"
          description: TC kimlik numarası; on bir hane, son hane çift.
          examples: ["10000000146"]
        documentNumber:
          type: string
          minLength: 1
          maxLength: 32
          description: Belgenin seri numarası.
          examples: [A01B23456]
        selfieMediaId:
          type: string
          format: uuid
          description: Yüz fotoğrafının medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b01]
        frontMediaId:
          type: string
          format: uuid
          description: Belgenin ön yüzünün medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b02]
        backMediaId:
          type: string
          format: uuid
          description: Belgenin arka yüzünün medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b03]
        togetherMediaId:
          type: string
          format: uuid
          description: Belgeyi yüzün yanında tutan karenin medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b04]

    IdentityReview:
      type: object
      description: |
        Çağıranın kendi kimlik incelemesi. Yanıt hiçbir depolama anahtarı ya da adres
        taşımaz (IDN-014). Ret gerekçesi burada okunur (IDN-019).
      required: [id, status, submittedAt, decidedAt, rejectionReason]
      properties:
        id:
          type: string
          format: uuid
          description: İncelemenin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b00]
        status:
          $ref: "#/components/schemas/IdentityReviewStatus"
          description: İncelemenin durumu.
        submittedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Gönderimin anı.
        decidedAt:
          $ref: "./components/datetime.yaml#/components/schemas/NullableTimestamp"
          description: Kararın anı; karar verilmediyse `null`.
        rejectionReason:
          type: [string, "null"]
          description: Ret gerekçesi; reddedilmediyse `null`.
          examples: [Belgenin arka yüzü okunamıyor.]
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b00
          status: PENDING
          submittedAt: "2026-11-08T09:00:00Z"
          decidedAt: null
          rejectionReason: null

    StaffIdentityReview:
      type: object
      description: |
        Personelin gördüğü inceleme. Beyan edilen kimlik numarası incelemeciye açık
        görünür, çünkü inceleme beyanın fotoğraflarla karşılaştırılmasıdır. Yanıt hiçbir
        depolama anahtarı, kova adı, uç nokta ya da bağlantı taşımaz (IDN-014).
      required:
        [id, status, submittedAt, decidedAt, decidedByStaffId, rejectionReason, user,
        declaredFirstName, declaredLastName, declaredBirthDate, declaredIdentityNumber,
        declaredDocumentNumber, documents]
      properties:
        id:
          type: string
          format: uuid
          description: İncelemenin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b00]
        status:
          $ref: "#/components/schemas/IdentityReviewStatus"
          description: İncelemenin durumu.
        submittedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Gönderimin anı.
        decidedAt:
          $ref: "./components/datetime.yaml#/components/schemas/NullableTimestamp"
          description: Kararın anı; karar verilmediyse `null`.
        decidedByStaffId:
          type: [string, "null"]
          format: uuid
          description: Kararı veren personelin kimliği; karar verilmediyse `null`.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6c00]
        rejectionReason:
          type: [string, "null"]
          description: Ret gerekçesi; reddedilmediyse `null`.
          examples: [Belgenin arka yüzü okunamıyor.]
        user:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: İncelemenin kullanıcısı; kaydı artık yoksa `null`.
        declaredFirstName:
          type: string
          description: Beyan edilen ad.
          examples: [Ayşe]
        declaredLastName:
          type: string
          description: Beyan edilen soyad.
          examples: [Yılmaz]
        declaredBirthDate:
          type: string
          format: date
          description: Beyan edilen doğum tarihi.
          examples: ["1996-04-17"]
        declaredIdentityNumber:
          type: string
          description: Beyan edilen kimlik numarası; incelemecinin karşılaştırma için gördüğü değer.
          examples: ["10000000146"]
        declaredDocumentNumber:
          type: string
          description: Beyan edilen belge numarası.
          examples: [A01B23456]
        documents:
          type: array
          description: İncelemeye bağlı fotoğraflar, yuva sırasına göre.
          items:
            $ref: "#/components/schemas/IdentityReviewDocument"

    IdentityReviewDocument:
      type: object
      description: |
        İncelemeye bağlı bir fotoğrafın üstverisi. Depolama anahtarı ve adres taşımaz;
        indirme ayrı bir operasyondur (IDN-014, IDN-015).
      required: [id, slot, contentType, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
          description: Fotoğrafın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b01]
        slot:
          type: string
          description: Fotoğrafın yuvası.
          enum: [SELFIE, FRONT, BACK, TOGETHER]
        contentType:
          type: string
          description: Sunucunun içerikten saptadığı tip; istemcinin beyanı değil.
          enum: [IMAGE_JPEG, IMAGE_PNG]
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Üstverisi striplendikten sonraki boyut.

    IdentityReviewPage:
      description: Kimlik inceleme kuyruğu.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CountedCursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: İncelemeler.
              items:
                $ref: "#/components/schemas/StaffIdentityReview"

    # --- Faz 2: şirket, üyelik, davet, takip (ADR-0029 Karar 7)

    CompanyType:
      type: string
      description: Şirketin hukuki türü; kuruluştan sonra değişmez.
      enum:
        [SOLE_PROPRIETORSHIP, LIMITED, CORPORATION, NON_PROFIT, GOVERNMENT,
         STARTUP, AGENCY, OTHER]

    CompanyApprovalStatus:
      type: string
      description: |
        Şirketin onay durumu. `APPROVED` terminaldir; reddedilmiş şirket sonradan
        onaylanabilir (CMP-002). Onaylanmamış şirket ilan yayınlayamaz (CMP-005).
      enum: [PENDING, APPROVED, REJECTED]

    CompanyContactRole:
      type: string
      description: Şirket üyeliğinin rolü (K17). Rol davet anında belirlenir ve değişmez.
      enum: [ADMIN, STAFF]

    CompanyInvitationStatus:
      type: string
      description: |
        Davetin durumu. `PENDING` dışındaki her durum terminaldir; davet on dört gün sonra
        `EXPIRED` okunur (CMP-015) ve şirket yöneticisi açık daveti `REVOKED` yapabilir
        (CMP-016).
      enum: [PENDING, ACCEPTED, REJECTED, REVOKED, EXPIRED]

    UserSummary:
      type: object
      description: Bir kullanıcının kişisel veri taşımayan özeti.
      required: [id, firstName, lastName, profilePictureUrl]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        firstName:
          type: string
          description: Ad.
          examples: [Ayşe]
        lastName:
          type: string
          description: Soyad.
          examples: [Yılmaz]
        profilePictureUrl:
          type: [string, "null"]
          description: Profil fotoğrafının genel adresi.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]

    CreateCompanyRequest:
      type: object
      description: |
        Şirketin kuruluş bilgileri. Vergi numarası ve tür kuruluştan sonra değişmez; ad,
        vergi numarası ve adreste tekillik aranmaz ve vergi numarasında sağlama
        doğrulaması yapılmaz (CMP-021).
      additionalProperties: false
      required: [name, email, phoneNumber, taxNumber, type, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Şirketin adı.
          examples: [Koala Lojistik A.Ş.]
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Şirketin adresi; bir Koala kullanıcısı olmak zorunda değildir.
          examples: [info@koalalojistik.example.com]
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 32
          description: Şirketin telefonu.
          examples: ["+902121112233"]
        taxNumber:
          type: string
          minLength: 1
          maxLength: 32
          description: Vergi numarası; tekil değildir ve sağlaması doğrulanmaz.
          examples: ["1234567890"]
        type:
          $ref: "#/components/schemas/CompanyType"
        website:
          type: string
          maxLength: 512
          description: Web sitesi.
          examples: ["https://koalalojistik.example.com"]
        description:
          type: string
          maxLength: 4000
          description: Tanıtım metni.
          examples: [İstanbul'da depo ve dağıtım hizmetleri.]
        logoMediaId:
          type: string
          format: uuid
          description: Logonun medya kimliği; `POST /v1/me/media` ile yüklenir.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        address:
          $ref: "#/components/schemas/AddressInput"

    CompanyPatch:
      type: object
      description: |
        JSON Merge Patch gövdesi (RFC 7396). Vergi numarası ve tür burada yoktur: ikisi
        kuruluştan sonra değişmez (CMP-021). Adres verilirse eski adres yenisiyle
        değiştirilir (CMP-022).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Şirketin adı; temizlenemez.
          examples: [Koala Lojistik A.Ş.]
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Şirketin adresi; temizlenemez.
          examples: [info@koalalojistik.example.com]
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 32
          description: Şirketin telefonu; temizlenemez.
          examples: ["+902121112233"]
        website:
          type: [string, "null"]
          maxLength: 512
          description: Web sitesi; temizlenebilir.
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        description:
          type: [string, "null"]
          maxLength: 4000
          description: Tanıtım metni; temizlenebilir.
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        address:
          $ref: "#/components/schemas/AddressInput"
          description: Adresin tamamı; iç içe değer nesnesi olarak atomiktir ve temizlenemez.

    Company:
      type: object
      description: |
        Bir şirket. Kararın notu yalnız şirketin üyelerine dolar; üye olmayan için `null`
        kalır (CMP-004).
      required:
        [id, name, email, phoneNumber, taxNumber, type, approvalStatus, approvalNote, website,
        description, logoUrl, address, followerCount, following, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Şirketin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a20]
        name:
          type: string
          description: Şirketin adı.
          examples: [Koala Lojistik A.Ş.]
        email:
          type: string
          description: Şirketin adresi.
          examples: [info@koalalojistik.example.com]
        phoneNumber:
          type: string
          description: Şirketin telefonu.
          examples: ["+902121112233"]
        taxNumber:
          type: string
          description: Vergi numarası.
          examples: ["1234567890"]
        type:
          $ref: "#/components/schemas/CompanyType"
          description: Hukuki tür.
        approvalStatus:
          $ref: "#/components/schemas/CompanyApprovalStatus"
          description: Onay durumu.
        approvalNote:
          type: [string, "null"]
          description: Kararın notu; yalnız şirketin üyelerine dolar.
          examples: [Vergi levhası okunamıyor.]
        website:
          type: [string, "null"]
          description: Web sitesi.
          examples: ["https://koalalojistik.example.com"]
        description:
          type: [string, "null"]
          description: Tanıtım metni.
          examples: [İstanbul'da depo ve dağıtım hizmetleri.]
        logoUrl:
          type: [string, "null"]
          description: Logonun genel adresi.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]
        address:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
          description: Şirketin adresi.
        followerCount:
          type: integer
          format: int32
          minimum: 0
          description: Takipçi sayısı.
        following:
          type: boolean
          description: Çağıran şirketi takip ediyor mu.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Şirketin kurulduğu an.

    CompanyContact:
      type: object
      description: "Şirketin bir üyesi. Kişisel veri taşımaz: e-posta, telefon ve kimlik numarası dönmez."
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
          description: Üyenin kullanıcı özeti.
        role:
          $ref: "#/components/schemas/CompanyContactRole"
          description: Üyeliğin rolü.
        joinedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Üyeliğin başladığı an.

    CompanyContactPage:
      description: Şirketin üyeleri.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Üyeler, üyeliğin başlangıcına göre eskiden yeniye.
              items:
                $ref: "#/components/schemas/CompanyContact"

    InviteCompanyContactRequest:
      type: object
      description: |
        Davet edilecek adres ve rol. Adres kayıtlı ve kimliği doğrulanmış bir kullanıcıya
        çözülmek zorundadır (CMP-009). Rol üyeliğin ömrü boyunca sabittir.
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Davet edilen kullanıcının adresi.
          examples: [mehmet@example.com]
        role:
          $ref: "#/components/schemas/CompanyContactRole"
      examples:
        - email: mehmet@example.com
          role: STAFF

    CompanyInvitation:
      type: object
      description: |
        Bir şirket daveti. Taşıyıcı bir kimlik bilgisi değildir: yetki kimlikten gelir,
        davet kimliğini bilmek yetki vermez (CMP-012, ADR-0029 Karar 7).
      required:
        [id, companyId, companyName, role, status, invitedBy, invitedUser, invitedAt, expiresAt,
        answeredAt]
      properties:
        id:
          type: string
          format: uuid
          description: Davetin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a60]
        companyId:
          type: string
          format: uuid
          description: Davet eden şirketin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a20]
        companyName:
          type: string
          description: Davet eden şirketin adı.
          examples: [Koala Lojistik A.Ş.]
        role:
          $ref: "#/components/schemas/CompanyContactRole"
          description: Davet edilen rol; davet anında donmuştur.
        status:
          $ref: "#/components/schemas/CompanyInvitationStatus"
          description: Davetin durumu.
        invitedBy:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: Daveti gönderen; kaydı artık yoksa `null`.
        invitedUser:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: Davet edilen; kaydı artık yoksa `null`.
        invitedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Davetin gönderildiği an.
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Davetin sona ereceği an (gönderimden 14 gün sonra).
        answeredAt:
          $ref: "./components/datetime.yaml#/components/schemas/NullableTimestamp"
          description: Cevaplandığı ya da geri alındığı an; açık davette `null`.

    CompanyInvitationPage:
      description: Şirketin davetleri.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Davetler, yeniden eskiye.
              items:
                $ref: "#/components/schemas/CompanyInvitation"

    FollowedCompany:
      type: object
      description: |
        Çağıranın takip ettiği bir şirket. `followedAt` güncel aboneliğin başlangıcıdır:
        bırakıp yeniden takip etmek tarihi yeniler (CMP-017).
      required: [companyId, name, logoUrl, description, followerCount, followedAt]
      properties:
        companyId:
          type: string
          format: uuid
          description: Şirketin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a20]
        name:
          type: string
          description: Şirketin adı.
          examples: [Koala Lojistik A.Ş.]
        logoUrl:
          type: [string, "null"]
          description: Logonun genel adresi.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]
        description:
          type: [string, "null"]
          description: Tanıtım metni.
          examples: [İstanbul'da depo ve dağıtım hizmetleri.]
        followerCount:
          type: integer
          format: int32
          minimum: 0
          description: Şirketin takipçi sayısı.
        followedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Güncel aboneliğin başladığı an.

    FollowedCompanyPage:
      description: Takip edilen şirketler.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Takip edilen şirketler.
              items:
                $ref: "#/components/schemas/FollowedCompany"

    AddCompanyImageRequest:
      type: object
      description: |
        Galerinin sonuna eklenecek görüntü; medya hazır durumda olmak zorundadır. Galeri
        boşsa eklenen görüntü kapak olur.
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Görüntünün medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        caption:
          type: string
          maxLength: 255
          description: Görüntünün açıklaması.
          examples: ["Kadıköy deposu, yükleme rampası"]
      examples:
        - mediaId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30
          caption: Kadıköy deposu, yükleme rampası

    SetCompanyLogoRequest:
      type: object
      description: Logonun medya kimliği; medya hazır durumda olmak zorundadır.
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Logonun medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
      examples:
        - mediaId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30

    CompanyGallery:
      type: object
      description: Şirketin galerisi; en çok on görüntü (MED-011).
      required: [coverMediaId, items]
      properties:
        coverMediaId:
          type: [string, "null"]
          format: uuid
          description: |
            Kapak görüntüsünün medya kimliği; galerinin ilk görüntüsüdür. Galeri boşsa
            `null`. Kapak ayrı bir uçla değil, galeriyi sıralayarak değişir.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        items:
          type: array
          maxItems: 10
          description: |
            Galerideki görüntüler **sıra numarasına göre**: ilk öğe kapaktır. Sıra
            `PUT /v1/companies/{companyId}/images` ile değişir, eklenme anıyla değil;
            yoksa sıralamanın sonucu gözlenemez ve kapak hiç değiştirilemezdi (CMP-023).
          items:
            $ref: "#/components/schemas/GalleryImage"

    GalleryImage:
      type: object
      description: |
        Galerideki bir görüntü. Sıra numarası dizideki konumuna katlanmıştır ve kapak
        dizinin ilk öğesidir; ikisi de ayrı alan taşımaz (ADR-0029 Karar 7).
      required: [mediaId, url, caption]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Görüntünün medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        url:
          type: string
          description: Görüntünün genel adresi.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]
        caption:
          type: [string, "null"]
          description: Görüntünün açıklaması; verilmediyse `null`.
          examples: ["Kadıköy deposu, yükleme rampası"]

    # --- Faz 2: medya (ADR-0029 Karar 6)

    MediaKind:
      type: string
      description: |
        Medyanın türü; depolama önekini ve kabul edilen tipleri belirler. `IDENTITY_DOCUMENT`
        hiçbir genel yoldan okunamaz (IDN-007).
      enum: [PROFILE_PICTURE, COMPANY_LOGO, COMPANY_IMAGE, IDENTITY_DOCUMENT, CV]

    MediaStatus:
      type: string
      description: |
        Medyanın durumu. `PENDING` yükleme tamamlanmamıştır, `READY` nesne doğrulanmış,
        üstverisi striplenmiş ve son yerine taşınmıştır, `REJECTED` doğrulamada düşmüştür
        (MED-001).
      enum: [PENDING, READY, REJECTED]

    MediaContentType:
      type: string
      description: Sunucunun içerikten saptadığı tip; istemcinin beyanı karara girmez (IDN-003).
      enum: [IMAGE_JPEG, IMAGE_PNG, APPLICATION_PDF]

    StartMediaUploadRequest:
      type: object
      description: |
        Yüklemenin türü ve bildirilen boyutu. Bildirilen boyut yalnız yazma adresinin
        sınırını kurar; gerçek boyut, tip ve tuval tamamlama adımında içerikten doğrulanır
        (IDN-003, IDN-004).
      additionalProperties: false
      required: [kind, sizeBytes]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: Bildirilen boyut; en çok 10 MiB.
      examples:
        - kind: PROFILE_PICTURE
          sizeBytes: 524288

    MediaUpload:
      type: object
      description: |
        Beklemede medya kaydı ve karantina için kısa ömürlü yazma adresi. İstemci nesneyi
        bu adrese yazar, sonra tamamlama operasyonunu çağırır (MED-001).
      required: [media, uploadUrl, uploadExpiresAt]
      properties:
        media:
          $ref: "#/components/schemas/Media"
          description: Beklemede medya kaydı.
        uploadUrl:
          type: string
          description: Karantina anahtarına yazmak için imzalı adres.
          examples: ["https://objects.example.com/incoming/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg?X-Amz-Expires=900"]
        uploadExpiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Yazma adresinin son geçerli anı.

    Media:
      type: object
      description: |
        Bir medya kaydı. Hazır olduğunda nesnenin üstverisi tümden striplenmiştir: konum
        (GPS), kamera ve seri numaraları dahil (MED-005). Kimlik belgesi fotoğrafının
        adresi hiçbir durumda üretilmez (IDN-007).
      required: [id, kind, status, contentType, sizeBytes, url, rejectionCode, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Medyanın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        kind:
          $ref: "#/components/schemas/MediaKind"
          description: Medyanın türü.
        status:
          $ref: "#/components/schemas/MediaStatus"
          description: Medyanın durumu.
        contentType:
          oneOf:
            - $ref: "#/components/schemas/MediaContentType"
            - type: "null"
          description: Saptanan tip; yükleme tamamlanmadıysa `null`.
        sizeBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Stripleme sonrası boyut; yükleme tamamlanmadıysa `null`.
        url:
          type: [string, "null"]
          description: |
            Nesnenin genel adresi; yalnız genel okunabilen türlerde ve hazır durumda dolar.
            Kimlik belgesi fotoğrafında her zaman `null`'dır.
          examples: ["https://cdn.example.com/images/0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30.jpg"]
        rejectionCode:
          oneOf:
            - $ref: "./components/problem.yaml#/components/schemas/ErrorCode"
            - type: "null"
          description: Doğrulamada düştüyse sebebin kodu; düşmediyse `null`.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Yüklemenin başlatıldığı an.

    # --- Faz 2: adres ve referans verisi (ADR-0029 Karar 8)

    Coordinates:
      type: object
      description: |
        Koordinat. Depolamada tam hassasiyet tutulur; yanıtta görünen hassasiyeti çağırana
        göre projeksiyon belirler (MED-009, [[job-location-rule]]).
      required: [latitude, longitude, precision]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Enlem.
          examples: [40.9876]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Boylam.
          examples: [29.0254]
        precision:
          type: string
          description: |
            Bu yanıtta verilen hassasiyet. `EXACT` tam koordinattır, `APPROXIMATE`
            yuvarlanmıştır.
          enum: [EXACT, APPROXIMATE]

    CoordinatesInput:
      type: object
      description: Koordinat girdisi; her zaman tam hassasiyetle saklanır.
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Enlem.
          examples: [40.9876]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Boylam.
          examples: [29.0254]

    AddressInput:
      type: object
      description: |
        Adresin bileşenleri. Sağlayıcının biçimlendirdiği adres metni ve ham yanıtı
        gönderilmez ve saklanmaz; yalnız yer kimliği ve bizim bileşenlerimiz kalır
        (MED-008).
      additionalProperties: false
      required: [cityId, districtId]
      properties:
        cityId:
          type: string
          format: uuid
          description: Şehrin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d01]
        districtId:
          type: string
          format: uuid
          description: İlçenin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d02]
        neighborhood:
          type: string
          maxLength: 120
          description: Mahalle.
          examples: [Caferağa]
        thoroughfare:
          type: string
          maxLength: 160
          description: Cadde ya da sokak.
          examples: [Moda Caddesi]
        buildingNumber:
          type: string
          maxLength: 30
          description: Bina numarası.
          examples: ["12"]
        buildingName:
          type: string
          maxLength: 120
          description: Bina adı.
          examples: [Moda Apartmanı]
        floor:
          type: string
          maxLength: 20
          description: Kat.
          examples: ["3"]
        unitNumber:
          type: string
          maxLength: 30
          description: Daire numarası.
          examples: ["7"]
        postalCode:
          type: string
          maxLength: 5
          description: Posta kodu.
          examples: ["34710"]
        additionalDirections:
          type: string
          maxLength: 500
          description: Adres tarifi.
          examples: [Eczanenin yanındaki giriş.]
        providerPlaceId:
          type: string
          maxLength: 255
          description: |
            Sağlayıcının yer kimliği. Saklanan tek sağlayıcı verisidir; kalıcı değil,
            yenilenebilir bir işaretçi olarak tutulur (MED-008).
          examples: [ChIJAbCdEfGhIjKlMnOpQrStUv]
        coordinates:
          $ref: "#/components/schemas/CoordinatesInput"

    Address:
      type: object
      description: |
        Bir adres kaydı. Koordinatın görünen hassasiyeti çağırana göre değişir (MED-009).
        Görünen adres metni sağlayıcıdan değil, kendi bileşenlerimizden üretilir (MED-008).
      required:
        [id, city, district, neighborhood, thoroughfare, buildingNumber, buildingName, floor,
        unitNumber, postalCode, additionalDirections, displayLine, coordinates, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Adresin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a40]
        city:
          $ref: "#/components/schemas/ReferenceItem"
          description: Şehir.
        district:
          $ref: "#/components/schemas/ReferenceItem"
          description: İlçe.
        neighborhood:
          type: [string, "null"]
          description: Mahalle.
          examples: [Caferağa]
        thoroughfare:
          type: [string, "null"]
          description: Cadde ya da sokak.
          examples: [Moda Caddesi]
        buildingNumber:
          type: [string, "null"]
          description: Bina numarası.
          examples: ["12"]
        buildingName:
          type: [string, "null"]
          description: Bina adı.
          examples: [Moda Apartmanı]
        floor:
          type: [string, "null"]
          description: Kat.
          examples: ["3"]
        unitNumber:
          type: [string, "null"]
          description: Daire numarası.
          examples: ["7"]
        postalCode:
          type: [string, "null"]
          description: Posta kodu.
          examples: ["34710"]
        additionalDirections:
          type: [string, "null"]
          description: Adres tarifi.
          examples: [Eczanenin yanındaki giriş.]
        displayLine:
          type: string
          description: Kendi bileşenlerimizden üretilen görünen adres metni.
          examples: ["Moda Caddesi 12/7, Caferağa, Kadıköy, İstanbul"]
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/Coordinates"
            - type: "null"
          description: Koordinat; bilinmiyorsa `null`.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Adresin kaydedildiği an.

    AddressPage:
      description: Çağıranın adresleri.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Adresler, yeniden eskiye.
              items:
                $ref: "#/components/schemas/Address"

    ResolvedAddress:
      type: object
      description: |
        Bir önerinin bizim bileşenlerimize çözülmüş hâli. İstemci bunu olduğu gibi
        `POST /v1/me/addresses`'e verebilir. Sağlayıcının biçimlendirdiği metin ve ham
        yanıtı dönmez (MED-008).
      required:
        [cityId, districtId, neighborhood, thoroughfare, buildingNumber, postalCode,
        providerPlaceId, latitude, longitude]
      properties:
        cityId:
          type: string
          format: uuid
          description: Şehrin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d01]
        districtId:
          type: string
          format: uuid
          description: İlçenin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d02]
        neighborhood:
          type: [string, "null"]
          description: Mahalle.
          examples: [Caferağa]
        thoroughfare:
          type: [string, "null"]
          description: Cadde ya da sokak.
          examples: [Moda Caddesi]
        buildingNumber:
          type: [string, "null"]
          description: Bina numarası.
          examples: ["12"]
        postalCode:
          type: [string, "null"]
          description: Posta kodu.
          examples: ["34710"]
        providerPlaceId:
          type: [string, "null"]
          description: Sağlayıcının yer kimliği.
          examples: [ChIJAbCdEfGhIjKlMnOpQrStUv]
        latitude:
          type: [number, "null"]
          format: double
          minimum: -90
          maximum: 90
          description: Enlem; sağlayıcı vermediyse `null`.
          examples: [40.9876]
        longitude:
          type: [number, "null"]
          format: double
          minimum: -180
          maximum: 180
          description: Boylam; sağlayıcı vermediyse `null`.
          examples: [29.0254]

    AddressSearchSession:
      type: object
      description: |
        Sağlayıcıya karşı bir adres arama oturumu. Çağırana bağlıdır ve on beş dakika
        yaşar; kimliğini ele geçiren başka bir kullanıcı onu kullanamaz (MED-010).
      required: [id, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Oturumun kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a70]
        expiresAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Oturumun son geçerli anı.
      examples:
        - id: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a70
          expiresAt: "2026-11-08T09:15:00Z"

    AddressSuggestion:
      type: object
      description: |
        Bir adres önerisi. `candidateId` oturum içinde geçerlidir ve çözme operasyonuna
        verilir. Sağlayıcının biçimlendirdiği metin önbelleğe alınmaz ve kalıcılaşmaz
        (MED-008).
      required: [candidateId, primaryText, secondaryText]
      properties:
        candidateId:
          type: string
          description: Önerinin oturum içindeki kimliği.
          examples: [c_01]
        primaryText:
          type: string
          description: Önerinin ana satırı.
          examples: [Moda Caddesi]
        secondaryText:
          type: string
          description: Önerinin ikinci satırı.
          examples: ["Caferağa, Kadıköy, İstanbul"]

    AddressSuggestionList:
      type: object
      description: Adres önerileri; tek sayfa, en çok on öneri.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          description: Öneriler, sağlayıcının verdiği sırayla.
          items:
            $ref: "#/components/schemas/AddressSuggestion"

    ReferenceItem:
      type: object
      description: Bir referans verisi satırı (şehir, ilçe, üniversite, fakülte, bölüm).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Satırın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d01]
        name:
          type: string
          description: Görünen ad.
          examples: [İstanbul]

    ReferenceItemList:
      type: object
      description: Referans verisi listesi; tek sayfa, salt okunur (MED-012).
      required: [items]
      properties:
        items:
          type: array
          description: Satırlar, ada göre sıralı.
          items:
            $ref: "#/components/schemas/ReferenceItem"

    ReplaceCompanyGalleryRequest:
      type: object
      description: |
        Galerinin yeni içeriği. Sıra anlamlıdır: ilk öğe kapaktır. Boş liste galeriyi
        boşaltır. Her medya hazır durumda olmak zorundadır (ADR-0029 Karar 7).
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          description: Galerinin öğeleri, kapak ilk olacak şekilde sıralı.
          items:
            $ref: "#/components/schemas/CompanyGalleryItemInput"
      examples:
        - items:
            - mediaId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30
              caption: Kadıköy deposu, yükleme rampası
            - mediaId: 0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a31

    CompanyGalleryItemInput:
      type: object
      description: "Galerinin bir öğesi: medya kimliği ve isteğe bağlı açıklaması."
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Görüntünün medya kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a30]
        caption:
          type: string
          maxLength: 255
          description: Görüntünün açıklaması.
          examples: ["Kadıköy deposu, yükleme rampası"]

    EducationDegree:
      type: string
      description: Eğitim kaydının derecesi.
      enum: [HIGH_SCHOOL, ASSOCIATE, BACHELOR, MASTER, DOCTORATE]

    EducationInput:
      type: object
      description: |
        Bir eğitim kaydının alanları. Üniversite, fakülte ve bölüm referans verisinden
        gelir (`/v1/reference`). Süren eğitimde `endYear` boştur; verildiğinde
        `startYear`'dan küçük olamaz.
      additionalProperties: false
      required: [universityId, degree, startYear]
      properties:
        universityId:
          type: string
          format: uuid
          description: Üniversitenin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d10]
        facultyId:
          type: string
          format: uuid
          description: Fakültenin referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d11]
        departmentId:
          type: string
          format: uuid
          description: Bölümün referans kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6d12]
        degree:
          $ref: "#/components/schemas/EducationDegree"
        startYear:
          type: integer
          format: int32
          minimum: 1950
          maximum: 2100
          description: Başlangıç yılı.
          examples: [2014]
        endYear:
          type: [integer, "null"]
          format: int32
          minimum: 1950
          maximum: 2100
          description: Bitiş yılı; eğitim sürüyorsa `null`.
          examples: [2018]

    Education:
      type: object
      description: Çağıranın bir eğitim kaydı.
      required: [id, university, faculty, department, degree, startYear, endYear, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Eğitim kaydının kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6e01]
        university:
          $ref: "#/components/schemas/ReferenceItem"
          description: Üniversite.
        faculty:
          oneOf:
            - $ref: "#/components/schemas/ReferenceItem"
            - type: "null"
          description: Fakülte; verilmediyse `null`.
        department:
          oneOf:
            - $ref: "#/components/schemas/ReferenceItem"
            - type: "null"
          description: Bölüm; verilmediyse `null`.
        degree:
          $ref: "#/components/schemas/EducationDegree"
          description: Derece.
        startYear:
          type: integer
          format: int32
          description: Başlangıç yılı.
          examples: [2014]
        endYear:
          type: [integer, "null"]
          format: int32
          description: Bitiş yılı; eğitim sürüyorsa `null`.
          examples: [2018]
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Kaydın eklendiği an.

    EducationPage:
      description: Çağıranın eğitim kayıtları.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Eğitim kayıtları, bitiş yılına göre yeniden eskiye.
              items:
                $ref: "#/components/schemas/Education"

    # --- Faz 2: personel yüzeyi (ADR-0029 Karar 9)

    ApprovalRequest:
      type: object
      description: Onay kararının notu; isteğe bağlıdır ve kırpılarak kaydedilir (CMP-003).
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
          description: Kararın notu.
          examples: [Vergi levhası doğrulandı.]

    RejectionRequest:
      type: object
      description: |
        Ret gerekçesi. Zorunludur, serbest metindir ve en çok bin karakterdir; enum yoktur
        (CMP-003, IDN-013).
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Ret gerekçesi.
          examples: [Belgenin arka yüzü okunamıyor.]
      examples:
        - reason: Belgenin arka yüzü okunamıyor.

    StaffUser:
      type: object
      description: |
        Personelin listede gördüğü kullanıcı. Liste kişisel veri taşımaz: e-posta, telefon
        ve kimlik numarası dönmez.
      required:
        [id, firstName, lastName, employer, emailVerified, phoneVerified, identityVerified,
        createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        firstName:
          type: string
          description: Ad.
          examples: [Ayşe]
        lastName:
          type: string
          description: Soyad.
          examples: [Yılmaz]
        employer:
          type: boolean
          description: İşveren hesabı mı.
        emailVerified:
          type: boolean
          description: Adres doğrulanmış mı.
        phoneVerified:
          type: boolean
          description: Telefon doğrulanmış mı.
        identityVerified:
          type: boolean
          description: Kimlik doğrulanmış mı.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Hesabın açıldığı an.

    StaffUserPage:
      description: Personelin gördüğü kullanıcı listesi.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CountedCursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Kullanıcılar.
              items:
                $ref: "#/components/schemas/StaffUser"

    StaffUserDetail:
      type: object
      description: |
        Personelin gördüğü kullanıcı detayı. Kişisel veri alanları (`email`,
        `phoneNumber`, `birthDate`, `address`) yalnız `user.read_pii` tutan personel için
        dolar; tutmayan personel onları `null` görür (ADR-0029 Karar 9). Kimlik numarası
        hiçbir projeksiyonda dönmez (IDN-018).
      required:
        [id, firstName, lastName, email, phoneNumber, birthDate, address, employer,
        emailVerified, phoneVerified, identityVerified, identityReviewId,
        identityReviewStatus, companies, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Kullanıcı kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10]
        firstName:
          type: string
          description: Ad.
          examples: [Ayşe]
        lastName:
          type: string
          description: Soyad.
          examples: [Yılmaz]
        email:
          type: [string, "null"]
          description: Giriş adresi; yalnız `user.read_pii` ile dolar.
          examples: [ayse@example.com]
        phoneNumber:
          type: [string, "null"]
          description: Telefon numarası; yalnız `user.read_pii` ile dolar.
          examples: ["+905551112233"]
        birthDate:
          type: [string, "null"]
          format: date
          description: Doğum tarihi; yalnız `user.read_pii` ile dolar.
          examples: ["1996-04-17"]
        address:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
          description: Birincil adres; yalnız `user.read_pii` ile dolar.
        employer:
          type: boolean
          description: İşveren hesabı mı.
        emailVerified:
          type: boolean
          description: Adres doğrulanmış mı.
        phoneVerified:
          type: boolean
          description: Telefon doğrulanmış mı.
        identityVerified:
          type: boolean
          description: Kimlik doğrulanmış mı.
        identityReviewId:
          type: [string, "null"]
          format: uuid
          description: En son kimlik incelemesinin kimliği; hiç gönderim yoksa `null`.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6b00]
        identityReviewStatus:
          oneOf:
            - $ref: "#/components/schemas/IdentityReviewStatus"
            - type: "null"
          description: En son incelemenin durumu; hiç gönderim yoksa `null`.
        companies:
          type: array
          description: Kullanıcının şirket üyelikleri.
          items:
            $ref: "#/components/schemas/CompanyMembership"
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Hesabın açıldığı an.

    IdentityReveal:
      type: object
      description: |
        Bir işçinin kimliğinin açıldığı kayıt. Satır ekle-sil-yapılamaz. Adres bilgisi
        yazım anında maskelenmiştir; personel tam adresi görmez. Kimlik numarası dönmez
        (IDN-018).
      required:
        [id, viewerId, viewerName, jobAssignmentId, jobTitle, revealedAt, maskedIpAddress]
      properties:
        id:
          type: string
          format: uuid
          description: Kaydın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a80]
        viewerId:
          type: string
          format: uuid
          description: Kimliği açan kullanıcının kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a90]
        viewerName:
          type: [string, "null"]
          description: Açanın görünen adı; hesabını silmişse `null`.
          examples: [Mehmet Demir]
        jobAssignmentId:
          type: string
          format: uuid
          description: Açmanın dayandığı atamanın kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6aa0]
        jobTitle:
          type: [string, "null"]
          description: İlanın başlığı.
          examples: [Depo görevlisi]
        revealedAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Açmanın anı.
        maskedIpAddress:
          type: string
          description: Açanın adresinin maskeli hâli; tam adres hiç saklanmaz.
          examples: ["192.0.***.***"]

    IdentityRevealPage:
      description: Kimlik açılma izleri.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CountedCursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: İzler, yeniden eskiye.
              items:
                $ref: "#/components/schemas/IdentityReveal"

    StaffCompany:
      type: object
      description: Personelin listede gördüğü şirket.
      required: [id, name, taxNumber, type, approvalStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Şirketin kimliği.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a20]
        name:
          type: string
          description: Şirketin adı.
          examples: [Koala Lojistik A.Ş.]
        taxNumber:
          type: string
          description: Vergi numarası.
          examples: ["1234567890"]
        type:
          $ref: "#/components/schemas/CompanyType"
          description: Hukuki tür.
        approvalStatus:
          $ref: "#/components/schemas/CompanyApprovalStatus"
          description: Onay durumu.
        createdAt:
          $ref: "./components/datetime.yaml#/components/schemas/Timestamp"
          description: Şirketin kurulduğu an.

    StaffCompanyPage:
      description: Şirket onay kuyruğu.
      allOf:
        - $ref: "./components/pagination.yaml#/components/schemas/CountedCursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Şirketler.
              items:
                $ref: "#/components/schemas/StaffCompany"

    StaffCompanyReview:
      type: object
      description: |
        Personelin gördüğü şirket incelemesi: vergi numarası, kararın notu, kararı veren
        personelin kimliği, üye listesi ve galeri. Üyeler kişisel veri taşımaz.
      required: [company, approvalDecidedAt, approvedByStaffId, createdBy, contacts, gallery]
      properties:
        company:
          $ref: "#/components/schemas/Company"
          description: Şirketin kendisi; kararın notu personel için her zaman dolar.
        approvalDecidedAt:
          $ref: "./components/datetime.yaml#/components/schemas/NullableTimestamp"
          description: Kararın anı; karar verilmediyse `null`.
        approvedByStaffId:
          type: [string, "null"]
          format: uuid
          description: |
            Kararı veren personelin kimliği; karar verilmediyse `null`. Ret kararında da
            yazılır.
          examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6c00]
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: Şirketi kuran kullanıcı; kaydı artık yoksa `null`.
        contacts:
          type: array
          description: Şirketin üyeleri.
          items:
            $ref: "#/components/schemas/CompanyContact"
        gallery:
          $ref: "#/components/schemas/CompanyGallery"
          description: Şirketin galerisi.

  # Ortak hata yanıtları. Her biri Problem gövdesi döner; kodlar
  # ErrorCode'dadır.
  responses:
    BadRequest:
      description: |
        İstek sözleşmeye uymuyor (`REQUEST_INVALID`, `REQUEST_BODY_MALFORMED`,
        `PATH_INVALID`, …) ya da istemci sürümü desteklenmiyor
        (`APP_VERSION_UNSUPPORTED`; o zaman `X-Minimum-App-Version` döner).
      headers:
        X-Minimum-App-Version:
          $ref: "./components/headers.yaml#/components/headers/XMinimumAppVersion"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Unauthorized:
      description: Kimlik doğrulanamadı.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Forbidden:
      description: Kimlik doğrulandı ama eylem yasak. Okuma reddi 403 değil, kaynağın 404'üdür (ADR-0014).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    NotFound:
      description: Kaynak yok ya da görme yetkiniz yok; ikisi ayırt edilemez.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    Conflict:
      description: Kaynağın durumu isteğe izin vermiyor ya da aynı Idempotency-Key'li istek sürüyor.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    PayloadTooLarge:
      description: Gövde route'un sınırını aşıyor (`REQUEST_BODY_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    UnprocessableContent:
      description: Aynı Idempotency-Key farklı gövdeyle kullanıldı (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Gövdenin `Content-Type`'ı desteklenmiyor (`CONTENT_TYPE_UNSUPPORTED`).
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    TooManyRequests:
      description: Oran sınırı aşıldı (`RATE_LIMITED` ya da uca özgü bir kod); `Retry-After` döner.
      headers:
        Retry-After:
          $ref: "./components/headers.yaml#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    BadGateway:
      description: |
        Üst sistem yanıt vermiyor (adres sağlayıcısı, ödeme sağlayıcısı);
        `ADDRESS_PROVIDER_UNAVAILABLE` gibi uca özgü bir kod döner.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    ServiceUnavailable:
      description: Örnek şu an isteği alamıyor (kapanış drain'i); `Retry-After` kadar sonra yeniden denenir.
      headers:
        Retry-After:
          $ref: "./components/headers.yaml#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
    InternalError:
      description: |
        Beklenmeyen hata (`INTERNAL`) ya da üst sistem hatası. Sözleşmesi dondurulmuş ama
        handler'ı henüz gelmemiş bir operasyon da buradan yanıt verir:
        `501 NOT_IMPLEMENTED` (stil rehberi §11.1, ADR-0029 §1). Yol vardır ve sözleşmesi
        bağlayıcıdır; `404 ROUTE_NOT_FOUND` ile karıştırılmaz.
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem.yaml#/components/schemas/Problem"
