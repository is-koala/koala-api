# Hata gövdesi (RFC 9457) ve hata kodu kaydı (ADR-0007, ADR-0019, plan §3.4).
#
# Alanlar internal/platform/httpx.Problem ve ProblemField ile birebir
# aynıdır: api.TestProblemSchemaMatchesHTTPX anahtar kümelerini ve zorunlu
# alanları karşılaştırır, httpx.TestWriteErrorGoldenBody kablo biçimini
# sabitler.
openapi: 3.1.1
info:
  title: Koala ortak bileşenleri - problem
  version: 1.0.0
components:
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem belgesi; medya tipi `application/problem+json`.
        `detail` alanı yoktur: kullanıcıya gösterilecek metni istemci `code`'dan
        üretir (ADR-0005 madde 3). Gövde yanıt olduğu için yeni alan eklenebilir;
        istemci bilmediği alanı yok sayar.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: "`https://api.iskoala.com/problems/<code-kebab>`; `code`'dan türetilir."
          examples: ["https://api.iskoala.com/problems/request-invalid"]
        title:
          type: string
          description: HTTP durumunun standart adı (`Bad Request`). Görüntülemek için değil.
          examples: [Bad Request]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          examples: [400]
        code:
          $ref: "#/components/schemas/ErrorCode"
        instance:
          type: string
          description: |
            Eşleşen route şablonu (`/v1/jobs/{jobId}`). Yol parametresinin değeri
            yazılmaz; eşleşmeyen istekte (404 `ROUTE_NOT_FOUND`) alan yoktur (ADR-0019).
          examples: ["/v1/auth/login"]
        requestId:
          type: string
          description: Yanıttaki `X-Request-Id` ile aynı değer.
          examples: [req-123]
        errors:
          type: array
          description: Alan ve parametre hataları. Yalnız alan düzeyinde hata varsa bulunur.
          items:
            $ref: "#/components/schemas/ProblemField"
      examples:
        - type: https://api.iskoala.com/problems/request-invalid
          title: Bad Request
          status: 400
          code: REQUEST_INVALID
          instance: /v1/auth/login
          requestId: req-123
          errors:
            - pointer: /amount/currency
              code: FIELD_REQUIRED
            - parameter: limit
              in: QUERY
              code: FIELD_OUT_OF_RANGE

    ProblemField:
      type: object
      description: |
        Tek bir alanın ya da parametrenin hatası (ADR-0019). Gövdedeki üye `pointer`
        ile (RFC 6901; `""` gövdenin tamamı), parametre `parameter` + `in` ile
        gösterilir; ikisi birlikte bulunmaz. JSON:API'nin `source.pointer` /
        `source.parameter` ayrımıyla aynı. Şema bunu zorlar: `parameter` ile `in`
        birlikte gelir, `pointer` ile `parameter` birlikte gelmez ve ikisinden biri
        mutlaka vardır.
      required: [code]
      dependentRequired:
        parameter: [in]
        in: [parameter]
      not:
        required: [pointer, parameter]
      if:
        not:
          required: [pointer]
      then:
        required: [parameter]
      properties:
        pointer:
          type: string
          description: Gövdedeki üyenin RFC 6901 JSON pointer'ı.
          examples: [/amount/currency]
        parameter:
          type: string
          description: Parametrenin adı (`limit`, `Idempotency-Key`).
          examples: [limit]
        in:
          type: string
          description: Parametrenin yeri (OpenAPI `in`, UPPER_SNAKE enum kuralıyla).
          enum: [QUERY, PATH, HEADER, COOKIE]
        code:
          $ref: "#/components/schemas/ErrorCode"
      examples:
        - pointer: /amount/currency
          code: FIELD_REQUIRED
        - parameter: limit
          in: QUERY
          code: FIELD_OUT_OF_RANGE

    ErrorCode:
      type: string
      description: |
        Stabil, makinece okunur hata kodu (UPPER_SNAKE). Bir kodun anlamı hiç değişmez;
        yeni kod eklemek geriye uyumludur. İstemciler bilmedikleri kodu genel hata olarak
        gösterir. Servis yeni bir kod döndürmeden önce kod bu listeye eklenir
        (CLAUDE.md "Hatalar"); istemcilerin kod listesi buradan üretilir (ADR-0007 madde 5).

        Problem kodları (`Problem.code`):
        - `INTERNAL` (500): sınıflandırılmamış hata; sebep yalnız log'da.
        - `ROUTE_NOT_FOUND` (404): bilinmeyen yol.
        - `METHOD_NOT_ALLOWED` (405): yol var, metot yok; `Allow` başlığı döner.
        - `REQUEST_BODY_TOO_LARGE` (413): gövde operasyonun sınırını aşıyor.
        - `CONTENT_TYPE_UNSUPPORTED` (415): gövdenin `Content-Type`'ı operasyonun kabul ettiklerinden değil.
        - `REQUEST_INVALID` (400): istek sözleşmeye uymuyor; ayrıntı `errors`'ta.
        - `REQUEST_BODY_MALFORMED` (400): gövde yok ya da JSON olarak çözülemiyor.
        - `SORT_FIELD_NOT_ALLOWED` (400): `sort` alanı operasyonun `x-sort-fields` listesinde değil.
        - `CURSOR_INVALID` (400): `cursor` bozuk, süresi dolmuş ya da başka bir sorguya ait.
        - `IDEMPOTENCY_KEY_REQUIRED` (400): operasyon `Idempotency-Key` istiyor.
        - `IDEMPOTENCY_KEY_REUSED` (422): aynı anahtar farklı bir gövdeyle kullanıldı.
        - `IDEMPOTENCY_KEY_IN_USE` (409): aynı anahtarlı istek hâlâ işleniyor.
        - `APP_VERSION_UNSUPPORTED` (400): `X-App-Version` en düşük sürümün altında; yanıtta
          `X-Minimum-App-Version` bulunur. 426 kullanılmaz: RFC 9110 426 yanıtında `Upgrade`
          başlığını zorunlu tutuyor (ADR-0019). Yalnız `IOS` ve `ANDROID` istemcisi alır;
          sürüm yok ya da okunamıyorsa da döner (ADR-0021).
        - `PATH_INVALID` (400): yol kanonik değil: `//`, `.`/`..` parçası, kodlanmış `/`, `\` ya da
          `%` (`%2f`, `%5c`, `%25`), kontrol karakteri ya da geçersiz UTF-8. Yol yeniden yazılmaz,
          reddedilir (ADR-0021).
        - `RATE_LIMITED` (429): istek oran sınırını aştı; `Retry-After` döner (ADR-0021).
        - `SOFT_DELETE_RESTRICTED` (409): `restrict` politikalı bir kenarda aktif çocuk kayıt
          varken silinemez (ADR-0013, ADR-0020).
        - `RESTORE_CONFLICT` (409): geri alınan kaydın benzersiz anahtarını aktif bir kayıt almış.
        - `RESTORE_PARENT_DELETED` (409): geri alınan kaydın `cascade` ya da `restrict` kenarındaki
          ebeveyni başka bir silmeyle hâlâ silinmiş.
        - `RESTORE_EXPIRED` (409): silmenin kök kaydı artık yok (temizlenmiş ya da anonimleştirilmiş);
          geri alınamaz.
        - `DELETION_NOT_FOUND` (404): geri alınmak istenen silme kaydı yok.
        - `DELETION_ALREADY_RESTORED` (409): silme daha önce geri alınmış.

        Realtime kodları (ADR-0018). Problem olarak handshake'te ve bilet ucunda, `error`
        olayının `code`'u olarak bağlantı açıkken döner:
        - `REALTIME_TICKET_INVALID` (401): bilet yok, bozuk, kullanılmış, süresi geçmiş, başka
          cihazın ya da oturumu kapanmış; hepsi aynı yanıt.
        - `REALTIME_TICKET_RATE_LIMITED` (429): kullanıcı başına bilet oranı aşıldı; `Retry-After` döner.
        - `REALTIME_DEVICE_REQUIRED` (401): `Origin`'siz (yerel) handshake `X-Device-Id` taşımıyor.
        - `REALTIME_PROTOCOL_UNSUPPORTED` (400): WebSocket upgrade başlıkları ya da `koala.v1` alt protokolü eksik.
        - `REALTIME_ORIGIN_FORBIDDEN` (403): `Origin` izinli değil.
        - `REALTIME_DRAINING` (503): örnek kapanıyor; `Retry-After` döner.
        - `REALTIME_TOO_MANY_CONNECTIONS` (429): kullanıcının açık bağlantı sınırı dolu; `Retry-After` döner.
        - `REALTIME_COMMAND_UNKNOWN` (olay): bilinmeyen komut tipi; bağlantı açık kalır.
        - `REALTIME_COMMAND_INVALID` (olay): komut çözülemedi ya da alanı geçersiz.
        - `REALTIME_RATE_LIMITED` (olay): bağlantının komut oranı aşıldı.
        - `CONVERSATION_NOT_FOUND` (olay; Faz 4'te REST'te de 404): konuşma yok ya da katılımcısı
          değilsiniz; ikisi ayırt edilemez (ADR-0014).

        Kimlik doğrulama kodları (ADR-0015, ADR-0025):
        - `AUTH_EMAIL_OR_PASSWORD_MISMATCH` (401): kayıtsız adres, yanlış parola ya da parolası
          olmayan hesap; üçü ayırt edilemez (AUTH-001).
        - `AUTH_ACCOUNT_SUSPENDED` (403): parola doğru ama hesap askıda.
        - `AUTH_TOKEN_MISSING` (401): korunan operasyonda `Authorization: Bearer` yok.
        - `AUTH_TOKEN_INVALID` (401): erişim token'ı bozuk, sahte, başka sınıfın ya da henüz geçerli değil.
        - `AUTH_TOKEN_EXPIRED` (401): erişim token'ının süresi doldu; istemci yeniler.
        - `AUTH_SESSION_NOT_FOUND_OR_INACTIVE` (401): oturum yok, kapalı ya da süresi dolmuş; kullanıcısı
          ya da cihazı silinmiş.
        - `AUTH_SESSION_NOT_MATCHING_CURRENT_DEVICE` (401): istek oturumun cihazından gelmedi; oturum
          kapatıldı (AUTH-004).
        - `AUTH_REFRESH_TOKEN_INVALID` (401): refresh token bilinmiyor ya da bozuk.
        - `AUTH_REFRESH_TOKEN_EXPIRED` (401): refresh token'ın boşta kalma ya da oturumun mutlak süresi
          doldu; oturum kapandı.
        - `AUTH_REFRESH_TOKEN_REUSED` (401): döndürülmüş bir refresh token yeniden geldi; oturumun
          tamamı kapatıldı (K12).
        - `AUTH_SESSION_NOT_FOUND` (404): çağıranın böyle açık bir oturumu yok; başkasınınki de aynı
          yanıtı alır (AUTH-016).
        - `PASSWORD_POLICY_VIOLATION` (400): yeni parola en az 15, en çok 128 karakter kuralına
          uymuyor (AUTH-009).
        - `STAFF_LOGIN_FAILED` (401): personel hesabı yok, parola yanlış, hesap devre dışı ya da
          kilitli; dördü ayırt edilemez (AUTH-010, AUTH-011).
        - `STAFF_SESSION_ENDED` (401): personel oturumu çıkış, parola değişimi ya da devre dışı
          bırakmayla sona erdi.
        - `STAFF_PASSWORD_CHANGE_REQUIRED` (403): hesap önce parolasını değiştirmeli (AUTH-014).
        - `STAFF_CURRENT_PASSWORD_MISMATCH` (403): parola değişiminde mevcut parola yanlış.
        - `STAFF_PERMISSION_DENIED` (403): personel, operasyonun `x-authz-permission` iznini
          tutmuyor; ret denetim kaydına yazılır (AUTH-012, ADR-0026).

        Sözleşmesi dondurulmuş ama handler'ı henüz gelmemiş operasyon (ADR-0029 §1):
        - `NOT_IMPLEMENTED` (501): yol ve sözleşmesi vardır, uygulaması yoktur. Operasyon
          spec'te `x-not-implemented` taşır ve bu kod onun `default` yanıtı altında döner;
          `ROUTE_NOT_FOUND` ile karıştırılmaz.

        Kayıt, parola ve doğrulama kodları (ADR-0029 Karar 2-4):
        - `REGISTRATION_TOKEN_INVALID` (400): kayıt bağlantısının ya da kayıt token'ının
          bilinmeyen, iptal edilmiş, süresi dolmuş ya da tüketilmiş hâli; dördü ayırt edilemez.
        - `CONSENT_REQUIRED` (400): zorunlu bir sözleşme sürümüne rıza verilmedi; kayıt token'ı
          tüketilmez.
        - `PASSWORD_RESET_TOKEN_INVALID` (400): sıfırlama token'ının bilinmeyen, süresi dolmuş,
          iptal edilmiş ya da zaten kullanılmış hâli; dördü ayırt edilemez (USR-016).
        - `PASSWORD_MISMATCH` (403): parola değişiminde mevcut parola yanlış.
        - `PASSWORD_REUSED` (400): yeni parola mevcut parolayla aynı.
        - `PASSWORD_CONFIRMATION_MISMATCH` (400): yeni parola onayıyla eşleşmiyor.
        - `VERIFICATION_NOT_FOUND` (404): çağıranın böyle bir doğrulaması yok; başkasınınki de
          aynı yanıtı alır (USR-011).
        - `VERIFICATION_CODE_INVALID` (400): kod yanlış; deneme hakkı bir azalır.
        - `VERIFICATION_CODE_EXPIRED` (400): kodun on dakikası doldu. Süre kontrolü kodun önüne
          geçer, böylece kod doğruluğu sızmaz (USR-012).
        - `VERIFICATION_ATTEMPTS_EXHAUSTED` (409): beş yanlış deneme doldu; doğrulama yakıldı ve
          doğru kodla bile onaylanamaz (USR-009).
        - `VERIFICATION_ALREADY_CONFIRMED` (409): doğrulama zaten onaylanmış; ikinci onay kodu
          hiç bakılmadan reddedilir (USR-013).
        - `VERIFICATION_TARGET_IN_USE` (409): doğrulanmak istenen adres ya da numara başka bir
          hesapta.
        - `VERIFICATION_RESEND_TOO_SOON` (429): yeniden göndermenin bekleme süresi ya da hedef
          başına saatlik bütçe doldu (USR-010); `Retry-After` döner.
        - `USER_NOT_FOUND` (404): kullanıcı yok ya da görme yetkisi yok; ikisi ayırt edilemez.
        - `USER_FIELD_IMMUTABLE` (409): kimlik doğrulandıktan sonra ad, soyad ya da doğum tarihi
          değiştirilemez (USR-024).
        - `USER_MUST_VERIFY_IDENTITY` (403): işlem kimliğin doğrulanmış olmasını istiyor (şirket
          kurmak, şirkete davet edilmek; CMP-001, CMP-009).

        Kimlik incelemesi kodları (ADR-0029 Karar 5):
        - `IDENTITY_ALREADY_VERIFIED` (409): kimliği doğrulanmış kullanıcı yeni gönderim yapamaz.
        - `IDENTITY_REVIEW_PENDING` (409): açık bir inceleme varken ikinci gönderim yapılamaz
          (IDN-002).
        - `IDENTITY_REVIEW_NOT_FOUND` (404): inceleme yok ya da görme yetkisi yok.
        - `IDENTITY_REVIEW_ALREADY_DECIDED` (409): onaylanmış ya da reddedilmiş incelemeye ikinci
          karar verilemez; yarışan iki karardan ikincisi buraya düşer (IDN-010).
        - `IDENTITY_REVIEW_DOCUMENTS_MISSING` (409): onay dört fotoğraf yuvasının hepsini ister;
          anahtarı boşaltılmış yuva kanıt sayılmaz (IDN-008).
        - `IDENTITY_DOCUMENTS_NOT_FOUND` (404): kullanıcı hiç gönderim yapmamış.
        - `IDENTITY_DOCUMENT_NOT_FOUND` (404): fotoğraf bu incelemeye ait değil, anahtarı
          boşaltılmış ya da hiç olmamış; üçü ayırt edilemez (IDN-016).
        - `IDENTITY_NUMBER_IN_USE` (409): kimlik numarası başka bir kullanıcıya onaylanmış
          (IDN-012).

        Şirket, üyelik ve davet kodları (ADR-0029 Karar 7):
        - `COMPANY_NOT_FOUND` (404): şirket yok ya da görme yetkisi yok; yönetici olmayan çağıran
          da bunu alır (CMP-006).
        - `COMPANY_NOT_APPROVED` (409): şirket onaylanmadan ilan yayınlayamaz (CMP-005).
        - `COMPANY_ALREADY_APPROVED` (409): onaylanmış şirket yeniden onaylanamaz.
        - `COMPANY_ALREADY_REJECTED` (409): reddedilmiş şirket ikinci kez reddedilemez.
        - `COMPANY_APPROVED_NOT_REJECTABLE` (409): onaylanmış şirket reddedilemez (CMP-002).
        - `COMPANY_CONTACT_NOT_FOUND` (404): böyle bir üyelik yok.
        - `COMPANY_CONTACT_ALREADY_MEMBER` (409): kişi şirketin zaten üyesi (CMP-011).
        - `COMPANY_LAST_ADMIN_CANNOT_BE_REMOVED` (409): şirketin tek yöneticisi çıkarılamaz
          (CMP-007).
        - `COMPANY_INVITATION_NOT_FOUND` (404): davet yok ya da çağıran tarafı değil; ikisi ayırt
          edilemez ve davetin durumu hiç sorulmaz (CMP-012).
        - `COMPANY_INVITATION_ALREADY_PENDING` (409): aynı kişiye aynı anda ikinci davet
          gönderilemez (CMP-010).
        - `COMPANY_INVITATION_ALREADY_ANSWERED` (409): cevaplanmış ya da geri alınmış davet
          yeniden cevaplanamaz (CMP-014).
        - `COMPANY_INVITATION_EXPIRED` (409): davetin on dört günü doldu (CMP-015).
        - `COMPANY_GALLERY_LIMIT_REACHED` (409): galeri en çok on görüntü taşır (MED-011).
        - `COMPANY_GALLERY_DUPLICATE_IMAGE` (409): aynı medya galeri listesinde iki kez geçiyor;
          sıra anlamlı olduğu için bir görüntünün iki konumu olamaz (CMP-024).

        Medya, adres ve referans kodları (ADR-0029 Karar 6, Karar 8):
        - `MEDIA_NOT_FOUND` (404): medya yok ya da çağıranın değil; ikisi ayırt edilemez.
        - `MEDIA_NOT_READY` (409): medya henüz doğrulanıp striplenmedi; bir kaynağa bağlanamaz.
        - `MEDIA_UPLOAD_INCOMPLETE` (409): karantinada nesne yok; istemci yazma adresine hiç
          yazmamış.
        - `MEDIA_TYPE_UNSUPPORTED` (400): içerikten saptanan tip kabul edilenlerden değil.
          İstemcinin beyanı ve dosya adının uzantısı karara girmez (IDN-003).
        - `MEDIA_TOO_LARGE` (400): nesne boyut ya da tuval sınırını aşıyor (IDN-004).
        - `ADDRESS_NOT_FOUND` (404): adres yok ya da çağıranın değil; ikisi ayırt edilemez.
        - `ADDRESS_SEARCH_SESSION_NOT_FOUND` (404): arama oturumu yok, süresi dolmuş ya da başka
          bir kullanıcının; üçü ayırt edilemez (MED-010).
        - `ADDRESS_PROVIDER_UNAVAILABLE` (502): adres sağlayıcısı yanıt vermiyor.
        - `REFERENCE_ITEM_NOT_FOUND` (404): referans verisinde böyle bir satır yok.
        - `ADDRESS_OUTSIDE_SERVICE_AREA` (400): harita konumu hizmet alanının dışında ya da
          adrese eşleşmiyor.
        - `EDUCATION_NOT_FOUND` (404): eğitim kaydı yok ya da çağıranın değil; ikisi ayırt
          edilemez.
        - `EDUCATION_PERIOD_INVALID` (400): bitiş yılı başlangıç yılından küçük.

        Alan kodları (`ProblemField.code`, `REQUEST_INVALID` ile gelir):
        - `FIELD_REQUIRED`: zorunlu alan ya da parametre yok.
        - `FIELD_UNKNOWN`: istek şemasında olmayan alan; gövdesi olmayan operasyona gövde.
        - `FIELD_TYPE_INVALID`: JSON ya da parametre tipi yanlış.
        - `FIELD_FORMAT_INVALID`: `format` (date-time, uuid, …) uymuyor.
        - `FIELD_VALUE_INVALID`: enum, const, pattern ya da bileşik şema uymuyor.
        - `FIELD_OUT_OF_RANGE`: sayı, uzunluk ya da öğe sayısı sınır dışında.
      enum:
        - INTERNAL
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - REQUEST_BODY_TOO_LARGE
        - CONTENT_TYPE_UNSUPPORTED
        - REQUEST_INVALID
        - REQUEST_BODY_MALFORMED
        - SORT_FIELD_NOT_ALLOWED
        - CURSOR_INVALID
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_USE
        - APP_VERSION_UNSUPPORTED
        - SOFT_DELETE_RESTRICTED
        - RESTORE_CONFLICT
        - RESTORE_PARENT_DELETED
        - RESTORE_EXPIRED
        - DELETION_NOT_FOUND
        - DELETION_ALREADY_RESTORED
        - PATH_INVALID
        - RATE_LIMITED
        - REALTIME_TICKET_INVALID
        - REALTIME_TICKET_RATE_LIMITED
        - REALTIME_DEVICE_REQUIRED
        - REALTIME_PROTOCOL_UNSUPPORTED
        - REALTIME_ORIGIN_FORBIDDEN
        - REALTIME_DRAINING
        - REALTIME_TOO_MANY_CONNECTIONS
        - REALTIME_COMMAND_UNKNOWN
        - REALTIME_COMMAND_INVALID
        - REALTIME_RATE_LIMITED
        - CONVERSATION_NOT_FOUND
        - AUTH_EMAIL_OR_PASSWORD_MISMATCH
        - AUTH_ACCOUNT_SUSPENDED
        - AUTH_TOKEN_MISSING
        - AUTH_TOKEN_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_NOT_FOUND_OR_INACTIVE
        - AUTH_SESSION_NOT_MATCHING_CURRENT_DEVICE
        - AUTH_REFRESH_TOKEN_INVALID
        - AUTH_REFRESH_TOKEN_EXPIRED
        - AUTH_REFRESH_TOKEN_REUSED
        - AUTH_SESSION_NOT_FOUND
        - PASSWORD_POLICY_VIOLATION
        - STAFF_LOGIN_FAILED
        - STAFF_SESSION_ENDED
        - STAFF_PASSWORD_CHANGE_REQUIRED
        - STAFF_CURRENT_PASSWORD_MISMATCH
        - STAFF_PERMISSION_DENIED
        - NOT_IMPLEMENTED
        - REGISTRATION_TOKEN_INVALID
        - CONSENT_REQUIRED
        - PASSWORD_RESET_TOKEN_INVALID
        - PASSWORD_MISMATCH
        - PASSWORD_REUSED
        - PASSWORD_CONFIRMATION_MISMATCH
        - VERIFICATION_NOT_FOUND
        - VERIFICATION_CODE_INVALID
        - VERIFICATION_CODE_EXPIRED
        - VERIFICATION_ATTEMPTS_EXHAUSTED
        - VERIFICATION_ALREADY_CONFIRMED
        - VERIFICATION_TARGET_IN_USE
        - VERIFICATION_RESEND_TOO_SOON
        - USER_NOT_FOUND
        - USER_FIELD_IMMUTABLE
        - USER_MUST_VERIFY_IDENTITY
        - IDENTITY_ALREADY_VERIFIED
        - IDENTITY_REVIEW_PENDING
        - IDENTITY_REVIEW_NOT_FOUND
        - IDENTITY_REVIEW_ALREADY_DECIDED
        - IDENTITY_REVIEW_DOCUMENTS_MISSING
        - IDENTITY_DOCUMENTS_NOT_FOUND
        - IDENTITY_DOCUMENT_NOT_FOUND
        - IDENTITY_NUMBER_IN_USE
        - COMPANY_NOT_FOUND
        - COMPANY_NOT_APPROVED
        - COMPANY_ALREADY_APPROVED
        - COMPANY_ALREADY_REJECTED
        - COMPANY_APPROVED_NOT_REJECTABLE
        - COMPANY_CONTACT_NOT_FOUND
        - COMPANY_CONTACT_ALREADY_MEMBER
        - COMPANY_LAST_ADMIN_CANNOT_BE_REMOVED
        - COMPANY_INVITATION_NOT_FOUND
        - COMPANY_INVITATION_ALREADY_PENDING
