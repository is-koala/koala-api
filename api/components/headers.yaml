# Ortak başlıklar (ADR-0005 madde 6-7, plan §4.1-6, §4.1-7).
#
# Platform başlıkları (X-Request-Id, X-Device-Id, X-App-Version,
# X-Client-Platform) middleware'de zorlanır ve operasyonlara yazılmaz;
# zorunlulukları middleware testleri kanıtlar (httpx TestClientGate,
# ADR-0021). Burada tek yerde tanımlıdırlar
# ki istemciler tip ve sabit üretsin (docs/api-style-guide.md §10). Idempotency-Key operasyona özgüdür:
# gerektiren her POST onu parameters'ta referanslar.
openapi: 3.1.1
info:
  title: Koala ortak bileşenleri - başlıklar
  version: 1.0.0
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        İsteğin tekil anahtarı (IETF draft-ietf-httpapi-idempotency-key-header).
        İstemci her mantıksal işlem için yeni bir UUID üretir ve yeniden denemede
        aynısını gönderir. Çıplak değer (Stripe) ve taslaktaki tırnaklı
        structured-field string (`"…"`) ikisi de kabul edilir; tırnaklar soyulur
        (httpx.IdempotencyKey). 8–255 karakter `[A-Za-z0-9_.:-]` (öneri). Aynı anahtar farklı gövdeyle gelirse 422
        `IDEMPOTENCY_KEY_REUSED`, ilk istek sürerken gelirse 409
        `IDEMPOTENCY_KEY_IN_USE` döner. Anahtar aktör ve operasyonla birlikte
        saklanır.
      schema:
        type: string
        pattern: '^([A-Za-z0-9_.:-]{8,255}|"[A-Za-z0-9_.:-]{8,255}")$'
        examples: [0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10, '"0192f3c4-7b1a-7cc0-9a51-3f2b8e4d6a10"']

    XRequestId:
      name: X-Request-Id
      in: header
      description: |
        İsteğe bağlı istek kimliği. İyi biçimliyse (en fazla 64 karakter,
        `[A-Za-z0-9._-]`) sunucu onu kullanır, değilse yenisini üretir; değer
        her yanıtta döner.
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"

    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        Kurulumun kalıcı cihaz kimliği; istemci bir kez üretir ve saklar. `/v1/admin`
        dışındaki her istekte zorunludur; yoksa ya da biçimi tutmuyorsa 400
        `REQUEST_INVALID` (`parameter: X-Device-Id`, `in: HEADER`) döner. Tek istisna
        tarayıcının WebSocket handshake'idir: tarayıcı başlık gönderemez, cihaz bağı
        biletten gelir (ADR-0018, ADR-0022).
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"

    XAppVersion:
      name: X-App-Version
      in: header
      description: |
        İstemci sürümü (semver). Yalnız `IOS` ve `ANDROID` istemcisi için okunur ve
        zorunludur: yoksa, okunamıyorsa ya da en düşük desteklenen sürümün
        (`KOALA_MIN_APP_VERSION`) altındaysa yanıt 400 `APP_VERSION_UNSUPPORTED` +
        `X-Minimum-App-Version` olur (426 değil, ADR-0019). Pre-release sürümü kendi
        sürümünden önce gelir (`1.4.0-beta.1` < `1.4.0`); `+build` sırayı etkilemez.
        Kapı yönlendirmeden önce, WebSocket dahil her yolda çalışır (ADR-0021).
      # SemVer 2.0.0's regular expression with numbers of at most 9 digits
      # (Java's AppVersion rule), exactly as internal/platform/appversion
      # parses it; api TestAppVersionPatternMatchesParser compares the two.
      schema:
        type: string
        maxLength: 64
        pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-(0|[1-9][0-9]{0,8}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]{0,8}|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        examples: [0.9.32, 1.4.0-beta.1, 1.1.1+3]

    XClientPlatform:
      name: X-Client-Platform
      in: header
      description: |
        İstemcinin platformu; hangi başlık kuralının uygulanacağını belirler (ADR-0021):
        `IOS` ve `ANDROID` sürüm kapısından geçer ve `X-Device-Id` gönderir; `WEB`
        `X-Device-Id` gönderir, sürüm kapısı yoktur; `ADMIN` yalnız `/v1/admin`
        altında geçerlidir ve oradaki tek değerdir (başlık hiç gönderilmeyebilir).
        `/v1/admin` dışında zorunludur; yoksa ya da bilinmeyen bir değerse 400
        `REQUEST_INVALID` döner. Sunucu değeri harf duyarsız eşler (`web` = `WEB`);
        kanonik biçim bu enum'daki büyük harftir. Değer istemcinin beyanıdır; yetki
        kararında kullanılmaz (ADR-0021).
      schema:
        $ref: "#/components/schemas/ClientPlatform"

  headers:
    XRequestId:
      description: İsteğin kimliği; log'larla eşleştirmek için.
      schema:
        type: string
    XMinimumAppVersion:
      description: Desteklenen en düşük istemci sürümü (400 `APP_VERSION_UNSUPPORTED` ile döner).
      schema:
        type: string
    RetryAfter:
      description: Yeniden denemeden önce beklenecek saniye (429 ve 503 ile döner).
      schema:
        type: integer
        format: int32
        minimum: 0
    Deprecation:
      description: |
        RFC 9745. Operasyonun kullanımdan kalktığı an, structured field date
        (`@1767225600`).
      schema:
        type: string
    Sunset:
      description: RFC 8594. Operasyonun kaldırılacağı an, HTTP-date.
      schema:
        type: string

  schemas:
    ClientPlatform:
      type: string
      description: İstemci platformu.
      enum: [IOS, ANDROID, WEB, ADMIN]
