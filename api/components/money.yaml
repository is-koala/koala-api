# Para ve oran (ADR-0008, K5). Tutar en küçük birimde (kuruş) tam sayıdır;
# float ya da string ondalık kullanılmaz.
openapi: 3.1.1
info:
  title: Koala ortak bileşenleri - para
  version: 1.0.0
components:
  schemas:
    Money:
      type: object
      description: |
        Para tutarı, Stripe/Adyen biçimi: tutar para biriminin en küçük biriminde
        (TRY için kuruş) tam sayıdır. `{"amount": 15000, "currency": "TRY"}` 150,00 TL'dir.
        İstemci tutarı float'a çevirmeden gösterir.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          description: "En küçük birimde tutar (kuruş). İşaret alanın anlamına bağlıdır; çoğu alan `minimum: 0` ile daraltır."
          examples: [15000]
        currency:
          $ref: "#/components/schemas/CurrencyCode"
      examples:
        - amount: 15000
          currency: TRY

    CurrencyCode:
      type: string
      description: ISO 4217 alfabetik kod. v1'de yalnız TRY.
      enum: [TRY]

    BasisPoints:
      type: integer
      format: int32
      description: |
        Oran, baz puan olarak: 1 bp = %0,01; 1250 = %12,5; 10000 = %100.
        Oran alanlarının adı `Bps` ile biter (`commissionBps`).
      minimum: 0
      maximum: 10000
      examples: [1250]
