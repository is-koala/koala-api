name: koala-api verify

# The quality gate: `make verify` (CLAUDE.md, ADR-0004). Heavy work never
# runs on the shared Mac; this workflow is the only place the gate runs.
# push: main records the result for the SHA that squash merge creates.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its older run. main runs do not cancel a run in
# progress, but GitHub keeps at most one pending run per group: when merges
# land faster than verify finishes, a newer pending main run replaces the
# older pending one, which ends "cancelled" and leaves that SHA without a
# green push: main run. Re-run it if that SHA is to be released
# (docs/runbook/yayin.md).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres for the integration tests (ADR-0017). The
    # runner starts it and waits for the health check before the first
    # step. Same major version as the Java backend (17). trust auth: no password
    # value exists anywhere; the port is bound to the runner's loopback only.
    # Tests create their own databases and logins (ADR-0017).
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the toolchain line of go.mod (go1.27.3).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify

      - name: Integration tests
        run: make test-integration
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGSSLMODE: disable

  # The image (ADR-0023): built on every PR and main push. It is not pushed
  # to GHCR; only to this job's own throwaway registry, where the release's
  # publish path runs unchanged. The smoke test runs it against Postgres:
  # nonroot, startup < 1 s (plan §6.1 Faz 1), release-db.sh, koala
  # healthcheck, the /readyz drain on SIGTERM. Results and the image size
  # are in the job summary.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      registry:
        image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
        ports:
          - 127.0.0.1:5000:5000
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit pinned like the base images; network=host lets the builder
      # push to the job registry on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            network=host

      - name: Release version rules
        run: scripts/release.sh self-test

      - name: Version
        id: version
        run: echo "version=ci-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: scripts/image.sh build "$VERSION" koala-api:ci
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Smoke test
        run: scripts/image.sh smoke koala-api:ci "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to the job registry (release path)
        run: scripts/image.sh publish localhost:5000/koala-api "$VERSION" koala-api:ci
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ATTEST_DIR: ${{ runner.temp }}/attest

  # Authz conformance (plan §5.6-5, ADR-0014, ADR-0024): every [go, openfga]
  # row of internal/authz/testdata/matrix.yaml runs on the Go evaluator and
  # on a real OpenFGA server; any difference is red. In-memory datastore,
  # playground off; the HTTP API is bound to the runner's loopback only.
  # The image is pinned by digest (multi-arch index of v1.22.0).
  authz-conformance:
    name: authz-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      openfga:
        image: openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
        command: run
        env:
          OPENFGA_DATASTORE_ENGINE: memory
          OPENFGA_PLAYGROUND_ENABLED: "false"
        ports:
          - 127.0.0.1:8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The test waits for /healthz itself (up to 90 s).
      - name: Conformance (Go evaluator vs OpenFGA)
        run: make test-conformance
        env:
          FGA_API_URL: http://127.0.0.1:8080
