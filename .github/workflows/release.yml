name: koala-api release

# Release (ADR-0023, docs/runbook/yayin.md). Pushing a v* tag:
#   gate     the tag is semver, its commit is on main, and verify.yml has a
#            green push: main run for that SHA (make verify, integration
#            tests, image smoke). A tag pushed too early fails here; re-run
#            this workflow once verify is green.
#   publish  the image is built, smoke-tested against Postgres, then pushed
#            to ghcr.io/is-koala/koala-api:<tag> (and :latest for a stable
#            tag) as a single linux/amd64 manifest. An existing tag is never
#            overwritten. SBOM (SPDX) and SLSA provenance come from BuildKit.
#   github-release  a GitHub release for the tag with the SBOM, the
#            provenance, the image digest and their SHA256SUMS.
#   deploy   Dokploy's webhook. Off until Faz 9: it runs only when the
#            repository variable DOKPLOY_DEPLOY_ENABLED is 'true'.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; every job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/is-koala/koala-api

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare the tag's commit with main
      actions: read # read verify.yml runs
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - name: Check tag, main and verify
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            fail "$TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]."

          # identical or ahead: main contains the tag's commit.
          status="$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)"
          case "$status" in
            identical | ahead) ;;
            *) fail "$SHA is not on main (compare: $status). Tag a commit of main." ;;
          esac

          green="$(gh run list -R "$REPO" --workflow verify.yml --event push --branch main \
            --commit "$SHA" --status success --json databaseId --jq length)"
          [ "$green" -gt 0 ] ||
            fail "No green 'koala-api verify' push: main run for $SHA. Wait for it, then re-run this workflow."

          # A pre-release (v1.2.3-rc.1) does not move :latest.
          if [[ "$TAG" == *-* ]]; then latest=false; else latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$TAG at $SHA: on main, verify green, latest=$latest"

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io/is-koala/koala-api
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TAG: ${{ github.ref_name }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published tag is immutable: a second run for the same tag stops
      # here instead of replacing the image Dokploy may already run.
      - name: Refuse to overwrite
        run: |
          set -euo pipefail
          # Before the first release the package itself does not exist and
          # GHCR may answer "name unknown" or "denied"; a real permission
          # problem then fails the push below, so nothing is overwritten.
          if out="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "::error::$IMAGE:$TAG already exists. Release a new tag."
            exit 1
          elif ! grep -qiE 'not found|manifest unknown|name unknown|denied' <<<"$out"; then
            echo "$out"
            echo "::error::Could not query GHCR for $IMAGE:$TAG."
            exit 1
          fi

      - name: Build
        run: scripts/image.sh build "$TAG" koala-api:release

      - name: Smoke test
        run: scripts/image.sh smoke koala-api:release "$TAG"

      - name: Publish
        run: scripts/image.sh publish "$IMAGE" "$TAG" ${{ needs.gate.outputs.latest == 'true' && '--latest' || '' }}
        env:
          ATTEST_DIR: ${{ runner.temp }}/attest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest
          path: ${{ runner.temp }}/attest/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: github-release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release for the existing tag
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attest
          path: attest

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd attest
          sha256sum -c SHA256SUMS
          ref="$(jq -r .reference image.json)"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          cat > notes.md <<EOF
          Image: \`$ref\`

          Attached: \`sbom.spdx.json\` (SPDX), \`provenance.json\` (SLSA, BuildKit),
          \`image.json\` and \`SHA256SUMS\`. See docs/runbook/yayin.md.
          EOF
          gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" \
            --notes-file notes.md "${prerelease[@]}" \
            image.json sbom.spdx.json provenance.json SHA256SUMS

  # Off until Faz 9 (ADR-0023). Before it is turned on, the database step
  # (scripts/release-db.sh) needs a place to run; see the runbook.
  deploy:
    name: deploy
    needs: publish
    if: vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          [ -n "$DOKPLOY_DEPLOY_WEBHOOK" ] || { echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret is not set."; exit 1; }
          curl -fsS -o /dev/null --max-time 30 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
