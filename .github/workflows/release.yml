name: koala-api release

# Release (ADR-0023, docs/runbook/yayin.md). Dispatched from main with a
# version; the git tag comes last, so no v* tag exists without its image:
#   gate     on main; the version is SemVer, new and greater than every
#            release; verify.yml has a green push: main run for this SHA
#            (all four jobs: verify, integration, image, authz-conformance;
#            a run is green only when every job is).
#   publish  build, smoke test against Postgres, push untagged by digest,
#            check (single image manifest, same layers/config/binary as the
#            smoke-tested image, SBOM, provenance), then tag
#            ghcr.io/is-koala/koala-api:<version> (the image manifest) and
#            :<version>-attest (the index with the attestations). No :latest.
#   tag      the annotated v* tag on this SHA, then the GitHub release with
#            image.json, the SBOM, the provenance and SHA256SUMS.
#   deploy   Dokploy, for a stable version only, and only when the
#            repository variable DOKPLOY_DEPLOY_ENABLED is 'true' (Faz 9).
#
# A v* tag pushed by hand never builds anything; release-tag-guard.yml
# turns red when its image is missing. A tag created here with
# GITHUB_TOKEN starts no other workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vMAJOR.MINOR.PATCH[-PRERELEASE] (e.g. v0.1.0)
        required: true
        type: string

# One release at a time. GitHub keeps at most one pending run in a group: a
# third dispatch while one runs and one waits cancels the waiting one.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; every job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/is-koala/koala-api
  VERSION: ${{ inputs.version }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # list tags, run scripts/release.sh
      actions: read # read verify.yml runs
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check branch, version and verify
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$GITHUB_REF" = refs/heads/main ] || fail "Dispatch the release from main, not $GITHUB_REF."

          gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref | sub("^refs/tags/"; "")' \
            > "$RUNNER_TEMP/tags"
          scripts/release.sh check-version "$VERSION" "$RUNNER_TEMP/tags" >> "$GITHUB_OUTPUT"

          green="$(gh run list -R "$REPO" --workflow verify.yml --event push --branch main \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          [ "$green" -gt 0 ] ||
            fail "No green 'koala-api verify' push: main run for $GITHUB_SHA. Wait for it (or re-run it if it was cancelled), then dispatch again."
          echo "$VERSION at $GITHUB_SHA: version ok, verify green"

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io/is-koala/koala-api
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is immutable. Before the first release the
      # package does not exist and GHCR may answer "name unknown" or
      # "denied"; a real permission problem then fails the push.
      - name: Refuse to overwrite
        run: |
          set -euo pipefail
          for ref in "$IMAGE:$VERSION" "$IMAGE:$VERSION-attest"; do
            if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              echo "::error::$ref already exists. Release a new version."
              exit 1
            elif ! grep -qiE 'not found|manifest unknown|name unknown|denied' <<<"$out"; then
              echo "$out"
              echo "::error::Could not query GHCR for $ref."
              exit 1
            fi
          done

      - name: Build
        run: scripts/image.sh build "$VERSION" koala-api:release

      - name: Smoke test
        run: scripts/image.sh smoke koala-api:release "$VERSION"

      - name: Publish
        run: scripts/image.sh publish "$IMAGE" "$VERSION" koala-api:release
        env:
          ATTEST_DIR: ${{ runner.temp }}/attest

      - name: Digest
        id: digest
        run: echo "digest=$(jq -r .digest "$RUNNER_TEMP/attest/image.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest
          path: ${{ runner.temp }}/attest/
          if-no-files-found: error
          retention-days: 30

  tag:
    name: tag
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag and the release
      packages: read # check the image once more before tagging
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attest
          path: attest

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          cd attest
          sha256sum -c SHA256SUMS
          [ "$(jq -r .digest image.json)" = "$DIGEST" ] || fail "image.json does not match the published digest"

          # The image must be there before the tag exists.
          got="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ && !d { d = $2 } END { print d }')"
          [ "$got" = "$DIGEST" ] || fail "$IMAGE:$VERSION is $got, want $DIGEST; not tagging"

          # Annotated tag on this run's commit, through the API (no push
          # credentials in the checkout).
          tag_sha="$(gh api -X POST "repos/$REPO/git/tags" -f tag="$VERSION" -f message="$VERSION" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$tag_sha" >/dev/null

          flags=()
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease); fi
          cat > notes.md <<EOF
          Image: \`$(jq -r .reference image.json)\`
          Attestations: \`$(jq -r .attestations image.json)\`
          Commit: \`$GITHUB_SHA\`

          Attached: \`image.json\`, \`sbom.spdx.json\` (SPDX), \`provenance.json\` (SLSA, BuildKit)
          and \`SHA256SUMS\`. See docs/runbook/yayin.md.
          EOF
          gh release create "$VERSION" -R "$REPO" --verify-tag --title "$VERSION" \
            --notes-file notes.md "${flags[@]}" \
            image.json sbom.spdx.json provenance.json SHA256SUMS

  # Off until Faz 9 (ADR-0023 Karar 4). A pre-release is never deployed.
  # Dokploy must run the immutable reference ghcr.io/is-koala/koala-api:<version>@<digest>;
  # the webhook only redeploys what Dokploy is configured with, so Faz 9
  # adds the step that sets that reference before this one, and the
  # database step (scripts/release-db.sh) before traffic.
  deploy:
    name: deploy
    needs: [gate, publish, tag]
    if: vars.DOKPLOY_DEPLOY_ENABLED == 'true' && needs.gate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          REFERENCE: ${{ env.IMAGE }}:${{ inputs.version }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DOKPLOY_DEPLOY_WEBHOOK" ] || { echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret is not set."; exit 1; }
          echo "Deploying $REFERENCE"
          curl -fsS -o /dev/null --max-time 30 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
