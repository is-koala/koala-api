# Soft-delete catalog (ADR-0013, ADR-0020; plan §3.6-3).
#
# tables: every table of the schema, with its class.
#   soft_delete  the default for a new table (K14). The table has
#                deleted_at + deletion_id and an active_<t> view, written by
#                the `-- +koala soft-delete v1 <t>` directive of its
#                migration. pii: true makes the view a security_barrier
#                (KVKK, ADR-0017 §8). unique_exceptions: {index: reason} for
#                a unique index that is not partial on deleted_at IS NULL.
#   M1–M6        an exemption class of ADR-0013 with its reason:
#                M1 ledger and evidence (never deleted), M2 short-lived,
#                M3 queue, M4 reference, M5 derived, M6 link and setting.
#   tool         a table its tool manages (goose); koala_app and koala_maint
#                hold no privilege on it (ADR-0020).
#
# edges: every foreign key to a soft-deleted table, with its policy.
#   cascade   the child is deleted with the parent (same deletion_id)
#   restrict  deleting a parent with an active child is 409
#   detach    the child stays; queries reach the parent only by
#             LEFT JOIN active_<parent> (CheckJoins)
# A cascade or restrict child column needs an index that starts with it.
#
# The catalog tests (internal/platform/softdelete) hold this file equal to
# the database: a new table or foreign key fails them until it is listed
# here. `make generate` writes sqlc.yaml's no-base-table rule from it.

tables:
  users:
    class: soft_delete
    pii: true
  devices:
    class: soft_delete
    pii: true
  staff_members:
    class: soft_delete
    pii: true
    # Staff accounts are created by the bootstrap and staff management as
    # koala_maint; the application only reads and updates them.
    app_view: [SELECT, UPDATE]
  user_sessions:
    class: M2
    reason: >-
      Device-bound marketplace sessions (ADR-0025). Revoked or expired rows
      are hard-deleted by the purge job; a session never comes back.
  user_refresh_tokens:
    class: M2
    reason: >-
      SHA-256 of rotating refresh tokens; purged with their session. Consumed
      rows stay until then, for reuse detection (K12).
  login_attempts:
    class: M2
    pii: true
    reason: >-
      Security log and persistent failure counter of sign-ins (ADR-0025 §5).
      Not M1: it has a fixed 90-day retention and is hard-deleted after it,
      which M1 ("never deleted") forbids. The target is an HMAC of the
      address under a server secret; with the time it is still personal
      data, hence pii.
  staff_login_sources:
    class: M2
    pii: true
    reason: >-
      A staff member's state at one client address (ADR-0025 §6): failure
      counter, address lock and last success (known-good source). A client
      address tied to an account is personal data, hence pii. Retention: a
      row is hard-deleted a day after its last change once its lock has
      ended, or, when the address is a known-good source, 30 days after
      its last success.
  staff_sessions:
    class: M2
    reason: Staff sessions (ADR-0025); hard-deleted after they end.
  staff_refresh_tokens:
    class: M2
    reason: SHA-256 of rotating staff refresh tokens; purged with their session.
  realtime_tickets:
    class: M2
    reason: >-
      Single-use WebSocket tickets that live 60 seconds (ADR-0018); redeemed
      by DELETE, the rest purged.
  deletions:
    class: M1
    reason: >-
      The record of soft deletions: who deleted which root, when and why.
      Evidence for restores and audits; rows are never deleted.
  staff_roles:
    class: M4
    reason: >-
      The staff role catalog (ADR-0026), seeded by migration with Java's
      role ids. A role is retired with retired_at, never deleted: audit
      rows name the roles a decision went through by id (authz.Basis).
  staff_role_permissions:
    class: M6
    reason: >-
      A role's grant of a staff permission (link). The permission codes are
      the code's catalog (internal/authz/permissions.go), held by a CHECK.
      Revoked by hard delete; the change is in authz_change_log.
  staff_role_includes:
    class: M6
    reason: >-
      The role inclusion DAG (link). Acyclic and separation of duties are
      database invariants (0040). Removed by hard delete; the change is in
      authz_change_log.
  staff_role_assignments:
    class: M6
    reason: >-
      A staff member's role (link). Revoked by hard delete, effective on the
      next request (AUTH-012); the change is in authz_change_log.
  authz_change_log:
    class: M1
    reason: >-
      One row per relationship tuple change, written by authz.RelationSink
      in the writer's transaction (plan §5.2-5, ADR-0024 §10). Evidence;
      never updated or deleted.
  admin_audit_entries:
    class: M1
    reason: >-
      The staff audit trail (plan §5.5, ADR-0026): pending and result rows
      of mutations, refusals and sensitive reads, with actor, basis,
      target, action, request id and outcome. Never updated (trigger);
      koala_maint deletes a row only after its retain_until, which the
      database computes from the retention below (FINANCIAL rows 10 years).
    retention:
      entry: P24M
      financial_entry: P10Y
  admin_audit_entry_details:
    class: M1
    pii: true
    reason: >-
      The personal part of an audit entry: the masked request body (at most
      8 KB) and the client address. Never updated; purged by koala_maint
      after the retention below (KVKK: personal data is not kept longer
      than needed).
    retention:
      detail: P6M
  pii_access_log:
    class: M1
    pii: true
    reason: >-
      One row per PII grant (pii.Gate.Open), written in the reading
      transaction: no row, no grant (plan §5.5). Never updated; purged by
      koala_maint after the retention below.
    retention:
      access: P24M
  goose_db_version:
    class: tool
    reason: >-
      goose's migration history, managed by goose as koala_owner. No
      application role holds any privilege on it.
  river_job:
    class: M3
    pii: true
    reason: >-
      River's job queue (ADR-0010); River manages its rows. pii: the jobs of
      a registration start and a password reset request carry the address
      (and the names) they were asked for, because deciding in the job, not
      in the request, is what keeps the request from telling a registered
      address apart (ADR-0032). The notice of a confirmed e-mail change
      carries the previous address, which the account no longer holds
      (ADR-0033). River deletes a finished job after its retention
      (completed and canceled 24 hours, discarded 7 days).
  pending_registrations:
    class: M2
    pii: true
    reason: >-
      A registration between its first and third step (ADR-0029 Karar 2):
      address, names and the SHA-256 digests of its two tokens. The address
      and the names are cleared the moment the registration is consumed or
      revoked (KVKK data minimization); the row stays, with the keyed
      mailbox and its times only, until it is hard-deleted 30 days after it
      was written (USR-007), so the mail budget can count it (ADR-0032
      Karar 6). The mailbox key is an HMAC-SHA256 under the login pepper,
      not an address: the budget only compares keys, and a leaked table
      cannot be matched against a list of addresses (the login_attempts
      target's scheme). Not soft-deleted: a registration never comes back.
  registration_requests:
    class: M2
    reason: >-
      The global registration mail cap's ledger (ADR-0032 Karar 6): one row
      per handled registration request, written before the address is
      looked up, with its time only. No address, no key, no user.
      Hard-deleted a day after.
  password_reset_tokens:
    class: M2
    reason: >-
      SHA-256 digests of password reset tokens (ADR-0029 Karar 4): single
      use, fifteen minutes. Hard-deleted 30 days after the request; a used
      or revoked row stays until then so the per-user mail budget can count
      it (ADR-0032).
  user_verifications:
    class: M2
    pii: true
    reason: >-
      One e-mail or phone verification of a signed-in user (ADR-0029 Karar
      3, ADR-0033): the new address or number, the keyed digest of its
      six-digit code (HMAC under a key derived from the login pepper, so a
      leaked table yields no code; cleared when the verification ends), the
      failed attempts and the end. The target is personal data, hence pii.
      target_key is the HMAC of the budget key (mailbox or number), so the
      resend budget compares keys, not addresses. Hard-deleted two days
      after the row was written: the longest budget window is a day. Not
      soft-deleted: a verification never comes back.
  agreement_versions:
    class: M4
    reason: >-
      The agreements a registration consents to, one current version per
      document, seeded by migration. A version is retired with retired_at,
      never deleted: consent records name it.
  consent_records:
    class: M1
    pii: true
    reason: >-
      One consent decision of a user at registration (USR-006): evidence of
      who agreed to which version, when, from which client address and
      User-Agent. Appended, never updated or deleted; an account's
      anonymization keeps it (koala-backend ADR-0012). Rule (ADR-0032 Karar
      8, legal confirmation pending): ip_address and user_agent are
      anonymized three years after the consent ends (withdrawn, replaced by
      a new version, or the account deleted); the row itself stays. A
      consent's end is not modeled yet, so the anonymization job comes with
      the PR that models it.
  idempotency_keys:
    class: M2
    pii: true
    reason: >-
      The Idempotency-Key store (ADR-0034, plan §4.1-6): per (actor,
      operation, key) the keyed HMAC of the request and, once it finished,
      the response sealed under a key derived from the request and the
      login pepper. Hard-deleted 24 hours after the row was written
      (Stripe's window); a key never comes back. pii: the actor is a user
      or staff id, and a stored response may carry personal data (an
      address an operation returns): encrypted personal data is still
      personal data, so the table is in the retention inventory even though
      the database alone cannot open a response. completeRegistration's
      response carries a session's tokens, no personal data.
  media:
    class: soft_delete
    pii: true
  media_upload_starts:
    class: M2
    pii: true
    reason: >-
      The daily upload budget's ledger (ADR-0035 Karar 6): one row per
      started upload, with its user and time and nothing else. A ledger of
      its own because a soft-deleted media row leaves active_media, so a
      budget that counted media could be refilled by deleting uploads.
      Hard-deleted a day after the row was written: the budget window is a
      day. pii: the user id ties the row to a person. No foreign key: the
      row outlives nothing and the purge does not wait for the user.
  river_leader:
    class: M3
    reason: River's leader election (ADR-0010).
  river_notification:
    class: M3
    reason: River's notification table (ADR-0010).
  river_queue:
    class: M3
    reason: River's queue settings (ADR-0010).

edges:
  # A user's devices go with the user.
  - child: devices
    column: user_id
    parent: users
    policy: cascade
  # Sessions are M2 and cannot cascade. A session of a deleted user or
  # device is dead: the session check reaches both parents by LEFT JOIN
  # and requires them active (ADR-0025).
  - child: user_sessions
    column: user_id
    parent: users
    policy: detach
  - child: user_sessions
    column: device_id
    parent: devices
    policy: detach
  - child: staff_sessions
    column: staff_id
    parent: staff_members
    policy: detach
  - child: staff_login_sources
    column: staff_id
    parent: staff_members
    policy: detach
  # A deleted staff member's role assignments stay (a restore brings them
  # back); a deleted member cannot sign in, and authz_tuples reaches the
  # member by LEFT JOIN and drops its tuples.
  - child: staff_role_assignments
    column: staff_id
    parent: staff_members
    policy: detach
  # A deleted user's reset tokens are dead: consuming one locks the user's
  # active row first. The rows are M2 and cannot cascade.
  - child: password_reset_tokens
    column: user_id
    parent: users
    policy: detach
  # A deleted user's verifications are dead: confirming one locks the
  # user's active row first, and its caller no longer authenticates. The
  # rows are M2 and cannot cascade.
  - child: user_verifications
    column: user_id
    parent: users
    policy: detach
  # A user's media go with the user (ADR-0035 Karar 7): the rows are
  # soft-deleted in the account's deletion and come back with its restore.
  # The objects stay in the store until the account is anonymized.
  - child: media
    column: owner_id
    parent: users
    policy: cascade
  # Consent evidence outlives the account (M1).
  - child: consent_records
    column: user_id
    parent: users
    policy: detach
