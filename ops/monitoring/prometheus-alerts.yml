# Prometheus alert rules of koala-api (ADR-0021, plan §3.10). They replace
# koala-backend's ops/monitoring/prometheus-alerts.yml; ADR-0021 maps each
# of its 19 rules to the rule here or to the phase that brings its metric.
#
# internal/app TestAlertRulesUseRegisteredMetrics fails when a rule names a
# metric the service does not register, so a rule cannot stay silently
# green on a series that never exists. Metrics exported by something other
# than the service (the backup script, the blackbox exporter) are listed in
# that test.
groups:
  - name: koala-api
    rules:
      - alert: KoalaHighHttp5xxRate
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "API HTTP 5xx oranı yüzde 5'i aştı" }
      - alert: KoalaRateLimitBucketsEvicted
        expr: increase(koala_http_rate_limit_evicted_total[15m]) > 0
        for: 1m
        labels: { severity: warning, owner: backend }
        annotations: { summary: "Oran sınırı kova üst sınırına ulaştı ve kova attı; adres seli ya da düşük sınır (ADR-0021)" }
      - alert: KoalaRateLimitedSpike
        expr: sum by (group) (rate(koala_http_rate_limited_total[5m])) > 1
        for: 10m
        labels: { severity: warning, owner: backend }
        annotations: { summary: "Bir oran sınırı grubunda saniyede 1'den fazla 429 dönüyor; saldırı ya da dar sınır" }
      - alert: KoalaBackupStale
        expr: time() - koala_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels: { severity: critical, owner: platform }
        annotations: { summary: "Başarılı veritabanı yedeği 26 saati geçti" }
      - alert: KoalaCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 1209600
        for: 1h
        labels: { severity: warning, owner: platform }
        annotations: { summary: "TLS sertifikasının bitmesine 14 günden az kaldı" }
      # Background workers (ADR-0025 §7, issue #7): koala_workers_up is 1
      # while serve's River client runs; a start that keeps failing shows
      # as the counter rising while the gauge stays 0.
      - alert: KoalaWorkersDown
        expr: min(koala_workers_up) < 1
        for: 10m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Arka plan işçileri (River) 10 dakikadır çalışmıyor; temizlik ve kuyruk işleri durdu" }
      - alert: KoalaWorkerStartFailing
        expr: increase(koala_worker_start_failures_total[15m]) > 3
        for: 0m
        labels: { severity: warning, owner: backend }
        annotations: { summary: "River istemcisi 15 dakikada 3'ten fazla kez başlatılamadı; veritabanı erişimi ya da yapılandırma" }
      # Sign-in locks (ADR-0025 §5–6, issue #7). A staff address lock or an
      # account backoff means someone is guessing a staff password; a burst
      # of marketplace target locks is credential stuffing.
      - alert: KoalaStaffLockout
        expr: sum by (scope) (increase(koala_auth_lockouts_total{principal="staff"}[15m])) > 0
        for: 0m
        labels: { severity: warning, owner: security }
        annotations: { summary: "Bir personel hesabı adres kilidine ya da beklemeye girdi; parola tahmini olabilir" }
      - alert: KoalaUserLockoutSpike
        expr: sum by (principal, scope) (increase(koala_auth_lockouts_total{principal="user"}[15m])) > 10
        for: 5m
        labels: { severity: warning, owner: security }
        annotations: { summary: "15 dakikada 10'dan fazla pazaryeri girişi kilitlendi; kimlik bilgisi doldurma saldırısı olabilir" }
