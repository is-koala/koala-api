# Catalog of the example tables of the test databases
# (testdata/migrations/900x_*). Tests merge it with db/softdelete.yaml; the
# catalog tests then hold the merged catalog equal to the test database.
tables:
  example_notes:
    class: soft_delete
  example_owners:
    class: soft_delete
    pii: true
  example_projects:
    class: soft_delete
  example_tasks:
    class: soft_delete
  example_invoices:
    class: soft_delete
  example_comments:
    class: soft_delete
  example_folders:
    class: soft_delete
  example_receipts:
    class: M1
    reason: Example ledger table; an exempt child on a restrict edge.

edges:
  - child: example_projects
    column: owner_id
    parent: example_owners
    policy: cascade
  - child: example_tasks
    column: project_id
    parent: example_projects
    policy: cascade
  - child: example_invoices
    column: project_id
    parent: example_projects
    policy: restrict
  - child: example_invoices
    column: task_id
    parent: example_tasks
    policy: cascade
  - child: example_comments
    column: author_id
    parent: example_owners
    policy: detach
  - child: example_folders
    column: parent_id
    parent: example_folders
    policy: cascade
  - child: example_receipts
    column: project_id
    parent: example_projects
    policy: restrict
