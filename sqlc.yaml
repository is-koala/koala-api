# sqlc configuration (ADR-0012, ADR-0020). `make generate` runs
# `sqlc generate` with the version pinned in the Makefile; `make verify`
# runs `sqlc vet` and fails when the generated code is stale (gen-check).
#
# Layout:
#   db/queries/<area>/*.sql  application queries, run as koala_app. They use
#                            active_<t> views, never a soft-deleted base table
#                            (rule no-base-table), and never assign deleted_at
#                            or deletion_id (rule no-soft-delete-columns). One
#                            sql entry per area.
#   db/queries/maint/*.sql   koala_maint queries on base tables (restore,
#                            cleanup, anonymization). One package, maintdb,
#                            which depguard opens only to the maintenance
#                            code (.golangci.yml, rule maint).
#
# The schema is the goose migrations; sqlc skips their Down sections.
version: "2"

sql:
  - name: softdelete
    engine: postgresql
    schema: db/migrations
    queries: db/queries/softdelete
    rules:
      - no-base-table
      - no-soft-delete-columns
    gen:
      go:
        package: softdeletedb
        out: internal/platform/softdelete/softdeletedb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true

  - name: authn
    engine: postgresql
    schema: db/migrations
    queries: db/queries/authn
    rules:
      - no-base-table
